# The deployment reads one database through three roles. The migrator owns the
# schema, the runtime role holds neither SUPERUSER nor BYPASSRLS so forced row
# level security binds it, and the background role serves the cross-tenant
# scheduler poll with no blanket table grant.
#
# Create the real Secret out of band; this file documents the shape.
apiVersion: v1
kind: Secret
metadata:
  name: flowdular-database
type: Opaque
stringData:
  migratorUrl: postgresql://coreloom_migrator:CHANGE_ME@postgres:5432/flowdular
  runtimeUrl: postgresql://coreloom_runtime:CHANGE_ME@postgres:5432/flowdular
  backgroundUrl: postgresql://coreloom_background:CHANGE_ME@postgres:5432/flowdular
