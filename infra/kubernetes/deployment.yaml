apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowdular
  labels:
    app.kubernetes.io/name: flowdular
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowdular
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowdular
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/flowdular/flowdular:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: FD_DATABASE_ADAPTER
              value: postgresql
            - name: FD_DATABASE_TLS
              value: verify-full
            # One database for the whole deployment. The runtime role holds
            # neither SUPERUSER nor BYPASSRLS, the migrator owns the schema, and
            # the background role serves the cross-tenant scheduler poll.
            - name: FD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowdular-database
                  key: runtimeUrl
            - name: FD_DATABASE_MIGRATOR_URL
              valueFrom:
                secretKeyRef:
                  name: flowdular-database
                  key: migratorUrl
            - name: FD_DATABASE_BACKGROUND_URL
              valueFrom:
                secretKeyRef:
                  name: flowdular-database
                  key: backgroundUrl
            - name: FD_AUTH_ALLOW_SIGN_UP
              value: 'false'
            - name: FD_AUTH_SECURE_COOKIE
              value: 'true'
            # agents.core refuses to boot in production without both keys.
            # See agents-secret.example.yaml for the Secret shape.
            - name: FD_AGENT_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: credentialKey
            - name: FD_AGENT_RUN_GRANT_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: runGrantKey
            - name: FD_WORKFLOWS_PAYLOAD_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: workflowsPayloadKey
            - name: FD_WORKFLOWS_CURSOR_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: workflowsCursorKey
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
