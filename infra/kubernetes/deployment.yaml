apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowdular
  labels:
    app.kubernetes.io/name: flowdular
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowdular
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowdular
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /api/metrics
        prometheus.io/port: '3000'
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/flowdular/flowdular:0.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: FD_DATABASE_ADAPTER
              value: postgresql
            - name: FD_DATABASE_TLS
              value: verify-full
            # One database for the whole deployment. The runtime role holds
            # neither SUPERUSER nor BYPASSRLS, the migrator owns the schema, and
            # the background role serves the cross-tenant scheduler poll.
            - name: FD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowdular-database
                  key: runtimeUrl
            - name: FD_DATABASE_MIGRATOR_URL
              valueFrom:
                secretKeyRef:
                  name: flowdular-database
                  key: migratorUrl
            - name: FD_DATABASE_BACKGROUND_URL
              valueFrom:
                secretKeyRef:
                  name: flowdular-database
                  key: backgroundUrl
            - name: FD_AUTH_ALLOW_SIGN_UP
              value: 'false'
            - name: FD_AUTH_SECURE_COOKIE
              value: 'true'
            # The Service and any ingress sit in front of this port. Set true
            # only when that ingress overwrites x-forwarded-for.
            - name: FD_TRUST_PROXY
              value: 'false'
            - name: FD_METRICS
              value: 'true'
            # Without a token /api/metrics answers any client that can reach the
            # application port. Optional so a cluster that keeps the port on a
            # scrape-only network can decide to leave it unset.
            - name: FD_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: metricsToken
                  optional: true
            # Outgoing mail. none refuses workspace invitations and delivers no
            # password reset message. Switch to smtp once the Secret carries
            # smtpUrl and set the sender the relay accepts.
            - name: FD_AUTH_MAIL_TRANSPORT
              value: none
            - name: FD_AUTH_MAIL_FROM
              value: ''
            - name: FD_AUTH_SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: smtpUrl
                  optional: true
            # agents.core, automations.core and workflows.core refuse to boot in
            # production without their keys.
            # See agents-secret.example.yaml for the Secret shape.
            - name: FD_AGENT_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: credentialKey
            - name: FD_AGENT_RUN_GRANT_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: runGrantKey
            - name: FD_AUTOMATIONS_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: automationsCredentialKey
            - name: FD_NOTIFICATIONS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: notificationsSecretKey
            - name: FD_WORKFLOWS_PAYLOAD_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: workflowsPayloadKey
            - name: FD_WORKFLOWS_CURSOR_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: workflowsCursorKey
            # Object storage. Production refuses the local adapter, so every object
            # goes to an S3-compatible bucket, encrypted under
            # FD_STORAGE_ENCRYPTION_KEY before it leaves the pod.
            - name: FD_STORAGE_ADAPTER
              value: s3
            - name: FD_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: storageEncryptionKey
            - name: FD_CONNECTORS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: connectorsSecretKey
            - name: FD_AUDIT_ANCHOR_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: auditAnchorKey
            - name: FD_STORAGE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: storageBucket
            - name: FD_STORAGE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: storageRegion
            # Empty for AWS. MinIO and R2 set their own endpoint, and most
            # self-hosted gateways also need FD_STORAGE_S3_FORCE_PATH_STYLE.
            - name: FD_STORAGE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: storageEndpoint
                  optional: true
            - name: FD_STORAGE_S3_FORCE_PATH_STYLE
              value: 'false'
            - name: FD_STORAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: storageAccessKeyId
            - name: FD_STORAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flowdular-agents
                  key: storageSecretAccessKey
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
