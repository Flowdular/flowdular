services:
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: coreloom:local
    environment:
      NODE_ENV: production
      PORT: 3000
      CL_AUTH_DATABASE: /data/auth.db
      CL_AGENTS_DATABASE: /data/agents.db
      CL_WORKFLOWS_DATABASE: /data/workflows.db
      CL_AUTH_ALLOW_SIGN_UP: 'false'
      # TLS terminates in front of this container. Only a plain-HTTP run on a
      # workstation may set CL_AUTH_SECURE_COOKIE=false in .env.
      CL_AUTH_SECURE_COOKIE: ${CL_AUTH_SECURE_COOKIE:-true}
      # Both keys come from infra/docker/.env (copy .env.example). Compose
      # refuses to start without them; the app would refuse at boot anyway.
      CL_AGENT_CREDENTIAL_KEY: ${CL_AGENT_CREDENTIAL_KEY:?Set CL_AGENT_CREDENTIAL_KEY in infra/docker/.env (openssl rand -base64 32)}
      CL_AGENT_RUN_GRANT_KEY: ${CL_AGENT_RUN_GRANT_KEY:?Set CL_AGENT_RUN_GRANT_KEY in infra/docker/.env (openssl rand -base64 32)}
      CL_WORKFLOWS_PAYLOAD_KEY: ${CL_WORKFLOWS_PAYLOAD_KEY:?Set CL_WORKFLOWS_PAYLOAD_KEY in infra/docker/.env (openssl rand -base64 32)}
      CL_WORKFLOWS_CURSOR_KEY: ${CL_WORKFLOWS_CURSOR_KEY:?Set CL_WORKFLOWS_CURSOR_KEY in infra/docker/.env (openssl rand -base64 32)}
    ports:
      - '${CL_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - coreloom-data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  coreloom-data:
