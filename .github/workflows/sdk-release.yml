name: SDK consumer smoke
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/sdk-release.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/sdk-release.yml'
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/platform-release.test.mjs
      # pnpm verify runs in the CI workflow; this job only packs the SDK and
      # installs it into a fresh consumer the way `npm create flowdular` does.
      - run: pnpm release:pack
      - run: pnpm release:smoke
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flowdular-sdk
          path: |
            release-artifacts/sdk/*.tgz
            release-artifacts/sdk/sdk.json
          include-hidden-files: true
          if-no-files-found: error
