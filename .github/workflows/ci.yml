name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/platform-release.test.mjs scripts/tests/test-shards.test.mjs scripts/tests/dom-properties.test.mjs scripts/tests/ui-classes.test.mjs scripts/tests/ui-preview-args.test.mjs scripts/tests/release-versions.test.mjs scripts/tests/render-doc.test.mjs
      # The suites run in the test job below, split into balanced shards.
      - run: pnpm verify:static
      - run: pnpm test:docker-launcher
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-shards.mjs --shard ${{ matrix.shard }}/3

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      # The runtime role must hold neither SUPERUSER nor BYPASSRLS, or the
      # adapter suites would pass against a database that never enforces RLS.
      - name: Create the migrator, runtime and background roles
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          run() { psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 "$@"; }
          run -c "CREATE ROLE flowdular_migrator LOGIN PASSWORD 'migrator' NOSUPERUSER NOBYPASSRLS"
          run -c "CREATE ROLE flowdular_runtime LOGIN PASSWORD 'runtime' NOSUPERUSER NOBYPASSRLS"
          run -c "CREATE ROLE flowdular_background LOGIN PASSWORD 'background' NOSUPERUSER NOBYPASSRLS"
          run -c "CREATE DATABASE flowdular_test OWNER flowdular_migrator"
          run -d flowdular_test -c "GRANT CONNECT ON DATABASE flowdular_test TO flowdular_runtime, flowdular_background"
          run -d flowdular_test -c "REVOKE ALL ON SCHEMA public FROM PUBLIC"
      - name: Adapter matrix
        env:
          FD_TEST_DATABASE_ADAPTER: postgresql
          FD_TEST_POSTGRES_URL: postgres://flowdular_migrator:migrator@127.0.0.1:5432/flowdular_test
          FD_TEST_POSTGRES_RUNTIME_URL: postgres://flowdular_runtime:runtime@127.0.0.1:5432/flowdular_test
          FD_TEST_POSTGRES_BACKGROUND_URL: postgres://flowdular_background:background@127.0.0.1:5432/flowdular_test
        run: |
          pnpm --filter @flowdular/database-testing test
          pnpm --filter @flowdular/module-auth test
          pnpm --filter @flowdular/module-agents test
          pnpm --filter @flowdular/module-profile test
          pnpm --filter @flowdular/module-sandbox test
          pnpm --filter @flowdular/module-automations test
          pnpm --filter @flowdular/module-workflows test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: flowdular:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
