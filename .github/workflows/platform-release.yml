name: Platform release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Committed stable version, without v (example: 0.2.0)'
        required: true
        type: string
      previous_tag:
        description: 'Changelog base; empty selects the latest reachable stable tag'
        type: string
      draft:
        description: 'Keep the complete release as a draft'
        type: boolean
        default: false
      dry_run:
        description: 'Build and sign Actions artifacts without creating a tag or release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  PREVIOUS_TAG: ${{ inputs.previous_tag }}
  RELEASE_DRAFT: ${{ inputs.draft }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Validate release selection
        run: node scripts/platform-release.mjs check
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/platform-release.test.mjs
      - run: pnpm verify
      - run: pnpm build
      - run: pnpm release:pack
      - run: pnpm release:smoke
      - name: Prepare changelog, packages, source archive and checksums
        run: node scripts/platform-release.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: platform-unsigned
          path: release-artifacts/platform/
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: platform-unsigned
          path: release-artifacts/platform
      - run: node scripts/platform-release.mjs verify
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Sign and verify checksums with GitHub OIDC
        working-directory: release-artifacts/platform
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/platform-release.yml@refs/heads/main" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-signed
          path: release-artifacts/platform/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: sign
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: platform-signed
          path: release-artifacts/platform
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Verify signature and selected source before publication
        working-directory: release-artifacts/platform
        run: |
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/platform-release.yml@refs/heads/main" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "$GITHUB_SHA"
          node ../../scripts/platform-release.mjs verify
      - name: Create tag and upload complete release before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/platform-release.mjs publish
