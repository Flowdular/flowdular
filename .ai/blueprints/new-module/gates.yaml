schemaVersion: 1
# Ids equal GateId in packages/sandbox/src/server/gates.ts. The sandbox runs the
# gates a role lists in its front matter after every turn that changed files;
# from the repository root run the command column yourself. Nothing executes
# this file; it documents the contract.
gates:
  - id: spec-schema
    command: pnpm flowdular spec validate --all --json
    sandbox: pnpm flowdular spec validate --all --json --root <session workspace>
    required: true
  - id: module-schema
    command: pnpm flowdular module validate --json
    sandbox: pnpm flowdular module validate --json --root <session workspace>
    required: true
  - id: dependencies
    command: 'grep the imports under src/** and compare with package.json dependencies (no CLI command yet)'
    sandbox: checkDeclaredDependencies(modulePath) in packages/sandbox/src/server/dependencies.ts, run after every turn that changed files, plus a pnpm install when a package.json changed
    required: true
  - id: typecheck
    command: pnpm --filter @flowdular/module-{module} typecheck
    sandbox: node_modules/.bin/tsrx-tsc --noEmit -p tsconfig.json (cwd module)
    required: true
  - id: tests
    command: pnpm --filter @flowdular/module-{module} test
    sandbox: node_modules/.bin/vitest run --passWithNoTests (cwd module; zero tests still pass)
    required: true
  - id: format
    command: pnpm format:check
    sandbox: prettier --check . (cwd module)
    required: true
  - id: auto-review
    command: run the auto-review skill as a separate read-only phase over the finished change
    sandbox: inspectAutoReview(paths, module) in packages/sandbox/src/server/auto-review.ts; the record must match the current module contents, and eject refuses a missing or stale review (GATES in packages/sandbox/src/server/delivery/plan.ts)
    required: true
