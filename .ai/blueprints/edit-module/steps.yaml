schemaVersion: 1
steps:
  - id: spec
    role: business-manager
    action: Update the specification or write its minimal delta first; add the acceptance scenario and invariant, bump specVersion, and leave status draft or in-review for the operator.
    inputs:
      - 'brief'
      - 'base/spec/module.yaml'
    outputs:
      - 'spec/module.yaml'
  - id: approve
    role: orchestrator
    action: Show the spec delta and record the operator approval of its exact content hash. Any later spec edit or request for changes invalidates that module's approval and blocks its implementation again; a module added to the session needs its own approved hash.
    inputs:
      - 'spec/module.yaml'
    outputs:
      - 'approved spec hash'
    gates:
      - 'spec-schema'
  - id: read
    role: backend-engineer
    action: After approval, read the whole module (spec, acl, endpoints, services, client, tests) and the base copy before changing implementation.
    inputs:
      - 'approved spec hash'
      - 'modules/{module}/**'
    outputs: []
  - id: classify
    role: backend-engineer
    action: Name the change class (endpoint, table, column, screen, widget, permission, setting, cross-module-read, fix) and take its touch list from required-files.yaml byChange.
    inputs:
      - 'brief'
    outputs:
      - 'touch list'
  - id: server
    role: backend-engineer
    action: Service method, repository SQL with WHERE tenant_id = ?, numbered ledger migration for a schema change, endpoint with access, resolveIdentity, sessionMutationDenial, readJsonObject; tests for denial and isolation.
    inputs:
      - 'touch list'
    outputs:
      - 'src/services/*.ts'
      - 'src/api/endpoints.ts'
      - 'migrations/*.sql'
      - 'tests/module.test.ts'
    gates:
      - 'module-schema'
      - 'dependencies'
      - 'typecheck'
      - 'tests'
      - 'format'
  - id: client
    role: frontend-engineer
    action: api.ts call, form field or column, contribution entry for a new screen or widget, client logic test.
    inputs:
      - 'src/api/endpoints.ts'
    outputs:
      - 'src/client/**'
      - 'tests/*.test.ts'
    gates:
      - 'dependencies'
      - 'typecheck'
      - 'tests'
      - 'format'
  - id: agent-surface
    role: agentic-engineer
    action: When the approved delta asks for a tool or module-owned business agent, follow agent-tool-design or business-agent-design, register it during composition, and test exact tool ceilings, tenant isolation, live permission refusal, and revision behavior.
    inputs:
      - 'approved spec hash'
      - 'src/api/endpoints.ts'
      - 'src/services/*.ts'
    outputs:
      - 'src/agent/tools.ts when tools are required'
      - 'src/agent/agents.ts when a business agent is required'
      - 'src/platform.ts'
      - 'tests/agent-tools.test.ts'
      - 'tests/business-agents.test.ts'
      - 'module.json'
      - 'package.json'
    gates:
      - 'module-schema'
      - 'dependencies'
      - 'typecheck'
      - 'tests'
      - 'format'
  - id: versions
    role: backend-engineer
    action: Keep module.json and package.json versions equal to the operator-approved specVersion without changing the approved spec content.
    inputs:
      - 'approved spec hash'
    outputs:
      - 'module.json'
      - 'package.json'
    gates:
      - 'module-schema'
  - id: land
    role: orchestrator
    action: 'Sandbox: verify the current spec hash still equals the operator-approved hash, then eject (gates per module, copy and removals, pnpm install, auth sync-scopes, platform typecheck; stops at the first failed step). Direct path: pnpm verify, pull request; auth sync-scopes --apply when a permission was added.'
    inputs:
      - 'modules/{module}/**'
    outputs:
      - 'modules/{module}/**'
    gates:
      - 'spec-schema'
      - 'module-schema'
      - 'dependencies'
      - 'typecheck'
      - 'tests'
      - 'format'
  - id: review
    role: reviewer
    action: Diff against base, exact approved spec hash unchanged, exported names unchanged, versions bumped together, and migration runner evidence covers fresh apply plus adoption of an existing database.
    inputs:
      - 'diff'
      - 'gate evidence'
    outputs:
      - 'review report'
