schemaVersion: 1
# Nothing executes this file; it documents the contract.
gates:
  - id: spec-schema
    command: pnpm coreloom spec validate --all --json
    sandbox: pnpm coreloom spec validate --all --json --root <session workspace>
    required: true
  - id: unresolved-decisions
    assertion: the handoff lists zero open business questions
    required: true
  - id: human-approval
    assertion: status is draft or in-review; an agent never wrote approved
    required: true
