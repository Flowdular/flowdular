schemaVersion: 1
# Repository gates. Nothing executes this file; CI runs the same commands
# (.github/workflows/ci.yml).
gates:
  - id: verify
    command: pnpm verify
    required: true
  - id: build
    command: pnpm build
    required: true
  - id: platform-typecheck
    command: pnpm --filter @coreloom/platform typecheck
    required: true
  - id: audit
    command: pnpm audit --prod --audit-level high
    required: false
