schemaVersion: 1
# What the CLI actually exposes and how the runner gates it. Consumed by nobody:
# packages/cli/src/doctor.ts only checks that this file exists
# (policy.capabilities). The real policy is code: core descriptors in
# packages/cli/src/capabilities.ts, module descriptors in each
# modules/*/src/cli/commands.json, approval logic in packages/cli/src/runner.ts
# (runExtensionCommand). Keep this file in step with those three places.
default: deny

# packages/cli/src/capabilities.ts
core:
  module.search:
    command: pnpm flowdular module search [query]
    risk: read
    note: host-only official HTTPS catalog lookup; does not grant sandbox network access
  module.info:
    command: pnpm flowdular module info <id>
    risk: read
  module.install:
    command: pnpm flowdular module install <id[@version]> [--apply]
    risk: workspace-write
    supportsDryRun: true
    note: host-only source installation; no scripts, activation, permissions or database changes
  module.update:
    command: pnpm flowdular module update <id[@version]> [--apply]
    risk: workspace-write
    supportsDryRun: true
    note: rejects local edits, changed historical migrations and downgrades
  module.recover:
    command: pnpm flowdular module recover [--apply]
    risk: workspace-write
    supportsDryRun: true
    note: requires the original installation process to have exited
  workspace.doctor:
    command: pnpm flowdular doctor
    risk: read
  spec.validate:
    command: pnpm flowdular spec validate --all
    risk: read
  blueprint.validate:
    command: pnpm flowdular blueprint validate --all
    risk: read
    note: validates every .ai/blueprints/*/blueprint.json and checks the companion files exist
  module.validate:
    command: pnpm flowdular module validate
    risk: read
    note: 'schema plus composition entries (PLATFORM_SERVER_ENTRY_MISSING, PLATFORM_EXPORT_MISSING, PLATFORM_CLIENT_ENTRY_MISSING, PLATFORM_CLIENT_EXPORT_MISSING), PACKAGE_NAME_MISMATCH, SPEC_ID_MISMATCH, TRANSLATION_FILE_MISSING, TRANSLATION_KEYS_MISMATCH; warnings SPEC_VERSION_DRIFT, LOCALE_NOT_IN_PROJECT (packages/cli/src/module-validate.ts)'
  module.create:
    command: pnpm flowdular module new <id> --spec <path> [--apply]
    risk: workspace-write
    requiresApprovedSpec: true
    supportsDryRun: true
  migration.status:
    command: pnpm flowdular migration status [--module <id>] [--json]
    risk: read
    note: 'per module database, each migration is applied, adopted (its objects already exist, so the runner will only record it), pending, or mismatch; fails with MIGRATION_CHECKSUM_MISMATCH when an applied migration was edited (packages/cli/src/migration.ts)'
  migration.verify:
    command: pnpm flowdular migration verify
    risk: read
    note: 'checks every ledger row against the checksum of the migration in the workspace; failure code MIGRATION_LEDGER_INVALID with mismatched and unknown ids per module'
  migration.apply.local:
    command: pnpm flowdular migration apply --module <id> [--apply]
    risk: process
    localOnly: true
    supportsDryRun: true
    effect: applies or adopts the outstanding migrations of one module against the configured PostgreSQL (embedded PGlite outside production) and writes the _coreloom_migrations_v2 ledger; without --apply it reports the plan and writes nothing
  workspace.state.migrate:
    command: pnpm flowdular setup migrate-state [--apply --confirm migrate-legacy-state]
    risk: destructive
    localOnly: true
    confirmation: migrate-legacy-state
    supportsDryRun: true
    effect: copies recognized pre-Flowdular databases and vault keys into .flowdular/data, verifies their hashes, and preserves every source file; refuses links, collisions, and database sidecar files

# Commands dispatched by packages/cli/src/runner.ts without a capability descriptor.
commandsWithoutDescriptor:
  - pnpm flowdular help
  - pnpm flowdular capability list|describe <id>|run <id>
  - pnpm flowdular blueprint list
  - pnpm flowdular module list
  - pnpm flowdular module sync [--apply]
  - pnpm flowdular module enable <id> [--apply] (with --apply also runs auth.scopes.sync; result field scopes, failure code MODULE_SCOPES_SYNC_FAILED)
  - pnpm flowdular module disable <id> [--apply]
  - pnpm flowdular setup check
  - pnpm flowdular setup quick (alias of auth.greenfield.reset)

# modules/*/src/cli/commands.json, loaded only for modules enabled in flowdular.json
modules:
  auth.core:
    auth.scopes.list:
      command: pnpm flowdular auth scopes
      risk: read
    auth.scopes.sync:
      command: pnpm flowdular auth sync-scopes --module <id> [--apply]
      risk: process
      supportsDryRun: true
      effect: grants the module spec permissions to every tenant owner in the auth database
    auth.greenfield.reset:
      command: pnpm flowdular auth greenfield --apply --confirm reset-local-auth
      risk: destructive
      localOnly: true
      confirmation: reset-local-auth
      supportsDryRun: true
      effect: resets .flowdular/data/auth.db and seeds demo tenants and accounts
  agents.core:
    agents.status:
      command: pnpm flowdular agents status
      risk: read
    agents.audit.verify:
      command: pnpm flowdular agents audit-verify --tenant <id>
      risk: read
      localOnly: true
  sandbox.core:
    sandbox.access.list:
      command: pnpm flowdular sandbox access
      risk: read
    sandbox.access.grant:
      command: pnpm flowdular sandbox grant [--apply]
      risk: process
      supportsDryRun: true
    sandbox.access.revoke:
      command: pnpm flowdular sandbox revoke [--apply]
      risk: process
      supportsDryRun: true
    sandbox.sessions.list:
      command: pnpm flowdular sandbox sessions
      risk: read
    sandbox.sessions.archive:
      command: pnpm flowdular sandbox session-archive [--apply]
      risk: process
      supportsDryRun: true
    sandbox.sessions.delete:
      command: pnpm flowdular sandbox session-delete [--apply]
      risk: process
      supportsDryRun: true
    sandbox.audit.verify:
      command: pnpm flowdular sandbox audit-verify --tenant <id>
      risk: read
      localOnly: true

# packages/cli/src/runner.ts, runExtensionCommand, in evaluation order.
approvals:
  external: refused with APPROVAL_VERIFIER_REQUIRED (no signed approval verifier exists)
  destructive-not-local: refused with APPROVAL_VERIFIER_REQUIRED
  localOnly: refused with LOCAL_ONLY_CAPABILITY unless FD_ENV or NODE_ENV is development or test (unset counts as development)
  requiresApprovedSpec: needs --spec <path>; APPROVED_SPEC_REQUIRED, SPEC_VALIDATION_FAILED or SPEC_NOT_APPROVED otherwise
  destructive-apply: --apply needs --confirm <descriptor.confirmation>; CONFIRMATION_REQUIRED otherwise
  non-read-without-dry-run: EXPLICIT_APPLY_REQUIRED without --apply
  dry-run: non-read with supportsDryRun and no --apply runs with apply=false and warns "Dry run only. No writes were authorized."

moduleExtensions:
  discovery: module.json cli.catalog (src/cli/commands.json), schema-validated without executing code
  loadImplementation: module.json cli.entry imported only when the command runs (packages/cli/src/extensions.ts loadCliCommand)
  namespace: first segment of the module id; reserved groups help, doctor, capability, spec, blueprint, module, migration, setup
  metadataIdentical: path and capability object must equal the catalog entry
  requireEnabledModule: true

# Planned, no code today. Listed so nobody documents them as available.
planned:
  - migration.plan (served by "migration apply" without --apply, which is a read-only dry run)
  - migration.apply.remote
  - destructive.execute (signed approval receipts)
  - redaction of *_TOKEN, *_SECRET, *_PASSWORD, DATABASE_URL in a shared logger (only packages/ai-provider/src/errors.ts redactSecrets exists)
  - persisted CLI audit (CommandEnvelope carries a random auditId and evidence per invocation; nothing stores it)
