schemaVersion: 1
# What the CLI actually exposes and how the runner gates it. Consumed by nobody:
# packages/cli/src/doctor.ts only checks that this file exists
# (policy.capabilities). The real policy is code: core descriptors in
# packages/cli/src/capabilities.ts, module descriptors in each
# modules/*/src/cli/commands.json, approval logic in packages/cli/src/runner.ts
# (runExtensionCommand). Keep this file in step with those three places.
default: deny

# packages/cli/src/capabilities.ts
core:
  workspace.doctor:
    command: pnpm oerp doctor
    risk: read
  spec.validate:
    command: pnpm oerp spec validate --all
    risk: read
  blueprint.validate:
    command: pnpm oerp blueprint validate --all
    risk: read
    note: validates every .ai/blueprints/*/blueprint.json and checks the companion files exist
  module.validate:
    command: pnpm oerp module validate
    risk: read
    note: 'schema plus composition entries (PLATFORM_SERVER_ENTRY_MISSING, PLATFORM_EXPORT_MISSING, PLATFORM_CLIENT_ENTRY_MISSING, PLATFORM_CLIENT_EXPORT_MISSING), PACKAGE_NAME_MISMATCH, SPEC_ID_MISMATCH, TRANSLATION_FILE_MISSING, TRANSLATION_KEYS_MISMATCH; warnings SPEC_VERSION_DRIFT, LOCALE_NOT_IN_PROJECT (packages/cli/src/module-validate.ts)'
  module.create:
    command: pnpm oerp module new <id> --spec <path> [--apply]
    risk: workspace-write
    requiresApprovedSpec: true
    supportsDryRun: true

# Commands dispatched by packages/cli/src/runner.ts without a capability descriptor.
commandsWithoutDescriptor:
  - pnpm oerp help
  - pnpm oerp capability list|describe <id>|run <id>
  - pnpm oerp blueprint list
  - pnpm oerp module list
  - pnpm oerp module sync [--apply]
  - pnpm oerp module enable <id> [--apply] (with --apply also runs auth.scopes.sync; result field scopes, failure code MODULE_SCOPES_SYNC_FAILED)
  - pnpm oerp module disable <id> [--apply]
  - pnpm oerp setup check
  - pnpm oerp setup quick (alias of auth.greenfield.reset)

# modules/*/src/cli/commands.json, loaded only for modules enabled in coreloom.json
modules:
  auth.core:
    auth.scopes.list:
      command: pnpm oerp auth scopes
      risk: read
    auth.scopes.sync:
      command: pnpm oerp auth sync-scopes --module <id> [--apply]
      risk: process
      supportsDryRun: true
      effect: grants the module spec permissions to every tenant owner in the auth database
    auth.greenfield.reset:
      command: pnpm oerp auth greenfield --apply --confirm reset-local-auth
      risk: destructive
      localOnly: true
      confirmation: reset-local-auth
      supportsDryRun: true
      effect: resets .octane-erp/auth.db and seeds demo tenants and accounts
  agents.core:
    agents.status:
      command: pnpm oerp agents status
      risk: read
    agents.audit.verify:
      command: pnpm oerp agents audit-verify --tenant <id>
      risk: read
      localOnly: true
  sandbox.core:
    sandbox.access.list:
      command: pnpm oerp sandbox access
      risk: read
    sandbox.access.grant:
      command: pnpm oerp sandbox grant [--apply]
      risk: process
      supportsDryRun: true
    sandbox.access.revoke:
      command: pnpm oerp sandbox revoke [--apply]
      risk: process
      supportsDryRun: true
    sandbox.sessions.list:
      command: pnpm oerp sandbox sessions
      risk: read
    sandbox.sessions.archive:
      command: pnpm oerp sandbox session-archive [--apply]
      risk: process
      supportsDryRun: true
    sandbox.sessions.delete:
      command: pnpm oerp sandbox session-delete [--apply]
      risk: process
      supportsDryRun: true
    sandbox.audit.verify:
      command: pnpm oerp sandbox audit-verify --tenant <id>
      risk: read
      localOnly: true

# packages/cli/src/runner.ts, runExtensionCommand, in evaluation order.
approvals:
  external: refused with APPROVAL_VERIFIER_REQUIRED (no signed approval verifier exists)
  destructive-not-local: refused with APPROVAL_VERIFIER_REQUIRED
  localOnly: refused with LOCAL_ONLY_CAPABILITY unless OERP_ENV or NODE_ENV is development or test (unset counts as development)
  requiresApprovedSpec: needs --spec <path>; APPROVED_SPEC_REQUIRED, SPEC_VALIDATION_FAILED or SPEC_NOT_APPROVED otherwise
  destructive-apply: --apply needs --confirm <descriptor.confirmation>; CONFIRMATION_REQUIRED otherwise
  non-read-without-dry-run: EXPLICIT_APPLY_REQUIRED without --apply
  dry-run: non-read with supportsDryRun and no --apply runs with apply=false and warns "Dry run only. No writes were authorized."

moduleExtensions:
  discovery: module.json cli.catalog (src/cli/commands.json), schema-validated without executing code
  loadImplementation: module.json cli.entry imported only when the command runs (packages/cli/src/extensions.ts loadCliCommand)
  namespace: first segment of the module id; reserved groups help, doctor, capability, spec, blueprint, module, setup
  metadataIdentical: path and capability object must equal the catalog entry
  requireEnabledModule: true

# Planned, no code today. Listed so nobody documents them as available.
planned:
  - migration.status
  - migration.plan
  - migration.apply.local
  - migration.apply.remote
  - destructive.execute (signed approval receipts)
  - redaction of *_TOKEN, *_SECRET, *_PASSWORD, DATABASE_URL in a shared logger (only packages/ai-provider/src/errors.ts redactSecrets exists)
  - persisted CLI audit (CommandEnvelope carries a random auditId and evidence per invocation; nothing stores it)
