packages:
  - platform
  - modules/*
  - packages/*

overrides:
  'ajv@8.20.0>fast-uri': 3.1.7
  '@ai-sdk/provider-utils@5.0.34>undici': 7.29.1
  # GHSA-j22f-vq7h-c4qm: shared-memory serialisation and a quadratic expansion
  # in uneval, both reachable from octane. Patched in 5.9.3.
  'devalue': 5.9.3

allowBuilds:
  esbuild: true
  tldjs: false

minimumReleaseAgeExclude:
  - '@octanejs/app-core@0.1.1'
  - '@octanejs/seo@0.0.46'
  - '@octanejs/tanstack-table@0.1.59'
  - '@octanejs/vite-plugin@0.2.1'
  - octane@0.9.1
  - '@octanejs/tanstack-store@0.0.56'
  - segment-state@0.4.0
