# Example only: not listed in kustomization.yaml. Create the real Secret out of
# band, for example:
#   kubectl create secret generic flowdular-secrets \
#     --from-literal=agentCredentialKey="$(openssl rand -base64 32)" \
#     --from-literal=agentRunGrantKey="$(openssl rand -base64 32)" \
#     --from-literal=automationsCredentialKey="$(openssl rand -base64 32)" \
#     --from-literal=notificationsSecretKey="$(openssl rand -base64 32)" \
#     --from-literal=workflowsPayloadKey="$(openssl rand -base64 32)" \
#     --from-literal=workflowsCursorKey="$(openssl rand -base64 32)" \
#     --from-literal=storageEncryptionKey="$(openssl rand -base64 32)" \
#     --from-literal=connectorsSecretKey="$(openssl rand -base64 32)" \
#     --from-literal=auditAnchorKey="$(openssl rand -base64 32)" \
#     --from-literal=storageBucket="flowdular-objects" \
#     --from-literal=storageRegion="eu-central-1" \
#     --from-literal=storageAccessKeyId="..." \
#     --from-literal=storageSecretAccessKey="..."
# storageEndpoint is optional: leave it unset for AWS, set it for MinIO or R2:
#     --from-literal=storageEndpoint="https://minio.internal:9000"
#
# Rotating agentCredentialKey invalidates every stored provider credential.
# Rotating workflowsPayloadKey makes retained execution payloads unreadable.
#
# metricsToken is optional and is the bearer token a /api/metrics scrape must
# present. Without it the endpoint answers any client that reaches the port:
#   --from-literal=metricsToken="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: flowdular-secrets
  labels:
    app.kubernetes.io/name: flowdular-app
type: Opaque
stringData:
  agentCredentialKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  agentRunGrantKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  automationsCredentialKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  notificationsSecretKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  workflowsPayloadKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  workflowsCursorKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  storageEncryptionKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  connectorsSecretKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  auditAnchorKey: REPLACE_WITH_BASE64_32_BYTE_KEY
  storageBucket: REPLACE_WITH_OBJECT_BUCKET
  storageRegion: REPLACE_WITH_OBJECT_REGION
  storageAccessKeyId: REPLACE_WITH_OBJECT_ACCESS_KEY_ID
  storageSecretAccessKey: REPLACE_WITH_OBJECT_SECRET_ACCESS_KEY
  # Optional: leave unset for AWS, set it for MinIO or R2.
  storageEndpoint: REPLACE_WITH_OBJECT_ENDPOINT_OR_REMOVE
  # Optional, base64url encoded.
  authMfaKey: REPLACE_WITH_BASE64URL_32_BYTE_KEY
  # Optional.
  metricsToken: REPLACE_WITH_SCRAPE_TOKEN_OR_REMOVE
