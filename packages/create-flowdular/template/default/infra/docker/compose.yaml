services:
  postgres-tls:
    image: postgres:17
    entrypoint: ['/bin/bash', '/tls-init.sh']
    volumes:
      - ./postgres/tls-init.sh:/tls-init.sh:ro
      - flowdular-postgres-tls:/tls
    restart: 'no'

  postgres:
    image: postgres:17
    depends_on:
      postgres-tls:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: flowdular
      POSTGRES_PASSWORD: ${FD_POSTGRES_SUPERUSER_PASSWORD:?Set FD_POSTGRES_SUPERUSER_PASSWORD in infra/docker/.env (openssl rand -base64 32)}
      FD_DATABASE_MIGRATOR_PASSWORD: ${FD_DATABASE_MIGRATOR_PASSWORD:?Set FD_DATABASE_MIGRATOR_PASSWORD in infra/docker/.env (openssl rand -base64 32)}
      FD_DATABASE_RUNTIME_PASSWORD: ${FD_DATABASE_RUNTIME_PASSWORD:?Set FD_DATABASE_RUNTIME_PASSWORD in infra/docker/.env (openssl rand -base64 32)}
      FD_DATABASE_BACKGROUND_PASSWORD: ${FD_DATABASE_BACKGROUND_PASSWORD:?Set FD_DATABASE_BACKGROUND_PASSWORD in infra/docker/.env (openssl rand -base64 32)}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    volumes:
      - flowdular-postgres:/var/lib/postgresql/data
      - flowdular-postgres-tls:/tls:ro
      - ./postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d flowdular']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Rollout gate. Each module applies its own migrations on first use through a
  # migration lease, so this one-shot run does not apply anything: it reports
  # what is pending and fails the rollout when an applied migration no longer
  # matches the checksum of the code being deployed. It needs the workspace and
  # the CLI, so it runs the builder stage rather than the runtime image.
  migration-check:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: builder
    image: flowdular-app-builder:local
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', 'flowdular', 'migration', 'status', '--json']
    environment:
      FD_DATABASE_ADAPTER: postgresql
      FD_DATABASE_URL: postgresql://coreloom_runtime:${FD_DATABASE_RUNTIME_PASSWORD}@postgres:5432/flowdular
      FD_DATABASE_MIGRATOR_URL: postgresql://coreloom_migrator:${FD_DATABASE_MIGRATOR_PASSWORD}@postgres:5432/flowdular
      FD_DATABASE_TLS: verify-full
      FD_DATABASE_TLS_CA_FILE: /tls/server.crt
    volumes:
      - flowdular-postgres-tls:/tls:ro
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: flowdular-app:local
    depends_on:
      postgres:
        condition: service_healthy
      migration-check:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      # Every module reads and writes through the platform provider; the
      # deployment has one database and no per-module files.
      FD_DATABASE_ADAPTER: postgresql
      FD_DATABASE_URL: postgresql://coreloom_runtime:${FD_DATABASE_RUNTIME_PASSWORD}@postgres:5432/flowdular
      FD_DATABASE_MIGRATOR_URL: postgresql://coreloom_migrator:${FD_DATABASE_MIGRATOR_PASSWORD}@postgres:5432/flowdular
      # Cross-tenant reads (the scheduler poll) run as this role. It carries no
      # blanket grant: a migration hands it named columns under its own policy.
      FD_DATABASE_BACKGROUND_URL: postgresql://coreloom_background:${FD_DATABASE_BACKGROUND_PASSWORD}@postgres:5432/flowdular
      FD_DATABASE_TLS: verify-full
      FD_DATABASE_TLS_CA_FILE: /tls/server.crt
      FD_AUTH_ALLOW_SIGN_UP: 'false'
      # TLS terminates in front of this container. Only a plain-HTTP run on a
      # workstation may set FD_AUTH_SECURE_COOKIE=false in .env.
      FD_AUTH_SECURE_COOKIE: ${FD_AUTH_SECURE_COOKIE:-true}
      # Every key comes from infra/docker/.env (copy the root .env.example).
      # Compose refuses to start without them; the owning module would refuse at
      # boot anyway.
      FD_AGENT_CREDENTIAL_KEY: ${FD_AGENT_CREDENTIAL_KEY:?Set FD_AGENT_CREDENTIAL_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_AGENT_RUN_GRANT_KEY: ${FD_AGENT_RUN_GRANT_KEY:?Set FD_AGENT_RUN_GRANT_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_AUTOMATIONS_CREDENTIAL_KEY: ${FD_AUTOMATIONS_CREDENTIAL_KEY:?Set FD_AUTOMATIONS_CREDENTIAL_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_NOTIFICATIONS_SECRET_KEY: ${FD_NOTIFICATIONS_SECRET_KEY:?Set FD_NOTIFICATIONS_SECRET_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_WORKFLOWS_PAYLOAD_KEY: ${FD_WORKFLOWS_PAYLOAD_KEY:?Set FD_WORKFLOWS_PAYLOAD_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_WORKFLOWS_CURSOR_KEY: ${FD_WORKFLOWS_CURSOR_KEY:?Set FD_WORKFLOWS_CURSOR_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_STORAGE_ENCRYPTION_KEY: ${FD_STORAGE_ENCRYPTION_KEY:?Set FD_STORAGE_ENCRYPTION_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_CONNECTORS_SECRET_KEY: ${FD_CONNECTORS_SECRET_KEY:?Set FD_CONNECTORS_SECRET_KEY in infra/docker/.env (openssl rand -base64 32)}
      FD_AUDIT_ANCHOR_KEY: ${FD_AUDIT_ANCHOR_KEY:?Set FD_AUDIT_ANCHOR_KEY in infra/docker/.env (openssl rand -base64 32)}
      # Object storage. Production refuses the local adapter, so the app writes
      # to an S3-compatible bucket and encrypts every object under
      # FD_STORAGE_ENCRYPTION_KEY before it leaves the process. The named volume
      # below is the writable path the local adapter needs when this stack is
      # run outside production for a demonstration.
      FD_STORAGE_ADAPTER: ${FD_STORAGE_ADAPTER:-s3}
      FD_STORAGE_LOCAL_DIRECTORY: /var/lib/flowdular/storage
      FD_STORAGE_S3_BUCKET: ${FD_STORAGE_S3_BUCKET:-}
      FD_STORAGE_S3_REGION: ${FD_STORAGE_S3_REGION:-}
      FD_STORAGE_S3_ENDPOINT: ${FD_STORAGE_S3_ENDPOINT:-}
      FD_STORAGE_S3_ACCESS_KEY_ID: ${FD_STORAGE_S3_ACCESS_KEY_ID:-}
      FD_STORAGE_S3_SECRET_ACCESS_KEY: ${FD_STORAGE_S3_SECRET_ACCESS_KEY:-}
      FD_STORAGE_S3_FORCE_PATH_STYLE: ${FD_STORAGE_S3_FORCE_PATH_STYLE:-false}
      # Optional: without it the app runs and only MFA enrollment is unavailable.
      FD_AUTH_MFA_KEY: ${FD_AUTH_MFA_KEY:-}
      # Outgoing mail. With none, invitations and password resets are refused.
      FD_AUTH_MAIL_TRANSPORT: ${FD_AUTH_MAIL_TRANSPORT:-none}
      FD_TRUST_PROXY: ${FD_TRUST_PROXY:-false}
      FD_METRICS: ${FD_METRICS:-false}
      FD_METRICS_TOKEN: ${FD_METRICS_TOKEN:-}
      FD_AUTH_SMTP_URL: ${FD_AUTH_SMTP_URL:-}
      FD_AUTH_MAIL_FROM: ${FD_AUTH_MAIL_FROM:-}
    ports:
      - '${FD_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - flowdular-postgres-tls:/tls:ro
      - flowdular-storage:/var/lib/flowdular/storage
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  flowdular-postgres:
  flowdular-postgres-tls:
  # Only the local adapter writes here; a production run uses the S3 bucket.
  flowdular-storage:
