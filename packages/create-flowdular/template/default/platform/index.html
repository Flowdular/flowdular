<!doctype html>
<html lang="en" class="flowdular-booting">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style id="flowdular-critical-splash">
			html,
			body,
			#root {
				min-height: 100%;
				margin: 0;
				background: #0c1222;
			}
			.flowdular-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				background: #0c1222;
				color: #f4f6fa;
				transition: opacity 180ms ease;
			}
			.flowdular-splash__content {
				display: grid;
				justify-items: center;
				gap: 16px;
				font:
					600 13px/1.2 ui-sans-serif,
					system-ui,
					sans-serif;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}
			.flowdular-splash__brand::after {
				content: var(--flowdular-brand, 'Flowdular');
			}
			.flowdular-splash__stage {
				min-width: 190px;
				font-size: 10px;
				font-weight: 500;
				color: #8794ab;
				letter-spacing: 0.08em;
				text-align: center;
				text-transform: none;
			}
			.flowdular-splash__mark {
				display: block;
				width: 44px;
				height: 44px;
				animation: flowdular-pulse 1.4s ease-in-out infinite alternate;
			}
			.flowdular-splash--leaving {
				opacity: 0;
				pointer-events: none;
			}
			@keyframes flowdular-pulse {
				to {
					opacity: 0.45;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.flowdular-splash__mark {
					animation: none;
				}
			}
		</style>
		<!--ssr-head-->
	</head>
	<body aria-busy="true">
		<div
			id="flowdular-splash"
			class="flowdular-splash"
			role="status"
			aria-live="polite"
		>
			<div class="flowdular-splash__content">
				<svg
					class="flowdular-splash__mark"
					viewBox="0 0 24 24"
					aria-hidden="true"
				>
					<g fill="#ffffff">
						<rect x="2" y="3" width="20" height="5" rx="2.5" />
						<rect x="8" y="10" width="14" height="5" rx="2.5" />
					</g>
					<g fill="#e08a45">
						<rect x="14" y="17" width="8" height="5" rx="2.5" />
					</g>
				</svg>
				<span class="flowdular-splash__brand"></span>
				<small id="flowdular-splash-stage" class="flowdular-splash__stage"
					>Starting workspace</small
				>
			</div>
		</div>
		<div id="root"><!--ssr-body--></div>
		<script nonce="__FLOWDULAR_CSP_NONCE__">
			(() => {
				if (document.getElementById('flowdular-web-data')) {
					document.getElementById('flowdular-splash')?.remove();
					document.documentElement.classList.remove('flowdular-booting');
					document.body.removeAttribute('aria-busy');
					return;
				}
				const startedAt = performance.now();
				const stages = [
					'Securing session',
					'Selecting workspace',
					'Loading modules',
					'Preparing workspace',
				];
				let stageIndex = 0;
				let ready = false;
				let stageTimer;
				const stage = document.getElementById('flowdular-splash-stage');
				const advance = () => {
					if (!stage || ready) return;
					stage.textContent = stages[Math.min(stageIndex, stages.length - 1)];
					stageIndex += 1;
				};
				const finish = () => {
					if (ready) return;
					ready = true;
					clearInterval(stageTimer);
					const splash = document.getElementById('flowdular-splash');
					if (!splash) return;
					const leave = () => {
						splash.classList.add('flowdular-splash--leaving');
						document.documentElement.classList.remove('flowdular-booting');
						document.body.setAttribute('aria-busy', 'false');
						setTimeout(() => splash.remove(), 200);
					};
					const remaining = Math.max(0, 850 - (performance.now() - startedAt));
					setTimeout(leave, remaining);
				};
				window.addEventListener('DOMContentLoaded', () => {
					advance();
					stageTimer = setInterval(advance, 320);
					/* The server-rendered page is already visible underneath; hydration
					   in development can take seconds, so the splash never blocks longer
					   than this. */
					setTimeout(finish, 2500);
				});
				window.addEventListener('flowdular:ready', finish, { once: true });
			})();
		</script>
		<noscript
			><style>
				.flowdular-splash {
					display: none;
				}
			</style></noscript
		>
	</body>
</html>
