<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#FFFFFF" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Coreloom</title>
		<style>
			html,
			body,
			#root {
				min-height: 100%;
				margin: 0;
				background: #ffffff;
			}

			/* Opening curtain over the server-rendered page. It clears itself with
			   a CSS animation, so a failed or slow script can never leave it up. */
			.l-boot {
				position: fixed;
				inset: 0;
				z-index: 60;
				display: grid;
				place-items: center;
				background: #ffffff;
				animation: l-boot-out 460ms cubic-bezier(0.22, 0.7, 0.24, 1) 620ms
					forwards;
			}

			.l-boot__mark {
				display: block;
				width: 40px;
				height: 40px;
				animation: l-boot-pulse 900ms cubic-bezier(0.22, 0.7, 0.24, 1) infinite
					alternate;
			}

			@keyframes l-boot-out {
				to {
					opacity: 0;
					visibility: hidden;
				}
			}

			@keyframes l-boot-pulse {
				from {
					opacity: 0.35;
					transform: scale(0.94);
				}

				to {
					opacity: 1;
					transform: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.l-boot {
					animation-delay: 0ms;
					animation-duration: 1ms;
				}

				.l-boot__mark {
					animation: none;
				}
			}
		</style>
		<!--ssr-head-->
	</head>
	<body>
		<div class="l-boot" aria-hidden="true">
			<svg class="l-boot__mark" viewBox="0 0 24 24">
				<g fill="#0f1729">
					<circle cx="7.9" cy="3.4" r="1.7" />
					<rect x="6.2" y="3.4" width="3.4" height="1.6" />
					<rect x="6.2" y="10.8" width="3.4" height="9.8" />
					<circle cx="7.9" cy="20.6" r="1.7" />
					<circle cx="16.1" cy="3.4" r="1.7" />
					<rect x="14.4" y="3.4" width="3.4" height="9.8" />
					<rect x="14.4" y="19" width="3.4" height="1.6" />
					<circle cx="16.1" cy="20.6" r="1.7" />
				</g>
				<g fill="#b4601f">
					<circle cx="3.4" cy="7.9" r="1.7" />
					<rect x="3.4" y="6.2" width="9.8" height="3.4" />
					<rect x="19" y="6.2" width="1.6" height="3.4" />
					<circle cx="20.6" cy="7.9" r="1.7" />
					<circle cx="3.4" cy="16.1" r="1.7" />
					<rect x="3.4" y="14.4" width="1.6" height="3.4" />
					<rect x="10.8" y="14.4" width="9.8" height="3.4" />
					<circle cx="20.6" cy="16.1" r="1.7" />
				</g>
			</svg>
		</div>
		<div id="root"><!--ssr-body--></div>
	</body>
</html>
