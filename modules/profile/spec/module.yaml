schemaVersion: 1
id: profile.core
specVersion: '1.5.2'
status: approved
name: Profile
description: Allows a signed-in user to manage their own tenant-scoped display name and interface language, request a password change after confirming their current password, and review or end their own sessions.
profile: full

capabilities:
  - api
  - database
  - client
  - translations
  - integration

dependencies:
  - id: auth.core
    range: ^0.13.0

tenancy: required

locales:
  - en
  - pl

invariants:
  - Every operation requires an authenticated principal and the declared profile permission; owners and members hold profile.self.manage by default, because every member manages their own profile, language, password and sessions.
  - A user can read or change only the profile identified by their authenticated principal in the current tenant.
  - The trusted tenant identifier and user identifier come from the authenticated principal and are never accepted from request data.
  - Every profile query and mutation is scoped by both the trusted tenant identifier and authenticated principal identifier.
  - Profile persistence uses a platform-provided database handle; module code never receives a connection string, owns a production pool, or reaches another module's database.
  - Every runtime persistence operation executes inside a transaction carrying the authenticated tenant identifier, while every SQL statement also retains an explicit tenant predicate.
  - PostgreSQL tables owned by profile.core enable and force row-level security, with USING and WITH CHECK policies bound to the transaction-local coreloom.tenant_id value.
  - Migrations are declared as explicit PostgreSQL SQL; profile.core never rewrites placeholders or translates SQL between dialects.
  - Adopting the adapter migration ledger on an existing profile schema preserves every profile and language-preference row and refuses a partially present schema.
  - A personal interface language is stored by authenticated account and tenant; a preference from another account or tenant is never returned or applied.
  - The server preference is authoritative after authentication; a tenant-and-account-scoped browser value is only an unavailable-server cache.
  - Only locales declared by profile.core can be stored as a personal interface language.
  - A display-name change affects only the authenticated user's profile in the current tenant.
  - Passwords, password hashes, current-password values, session tokens, and provider credentials are never stored, hashed, logged, audited, or returned by profile.core.
  - A password change is delegated to the registered auth.core password-change endpoint and is never performed directly by profile.core.
  - Session listing and revocation are delegated to the auth.core session endpoints; profile.core never reads or stores session tokens.
  - The current password and proposed password are sent only to auth.core for the duration of the password-change request.
  - A failed display-name change leaves the existing display name unchanged.
  - A rejected or unavailable password-change request leaves the password unchanged and creates no local password state.
  - Failure responses contain enough information for the user to correct the request without exposing credentials, password policy details beyond those returned for correction, or another account's existence.

permissions:
  - id: profile.self.manage
    description: Allows a signed-in user to view and change only their own display name and language, and request a password change for only their own account.

dataOwnership:
  - profile.core owns tenant-scoped profile records containing the display name and personal interface-language preference for each user.
  - profile.core reads the authenticated account identity and password-change result through auth.core services.
  - auth.core owns passwords, password hashes, password history, password policy, sessions, session tokens, and provider credentials.

acceptanceScenarios:
  - id: CHANGE-OWN-DISPLAY-NAME
    given: A user is signed in to a tenant, has profile.self.manage, and has an existing profile in that tenant.
    when: The user submits a valid new display name for their own profile.
    then: The display name is updated only for that user's profile in the current tenant and the response returns the updated non-secret profile data.

  - id: REJECT-INVALID-DISPLAY-NAME
    given: A user is signed in to a tenant, has profile.self.manage, and has an existing display name.
    when: The user submits a display name that fails the declared profile validation rules.
    then: The request fails with a corrective validation error and the existing display name remains unchanged.

  - id: CHANGE-OWN-PASSWORD
    given: A user is signed in to a tenant, has profile.self.manage, and provides their correct current password and an acceptable new password.
    when: The user requests a password change for their own account.
    then: profile.core delegates the request to the registered auth.core password-change endpoint, auth.core changes the password, and profile.core stores, logs, audits, and returns no password or password hash.

  - id: REJECT-INCORRECT-CURRENT-PASSWORD
    given: A user is signed in to a tenant, has profile.self.manage, and provides an incorrect current password.
    when: The user requests a password change for their own account.
    then: auth.core rejects the request, the password remains unchanged, profile.core creates no local password state, and the response does not expose credential material.

  - id: HANDLE-AUTH-CORE-UNAVAILABLE
    given: A user is signed in to a tenant, has profile.self.manage, and auth.core cannot complete the password-change request.
    when: The user requests a password change for their own account.
    then: The request fails with a non-success response, the password remains unchanged, no local password state is created, and the user can retry safely.

  - id: DENY-UNAUTHENTICATED-REQUEST
    given: No authenticated principal is available.
    when: A request attempts to read or change a profile or change a password.
    then: The request is denied, no profile or password state changes, and no account data is returned.

  - id: DENY-REQUEST-WITHOUT-PERMISSION
    given: A user is signed in but does not have profile.self.manage.
    when: The user attempts to read or change their profile or change their password.
    then: The request is denied and no profile or password state changes.

  - id: DENY-EDITING-ANOTHER-ACCOUNT
    given: A user is signed in to a tenant and has profile.self.manage.
    when: The user attempts to target another user's profile or account.
    then: The request is denied, the other user's profile and password remain unchanged, and the response does not reveal whether the targeted account exists.

  - id: ISOLATE-PROFILES-BETWEEN-TENANTS
    given: A signed-in user has profile.self.manage in one tenant and a profile record exists in another tenant.
    when: The user attempts to read or change the profile record in the other tenant.
    then: The request is denied or returns no record, the other tenant's data remains unchanged, and the response reveals no profile data from the other tenant.

  - id: REVIEW-OWN-SESSIONS
    given: A signed-in user with more than one live session.
    when: The user opens Profile and ends a session that is not the current one.
    then: The list marks the current device, the ended session no longer resolves, and the current session is unchanged.

  - id: SAVE-OWN-INTERFACE-LANGUAGE
    given: A user is signed in to a tenant, has profile.self.manage, and selects a locale declared by profile.core.
    when: The user changes their personal interface language.
    then: The language is applied immediately, stored only for that account in the current tenant, and restored from the server on the next authenticated application start.

  - id: ISOLATE-INTERFACE-LANGUAGE
    given: The same account has different personal language preferences in two tenants.
    when: The account opens either tenant.
    then: The server returns and the client applies only the preference stored for the active tenant.

  - id: REJECT-UNSUPPORTED-INTERFACE-LANGUAGE
    given: A user is signed in and has profile.self.manage.
    when: The user submits a locale that profile.core does not declare.
    then: The request fails without changing the stored preference or active server-backed language.

  - id: PRESERVE-EXISTING-PROFILES
    given: A profile database contains profile and language-preference rows created before the database adapter ledger was introduced.
    when: profile.core starts against that schema for the first time.
    then: The existing schema is adopted without replaying its migrations, every existing row is preserved, and subsequent starts leave the ledger and data unchanged.

  - id: ENFORCE-POSTGRESQL-TENANT-BOUNDARY
    given: profile.core runs on PostgreSQL and two tenants have profile records with the same account identifier.
    when: A runtime transaction is bound to either tenant and reads or writes profile data.
    then: Only that tenant's rows are visible or mutable, a transaction without a tenant is refused, and the forced row-level security policy rejects a row carrying another tenant identifier.

  - id: RUN-ON-SUPPORTED-DATABASE-ADAPTERS
    given: The platform provides profile.core a PostgreSQL database handle and a separate migration lease.
    when: profile.core initializes its persistence runtime.
    then: It applies or adopts the explicit PostgreSQL migrations, releases the migration lease, and serves the profile repository contract through the tenant-bound runtime lease.
