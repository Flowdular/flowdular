schemaVersion: 1
id: parties.core
specVersion: 0.1.0
status: approved
name: Business Parties Core
description: Provides the tenant-scoped customer and supplier master data used by commercial ERP modules.
profile: full
capabilities:
  - api
  - database
  - client
  - translations
dependencies:
  - id: system.core
    range: ^0.1.0
  - id: auth.core
    range: ^0.1.0
tenancy: required
locales:
  - en
  - pl
invariants:
  - Every party row is owned by exactly one tenant and every query includes the trusted tenant identifier.
  - Party kind is customer, supplier, or both.
  - Archived parties remain addressable by identifier and are excluded from active selection by default.
  - Party identifiers are generated by the service and never accepted as tenancy authority.
permissions:
  - id: parties.records.read
    description: Read customers and suppliers in the active tenant.
  - id: parties.records.manage
    description: Create and update customers and suppliers in the active tenant.
dataOwnership:
  - parties.core owns party identity, kind, contact summary, and lifecycle status.
  - Commercial modules reference party identifiers and do not duplicate party master data.
acceptanceScenarios:
  - id: PARTIES-LIST
    given: Tenant-scoped customer and supplier records exist.
    when: An authorized principal lists parties.
    then: Only records owned by the active tenant are returned in deterministic name order.
  - id: PARTIES-CREATE
    given: An authorized principal supplies a valid name, kind, and optional contact fields.
    when: The party is created.
    then: A tenant-owned active party is persisted and returned with a generated identifier.
  - id: PARTIES-DENY
    given: A principal is unauthenticated or lacks the required party permission.
    when: The principal reads or mutates party data.
    then: The server denies the operation before repository access.
