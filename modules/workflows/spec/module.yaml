schemaVersion: 2
id: workflows.core
specVersion: 0.8.1
status: draft
name: Agentic Workflows
description: Builds, publishes, simulates, and executes durable tenant-scoped DAG workflows whose versioned nodes coordinate pinned agents, deterministic decisions, validated data, and registered module actions.
profile: full
capabilities:
  - api
  - database
  - client
  - translations
  - integration
  - cli
dependencies:
  - id: system.core
    range: ^0.9.0
  - id: auth.core
    range: ^0.14.0
  - id: agents.core
    range: ^0.15.0
provides:
  - workflows.execution.v1
requires:
  - id: agents.run-execution.v2
  - id: agents.actions.v2
  - id: agents.decisions.v1
    optional: true
  - id: notifications.publish.v1
    optional: true
  - id: approvals.requests.v1
    optional: true
tenancy: required
locales:
  - en
  - pl
invariants:
  - Composition registers the execution capability and authenticated routes in web and worker roles. Only startWorker initializes the run worker and starts its recovery poll; a web enqueue persists a run but its local kick never claims or executes it. Combined mode starts the same worker after composition.
  - Stopping the worker waits for its current drain and leaves an unfinished run to the existing fenced lease and retry rules before database leases are released.
  - Every workflow definition, revision, run, node attempt, edge transfer, and event is owned by exactly one trusted tenant.
  - Version one executes directed acyclic graphs only. A graph with a cycle, unreachable node, dangling edge, incompatible port, or missing terminal output cannot be published or run.
  - A published workflow revision is immutable and content-addressed. Editing creates a new draft revision without changing prior runs or their evidence.
  - Publishing pins the exact revision of every referenced agent and the exact contract version of every referenced action. A missing pinned dependency refuses publication or execution instead of silently choosing the latest version.
  - Workflows reaches agents.core only through versioned public capabilities for agent catalog, exact-revision enqueue, observation, cancellation, and registered action execution. It never reads or writes the agents database.
  - A workflow definition grants no authority. Live execution intersects the immutable node plan with the initiating actor's trusted permission snapshot and every referenced agent or action permission.
  - Manual and module-originated runs retain the real user or agent actor. Schedule and webhook runs retain a service actor with the configuring user snapshot, while trigger kind and identifier remain separate execution-origin fields.
  - Graph configuration contains declarative typed literal, path, and template mappings only. Arbitrary JavaScript, expressions with side effects, source code, shell commands, dynamic imports, and runtime-downloaded code are forbidden.
  - Input, output, agent-decision, typed-decision, gate, validator, action, human-approval, merge, and terminal output nodes communicate only through declared, schema-bound ports and immutable JSON envelopes.
  - An agent-decision node must return a schema-valid pass or fail decision with bounded structured data. Free-form text never decides a branch.
  - A typed-decision node asks agents.decisions.v1 a bounded set of typed questions about its input and routes on the answer. The published revision pins the questions, the declarative mapping from the node input to the question state, the answer that means pass, and the confidence threshold between 0 and 1. It carries the same pass and fail ports as an agent-decision node.
  - A typed-decision node is not an agent node. It pins no agent revision, grants no tool, invokes no action and can reach nothing but the decision capability, so judgment that needs a tool stays an agent-decision node.
  - An answer whose confidence is below the pinned threshold is a technically successful attempt that takes the fail port, with the answer, its confidence and the threshold recorded on the attempt. What happens next belongs to the graph, which may route that port to a human-approval node.
  - A question set that is never answered is not a fail port. An absent agents.core, a workspace flag that is off, a missing or unconsented decision connection, a refused meter and a provider failure each fail the node attempt with its own stable code, under the rule that a port is the outcome of a successful attempt and never an error by itself.
  - Publication validates a typed-decision node against the capability bounds, which are the question count, the declared answers per question, the state mapping, a pass answer that is one of the declared answers of its question, and a threshold inside 0 to 1. A graph that breaks one of them is refused with a stable code instead of failing at run time.
  - A simulated run answers a typed-decision node from its supplied fixtures, calls no provider, meters nothing and marks its usage and cost explicitly not applicable, exactly as it does for an agent node.
  - The run event of a typed-decision attempt carries the chosen answer, its confidence, the threshold and the connection that answered. The question state follows the ordinary payload rules, so a preview is redacted, bounded and never a raw record.
  - Deterministic gate nodes use a versioned allowlisted logic language. Agentic judgment is represented by an explicit agent-decision node, never hidden inside a gate.
  - A validator node emits pass only for data that satisfies its pinned schema and emits bounded structured validation errors on fail.
  - A human-approval node declares its requirement in the published graph and is validated against the workspace roles at publish time; an unknown role or an absent approvals.core refuses publication with a stable code. At run time the node opens one request through approvals.requests.v1 keyed by the run and node, takes the run out of the claim queue until the request resolves or its bounded recheck falls due, resumes on approval, and fails the run with a stable code on rejection, expiry or cancellation. Whenever the run stops waiting for a pending request, whether the run is cancelled, the request's deadline passes, or the run's duration bound is reached, the request is withdrawn rather than left asking people to decide something nobody is waiting for. A simulated run approves without asking anybody. The prompt the node asks and its label are bounded at validation and publication by the limits approvals.core accepts for a request title, so a question that module would refuse fails the publish rather than the run that reaches the node.
  - An action node invokes only a registered, versioned action contract through agents.actions.v2, under the required permissions, input schema, timeout, output bound, idempotency key, and audit boundary. The action catalogue and optional workflowTemplate metadata cross this public capability; workflows.core never reads the platform tool registry or creates another action registry.
  - A module may present an eligible, versioned action as a named workflow node template by declaring optional static workflowTemplate metadata with a label of at most 80 characters, a description of at most 240 characters, and effect local or connector-egress on that same registered action. The action catalogue is the only source of executable truth; a template does not register another handler, grant a permission, or add a new graph node kind. A consumer module declaring connector-egress also declares connectors.core at ^0.2.0 and requires connectors.calls.v1, and tests connector consent and uncertain-call recovery. Invalid metadata or schemas outside the workflow schema and graph limits fail registration explicitly.
  - Selecting a custom template creates a normal action node with the exact action identifier and contract version, its fixed input, success, and failure ports, and schemas copied from the registered action contract. The node pins a digest of the full executable agents.actions.v2 descriptor, including input and output schemas, required permissions, risk, idempotency mode and protection, timeout, cancellation policy, and the template's local or connector-egress effect; label and description are the only excluded presentation copy. Publication and live preflight refuse a mismatch. Published graphs retain that reference and their schema snapshot; changing palette copy never changes a published run. Existing generic action nodes without a template digest need no migration.
  - A template's JSON input schema describes editable fields and is checked before live execution. The owning module's service performs any additional code-level business validation before a mutation, with a stable bounded refusal. The workflow engine validates mapped input and bounded output, and never runs module code during dry-run or simulation.
  - No action input field marked writeOnly, x-flowdular-secret, or legacy x-coreloom-secret may receive a graph literal, template, or path binding; a template that requires such a raw field is ineligible. API creation and draft save, validation, publication, and live preflight reject the affected node and field with a stable safe code before storing or executing a new graph. The editor offers no raw-secret field control. A credential is resolved by the owning module through a tenant-bound vault, connector instance, or declared public capability; the graph stores at most a nonsecret opaque reference, never a credential value.
  - An older stored or published graph with a schema-marked secret binding is quarantined from live execution and a single safe graph projection is applied to every graph-bearing response and export. This includes workflow detail with its draft and all revisions, update and publish responses that return that detail, run detail, simulate responses that return run detail, and published-definition data export; runs export has no graph. The projection redacts the unsafe binding or refuses the graph while retaining safe revision identity and a node and field diagnostic, never the value. A manager rotates the exposed credential and creates a new revision that binds an opaque tenant reference; the platform does not silently migrate or rebind the immutable old revision.
  - If an older action's pinned input schema is missing or cannot prove a stored binding safe, that same projection conservatively redacts every literal value and template string of its action node, and live preflight refuses the missing reference. It never treats an absent schema as permission to expose raw graph JSON. A manager explicitly rebinds the action in a new revision; ordinary graphs whose pinned schemas prove their bindings safe keep their normal detail and export behavior.
  - A change to a custom action's input, output, permissions, risk, idempotency, timeout, cancellation, or behaviour requires a new action identity or contract version. Because the current agents action registry keeps one version per action identifier, a module that must keep older published graphs runnable retains the old action under its old identifier and adds a distinct identifier for the new contract. Missing or incompatible references refuse publication and live preflight; saved graphs are never silently rebound.
  - The palette offers only registered templates whose required permissions the editor holds. A live run rechecks the original permission ceiling and current authorization through agents.actions.v2, so palette visibility and a stored graph grant no new authority. A custom template that declares connector-egress visibly identifies its external effect and required workspace connector consent; the existing connectors.call action remains available in the generic action editor only with its corrected contractVersion exactly 2 and without claiming template metadata from connectors.core. An older or unreviewed connector action version is excluded from the catalog and refused by publication and live preflight.
  - A module action may write only through its own tenant-bound service or a declared public capability of another module, never through that module's database. An integration action uses connectors.calls.v1 with caller workflow, an owner-configured connector instance and allowWorkflows consent; credentials stay in connectors.core, and the action keeps its own durable target idempotency key and audit correlation. workflows.core does not depend on connectors.core when no integration action is installed.
  - A consumer-owned connector-egress workspace-write template declares target-ledger idempotency protection and forwards the stable workflow side-effect key to connectors.calls.v1. When a call was recorded, its declared output uses only the replay-stable call id and outcome, because replay returns no response body or preview. An unresolved claim raises the public AgentHarnessError code CALL_OUTCOME_UNKNOWN through the action worker without a call id or fabricated output. The workflow worker classifies this code as terminal before applying a node retry policy, even if retryOn names it; the same rule applies to the generic connectors.call action. A wrapper may reconcile or retry an unknown external mutation only under a separate provider contract with documented remote idempotency or readback; body-dependent output needs that provider recovery contract. No template treats an empty replay body as the original response or sends a second external request merely to reconstruct it.
  - Version one admits read and workspace-write actions, including the existing connectors.call action whose external call is separately governed by connectors.core. Raw external and destructive actions and direct HTTP from graph configuration stay excluded from the workflow catalog, publication, and execution. A custom module action that bypasses connector consent violates the authoring contract and fails its scoped tests and review; the workflow engine does not sandbox trusted module source. The human-approval node gates a person's decision and never widens the action risk class.
  - Each live workflow run durably snapshots its workflow revision, actor, origin, permission digest, mode, input, limits, and idempotency key before enqueue returns.
  - Workflow workers claim runs with expiring leases, renew live claims, and recover queued or expired work after restart without concurrently owning the same run.
  - A node runs at most once successfully. Retries create immutable attempts and reuse a stable side-effect idempotency key so recovery cannot duplicate an agent enqueue or action mutation.
  - Ready nodes execute in a deterministic topological order. Version one does not promise parallel branch execution, even when independent nodes are ready.
  - Dry-run is a stateless validation request, not a workflow invocation. It returns a typed validation report without persisting run history, node attempts, events, payloads, usage, cost, or workflow audit evidence, calling a provider, invoking an action, or writing business data.
  - Simulation executes deterministic gates, validation, and mappings against supplied fixtures, emits a virtual event plan with simulated durations, performs no real sleep, and never calls a provider or action. Its persisted events distinguish wall-clock recorded time from virtual elapsed time, and its usage and cost are explicitly not applicable.
  - Live mode is the only mode that may enqueue an agent or invoke an action. It uses the same authorization, budgets, output bounds, tenancy, and audit controls as direct agent and tool execution.
  - Workflow run and node histories are append-only while retained. Every status transition, attempt, edge settlement, refusal, retry schedule, cancellation request or acknowledgement, ignored late result, and terminal result receives a schema-versioned ordered durable event from the formal event catalog.
  - Run status, node execution status, and immutable node-attempt technical status are separate projections. Pass or fail is a schema-bound outcome port of a technically successful decision attempt, never an execution status or error by itself.
  - A retryable attempt failure durably records its error classification, semantic attempt group, selected backoff, and next attempt time before the worker waits. Recovery schedules the next immutable attempt from that evidence and never recomputes a different delay.
  - Run history records workflow and agent revisions, actor, origin, mode, status, duration, usage and cost, safe redacted input and output, failures, node attempts, edge evidence, and audit correlation without storing credentials or unrestricted request bodies. The existing node-attempt and edge records are the only per-node trace storage; the editor exposes every attempt with its pinned action reference, input and output evidence state, outcome, duration, stable failure code, child correlation, and safe idempotency reference, plus the edges each outcome traversed.
  - A coding agent tests a generated node with synthetic, reviewed fixtures through the existing deterministic workflow simulation and its virtual time. Golden assertions compare semantic node attempts, edge outcomes, and stable refusal codes without requiring wall-clock equality, invoking a connector or action, or copying raw production payloads into a repository. Recording a live payload as a fixture requires explicit redaction and operator approval, and secrets never enter fixtures.
  - The in-platform Sandbox authoring path can take a natural-language request for a custom workflow node, interview the owning business module's specification, wait for approval of its exact hash, and then generate that module's action handler, code-level validator, JSON schemas, workflowTemplate metadata, and behavior tests using a dedicated workflow-node authoring recipe. Preview and eject use the Sandbox host gates; the agent cannot approve its own spec, install code into the running server, or push a repository directly.
  - Browser connections observe persisted workflow events and never own execution. A stream resumes after reload from one run-bound sequence cursor, replays a bounded page, emits non-advancing heartbeats, and closes only after a terminal event is flushed.
  - Cancellation is durable and cooperative. It prevents new nodes, requests cancellation of an in-flight child agent or action through its public capability, records acknowledgement or non-acknowledgement, and records but never routes a result that arrives after cancellation.
  - Execution payloads and evidence previews are separate. A bounded encrypted execution payload may be retained only while execution or recovery needs it; every response, event, history row, and audit record uses a scope-filtered redacted preview with an explicit available, redacted, truncated, expired, or absent state. Secrets, provider credentials, session tokens, hidden reasoning, and values marked secret never enter workflow definitions, evidence previews, events, or audit metadata.
  - Automated payload retention may remove separately stored payload blobs only after appending a retention event. Run identity, status, revisions, attempts, durations, cost, hashes, and audit linkage remain queryable.
  - Capability absence is detected through the platform registry returning null. A caller hides its optional workflow feature or refuses clearly before invocation; no absent module can return its own unavailable result.
  - automations.core remains a separate optional clock and ingress module. It may trigger workflows through an integration capability but workflows.core owns no schedules, webhook secrets, or polling clock.
  - A live run is bounded by graph size, payload size, node attempts, total duration, and lineage depth. Cross-workflow invocation and cycles between workflows are not supported in version one. The total duration bound counts the time the run could work; time asleep on a human approval is excluded from it and bounded by that request's own expiry instead, so a person's window is never a run's.
  - Interactive definition, history and audit lists are keyset pages of at most 100 rows over an indexed sort key (definitions by name or last update, runs by queued time, audit by sequence or time), read through opaque signed cursors bound to the tenant, the filters and the sort order. Malformed, foreign, or mismatched cursors are refused instead of being interpreted loosely.
  - Usage and cost use a versioned typed rollup with integer token counts, integer micro-USD amounts, pricing snapshot references, provisional or final state, and explicit unpriced child and action counts. Dry-run has no rollup and simulation uses not-applicable rollups.
  - Every state transition named as audit-required commits its run event, projection update, and hash-chained workflow audit event atomically. Edge data events remain ordered run evidence unless their transition also changes audited execution state.
  - Every request-time read and write runs on a tenant-scoped database handle. The worker claim poll and payload retention are the only cross-tenant reads, they run on a separate read-only role, and on PostgreSQL that role is granted only the columns that route the work under a policy of each table itself.
  - Run outcome notifications are an optional integration. When a live run reaches a terminal state the worker resolves notifications.publish.v1 from the platform capability registry at that moment, never at composition time, and publishes the outcome keyed by the run id. notifications.core is never a declared dependency. An absent capability, a cancelled run, a simulated run, and a run with no person behind it publish nothing. A publisher failure is logged once at warning level and never changes the settled run, and the kind is read from the settled row so a worker that lost the settling race reports the outcome the run actually has.
  - A run found by the cross-tenant claim poll is read again and re-checked under the tenant that row named before it is claimed, and payload retention performs each redaction in its own transaction under the tenant that owns it.
  - workflows.core declares three data classes to the platform registry while it composes, and performs their operations itself on its own leases under its own tenant transaction. workflows.core.runs holds the run record, its node states and attempts, its edge evidence, its ordered events and its sealed execution payloads, keeps them 90 days by default, sweeps only settled runs in bounded batches so a run still working, waiting on a child or asleep on an approval is never taken from its worker, exports one workspace by keyset in bounded pages, and erases in bounded batches the runs one account is the person behind, reporting a full batch as truncated. The person behind a run is the actor when a person started it, the account the actor was configured by when a schedule, a webhook or an automation started it, and the delegated authorization subject when an agent did, and the erasure matches all three so a run started on somebody's behalf is not left holding their account. A run resolves that person once when it is written and stores the answer, so an erasure is one indexed equality rather than a read of the stored actor document, which the forced row-level security policy would leave unindexable. workflows.core.audit-events is exportable and is kept until a person deletes it, because the trail is hash chained and removing its oldest links by age would make the next verification report a break it cannot tell from tampering. workflows.core.definitions is workspace configuration, is kept until a person deletes it and carries no sweep, and exports the published revision of each workflow alone. No export carries a sealed execution payload, because the archive carries the redacted evidence the run already recorded.
permissions:
  - id: workflows.definitions.read
    description: Read workflow definitions, drafts, published revisions, and validation reports in the active tenant.
  - id: workflows.definitions.manage
    description: Create, edit, archive, and delete eligible workflow drafts in the active tenant.
  - id: workflows.definitions.publish
    description: Publish a validated immutable workflow revision in the active tenant.
  - id: workflows.runs.read
    description: Read workflow runs, node attempts, edge evidence, safe payload previews, costs, and execution events in the active tenant.
  - id: workflows.runs.execute
    description: Dry-run drafts, simulate drafts or published workflows, and execute published workflows in the active tenant within the actor's existing scopes.
  - id: workflows.runs.cancel
    description: Request cooperative cancellation of live workflow runs in the active tenant.
dataOwnership:
  - workflows.core owns workflow identity, lifecycle status, mutable drafts, immutable published graph revisions, graph checksums, canvas layout, schemas, mappings, and pinned dependency references.
  - workflows.core owns durable workflow runs, invocation idempotency records, node attempts, edge transfer evidence, ordered run events, safe redacted payload snapshots, usage and cost rollups, and workflow-local audit evidence.
  - agents.core owns agent definitions, exact agent revisions, provider execution, child agent runs, model usage, provider costs, and registered action execution contracts. Workflows stores references and correlation identifiers only.
  - Business modules own their records and service operations. An action node can reach them only through a registered action contract and never through their repositories or databases.
  - auth.core owns accounts, memberships, sessions, scopes, and authorization evidence. Workflows stores the bounded invocation snapshot needed for durable execution, not credentials or session tokens.
  - automations.core owns schedules, webhook definitions, trigger secrets, and ingress audit. A triggered workflow stores only the service actor, configuring user snapshot, origin kind, and source reference.
  - notifications.core owns inbox items, deliveries, and read state. workflows.core owns the run it reports and hands over only the run id, the outcome kind, a bounded English title and step summary, and the accountable member; it never writes or reads notification records and never receives them back.
acceptanceScenarios:
  - id: WORKFLOWS-WEB-WORKER-ROLE
    given: A published workflow exists and an authorized web request enqueues a live run.
    when: The web role accepts the request before a separate worker role starts.
    then: The web role persists the run without a timer, claim or node execution, and the worker role later recovers and executes it under the existing pinned revision and actor rules.
  - id: WORKFLOWS-WORKER-DRAIN
    given: A worker role is executing a workflow node under a run claim.
    when: The platform stops that worker role.
    then: Its poll stops taking new runs, current execution drains before leases are released, and an unfinished run remains recoverable without duplicating a committed node effect.
  - id: WORKFLOWS-TYPED-DECISION-PASS
    given: A published graph with a typed-decision node whose pass answer is declared and whose threshold is pinned, in a workspace that turned typed decisions on and consented its decision connection.
    when: A live run reaches the node and the provider answers the pass answer above the threshold.
    then: The run takes the pass port, and the attempt event carries the answer, its confidence, the threshold and the connection that answered, without the question state.
  - id: WORKFLOWS-TYPED-DECISION-LOW
    given: The same graph and workspace.
    when: The provider answers below the pinned threshold.
    then: The attempt succeeds technically and takes the fail port with the recorded reason, the run continues wherever the graph routes that port, and nothing is retried as a failure.
  - id: WORKFLOWS-TYPED-DECISION-UNAVAILABLE
    given: A published graph with a typed-decision node, in a workspace that has switched typed decisions off, has no consented decision connection, or has spent its decision allowance.
    when: A live run reaches the node.
    then: The node attempt fails with the stable code of that cause and never takes the fail port, so a run that could not ask is never mistaken for one that asked and was told no.
  - id: WORKFLOWS-TYPED-DECISION-PUBLISH
    given: A draft graph whose typed-decision node names a pass answer no question declares, carries a threshold outside 0 to 1, exceeds the capability's question bounds, or runs where agents.core is absent.
    when: Publication is requested.
    then: Each is refused with a stable code naming the node, and no revision is published.
  - id: WORKFLOWS-TYPED-DECISION-NO-TOOLS
    given: A draft graph whose typed-decision node names an agent revision or grants a tool.
    when: The graph is validated or published.
    then: It is refused, because a typed-decision node reaches nothing but the decision capability.
  - id: WORKFLOWS-TYPED-DECISION-SIMULATE
    given: A published graph with a typed-decision node and a fixture for it.
    when: The workflow is simulated.
    then: The node answers from the fixture, no provider is called, no meter is counted, and the simulated attempt reports its usage and cost as not applicable.
  - id: WORKFLOW-CREATE
    given: A principal with workflow definition management permission supplies a valid name and empty draft graph.
    when: The workflow is created.
    then: A tenant-owned draft at revision one is stored without publishing or starting execution.
  - id: WORKFLOW-DRAFT-CONCURRENCY
    given: Two editors opened the same draft revision.
    when: Both submit changes with the same expected revision.
    then: The first save creates the next draft revision and the second receives a stable revision conflict without overwriting it.
  - id: WORKFLOW-GRAPH-VALIDATE
    given: A draft contains a cycle, dangling edge, incompatible port, unreachable node, arbitrary script, or missing terminal output.
    when: Validation or publication is requested.
    then: The request returns node and edge addressed errors and persists no published revision.
  - id: WORKFLOW-PUBLISH
    given: A schema-valid DAG references active exact agent revisions and registered exact read or workspace-write action contract versions available to the publisher.
    when: A principal with publication permission publishes it.
    then: An immutable content-addressed revision is created and becomes the workflow's published revision.
  - id: WORKFLOW-PINNED-DEPENDENCY
    given: A draft references an agent without a retained exact revision or an action whose contract version no longer exists.
    when: Publication or live preflight is requested.
    then: The operation is refused with the missing dependency identified and no latest-version substitution occurs.
  - id: WORKFLOW-MODULE-INVOKE
    given: A module endpoint has a trusted tenant, real user or agent actor, permission snapshot, published workflow key, bounded JSON input, and stable idempotency key.
    when: It resolves and invokes the public workflows.execution.v1 capability, or the registry reports that the capability is absent.
    then: A present capability durably returns a queued run or stable refusal, while an absent capability is handled by the caller by hiding the optional feature or refusing clearly without direct access to workflow storage.
  - id: WORKFLOW-AGENT-NODE
    given: A live run reaches an agent node pinned to an active agent revision and its execution grant contains the required scopes.
    when: The node starts.
    then: It enqueues the exact revision once through agents.core, records the child run identifier, resumes from durable child events, and emits the bounded structured output to its success port.
  - id: WORKFLOW-AGENT-DECISION
    given: A live or simulated run reaches an agent-decision node with declared pass and fail output schemas.
    when: The node returns a valid structured decision.
    then: Exactly one of pass or fail emits with its validated data and a malformed or free-form response routes to the node error policy instead of choosing a branch.
  - id: WORKFLOW-GATE
    given: A deterministic gate receives a schema-valid input envelope.
    when: Its versioned allowlisted predicate is evaluated.
    then: Exactly one pass or fail port emits the unchanged input and the evaluation is reproducible from stored evidence.
  - id: WORKFLOW-VALIDATOR
    given: A validator node has a pinned JSON schema and receives an envelope.
    when: The envelope is checked.
    then: Valid data emits on pass and invalid data emits bounded path-addressed validation errors on fail without changing business data.
  - id: WORKFLOW-ACTION
    given: A live run reaches a read or workspace-write action node pinned to a registered contract version and the actor snapshot contains every required permission.
    when: The node invokes the action with mapped schema-valid input.
    then: agents.core enforces the contract, timeout, output bound, and stable idempotency key, and the workflow stores safe correlation evidence rather than target-module internals.
  - id: WORKFLOW-ACTION-DENY
    given: An action is unknown, version-mismatched, ungranted, input-invalid, not idempotency-capable, external, or destructive.
    when: A live node attempts it.
    then: It is denied before the action service runs and the workflow records a safe stable refusal code.
  - id: WORKFLOW-CUSTOM-NODE-PALETTE
    given: A deployed business module registers a read or workspace-write action with a contract version, bounded input and output schemas, and workflow palette metadata.
    when: An authorized editor opens the workflow palette and adds that template.
    then: The editor sees its module-owned name and input fields and saves an ordinary action node pinned to the exact action identifier and contract version, with input, success, and failure ports; no source code or executable expression enters the graph.
  - id: WORKFLOW-CUSTOM-NODE-CATALOG-ROUNDTRIP
    given: An eligible module action carries optional workflowTemplate metadata in its agents.actions.v2 descriptor, while another eligible action has no template.
    when: An authorized editor requests the workflow action catalogue through the API and opens the palette.
    then: The public descriptor's label, description, effect, action id, contract version, schemas, permissions, risk, idempotency, timeout, and cancellation reach the typed client without loss; the first action appears as a named template, the second stays in the generic action editor, and a caller using agents.actions.v1 still sees its prior response shape.
  - id: WORKFLOW-CUSTOM-NODE-REGISTRATION
    given: A module registers two templates with the same action identity, or a template whose action lacks an eligible risk, idempotency contract, bounded schema, or valid presentation metadata.
    when: The platform composes the module.
    then: Invalid registration fails with a stable diagnostic before the template appears in the palette; an existing action without template metadata remains available through the generic action editor.
  - id: WORKFLOW-CUSTOM-NODE-VALIDATION
    given: A custom template's configured literal input violates its structural schema, or its module service rejects a business rule before mutation.
    when: The draft is validated and then a valid published graph receives invalid live data.
    then: The draft issue is addressed to the node, the runtime input or service refusal has a stable bounded code, and the owning module makes no business mutation; simulation uses fixtures and never invokes its handler.
  - id: WORKFLOW-CUSTOM-NODE-SECRET-DENY
    given: An action input schema marks a field writeOnly, x-flowdular-secret, or legacy x-coreloom-secret, and a draft maps a token to it through a literal, template, or path binding.
    when: A caller validates, saves, or publishes the graph, or an editor opens the template input form.
    then: The server refuses with a safe node and field code before persisting a new graph, the UI offers no editor for that field, and the token is absent from graph_json, definition detail, run events, and audit; a nonsecret opaque tenant reference is the only graph input used to select a vault or connector credential.
  - id: WORKFLOW-CUSTOM-NODE-SECRET-LEGACY
    given: An older published graph already contains a schema-marked secret literal or template from before this rule.
    when: A run preflights, a manager reads workflow detail with its draft and old revisions, updates or publishes a newer draft, reads historical run detail, simulates a draft, or exports published definitions.
    then: The run is refused with a stable safe code, the shared projection redacts or refuses every unsafe graph in all those response and export shapes while preserving safe identity and node and field diagnostics, and a manager rotates the credential and publishes a new revision with an opaque tenant reference; the old revision is not silently migrated or rebound.
  - id: WORKFLOW-CUSTOM-NODE-SECRET-UNKNOWN-SCHEMA
    given: An older graph contains an action literal or template but its pinned action input schema is unavailable, alongside a normal graph whose schema proves its bindings are not secret.
    when: A manager reads definition and run details or exports published definitions for both graphs.
    then: The first graph's action literal and template values are redacted and its run is refused until a manager explicitly rebinds a new revision, while the second graph retains its normal safe detail and export; no missing schema causes raw binding disclosure.
  - id: WORKFLOW-CUSTOM-NODE-AUTH
    given: A registered custom template requires a business permission that one editor or runner lacks.
    when: The editor lists templates or the runner reaches a published action node after its permission was withdrawn.
    then: The unscoped editor does not see the template and the live action is refused before its handler executes, while another tenant's data remains unreachable.
  - id: WORKFLOW-CUSTOM-NODE-COMPAT
    given: An older published workflow pins a custom action and a deployed module introduces a new contract while retaining the old action under its old identifier.
    when: The older run executes and a manager creates a draft with the new template.
    then: The older run invokes its pinned action, the new draft pins the new one, and removing either action instead yields a stable missing-reference refusal without rewriting prior graph revisions or run history.
  - id: WORKFLOW-CUSTOM-NODE-CONTRACT-DRIFT
    given: A published custom node pins an executable action descriptor and a later deployment changes its timeout, cancellation policy, or local versus connector-egress effect under the same action id and contract version.
    when: A live run preflights the published graph.
    then: Its complete descriptor digest mismatch refuses execution with a stable code before the handler starts; a compatible upgrade instead registers a new contract identity and leaves the old one available while published graphs need it.
  - id: WORKFLOW-CUSTOM-NODE-CANVAS
    given: A custom action template has been added between input and output nodes, and one run succeeds while another takes a failure edge.
    when: An editor opens the graph and then the run overlay.
    then: The canvas keeps the named template, declared input, success, and failure ports, and visible edges; each overlay follows the persisted edge outcomes and the same path can be inspected after reopening the run.
  - id: WORKFLOW-CUSTOM-NODE-MODULE-WRITE
    given: A business module registers a custom workspace-write action backed by its own tenant-scoped service and target idempotency ledger.
    when: A permitted workflow invokes it, recovery retries its key, and a run without the business permission tries the same node.
    then: The first invocation writes once to that module's own records, recovery returns its first result without a second mutation, and the unscoped run is refused before service work; workflows.core never queries the business module's database.
  - id: WORKFLOW-CUSTOM-NODE-CONNECTOR
    given: A consumer module registers a named connector-egress action template backed by connectors.calls.v1, and a tenant owns a connector instance with a declared operation, configured credentials, and allowWorkflows consent.
    when: The workflow invokes that template and then the owner withdraws consent before a second run.
    then: The first call reaches the connector capability with a durable key and connector call audit, the canvas identifies connector egress from the template metadata, and the second run is refused before network work; a foreign instance, undeclared operation, or absent connector module is refused without exposing credentials.
  - id: WORKFLOW-CUSTOM-NODE-CONNECTOR-REPLAY
    given: A consumer-owned connector-egress workspace-write template declares target-ledger protection, forwards its workflow side-effect key to connectors.calls.v1, and exposes only call id and outcome even when the first call returned a response body.
    when: Recovery retries the action after the connector committed the call but before the workflow settled its attempt, and the connector replay returns no body or preview.
    then: The action produces the same declared call id and outcome, performs no second external request, does not interpret the absent body as an empty original response, and refuses reuse of the key for different input; a recorded handler fixture covers crash and replay, while a workflow simulation fixture checks routing of that stable output without invoking the handler.
  - id: WORKFLOW-CUSTOM-NODE-CONNECTOR-UNKNOWN
    given: A generic connectors.call contractVersion 2 or a consumer-owned connector-egress template calls a mutating operation whose provider performed the mutation before the process crashed without a recorded connector call, and the workflow retry policy includes the connector error code.
    when: The action worker recovers after the claim window, the connector tool raises a public safe CALL_OUTCOME_UNKNOWN error, agents.actions.v2 getResult returns that code, and the workflow settles the node.
    then: No second outbound mutation occurs, no success output or call id is invented, the node records that exact code as a terminal failed attempt with connector audit correlation and does not schedule another automatic retry despite its configured retry policy; an older generic connectors.call version 1 is refused at preflight instead of using the unsafe claim path.
  - id: WORKFLOW-CUSTOM-NODE-TRAIL
    given: A custom action node is retried and its success and failure branches have different edge outcomes, with one input field marked secret and one large output.
    when: A reader with workflows.runs.read opens the run inspector before and after payload retention.
    then: All attempts show their action identifier and contract version from the pinned graph, status, safe input and output evidence states, timing, stable error, child correlation, safe idempotency reference, and traversed edges; secret content and oversized previews are redacted or truncated, expired evidence keeps hashes and metadata, and an unscoped or foreign-tenant reader sees none of it.
  - id: WORKFLOW-CUSTOM-NODE-GOLDEN
    given: A coding agent generated synthetic fixtures and expected pass, fail, and refusal paths for a new custom action node.
    when: The workflow is simulated twice with the same fixtures and virtual durations.
    then: Both runs produce equivalent semantic node attempts and edge outcomes without invoking the module handler, connector, provider, or network; tests do not compare real timestamps or store raw production payloads, and importing a production example requires prior redaction and operator approval.
  - id: WORKFLOW-CUSTOM-NODE-AGENT-AUTHORING
    given: A user opens the in-platform Sandbox for a business module and asks its coding agent to create a workflow node with named input fields and validation rules.
    when: The agent drafts the exact module spec change, the operator explicitly approves its hash, and implementation, scoped tests, deterministic simulation, preview, and eject gates pass.
    then: The agent creates reviewed module source for a versioned action, service validator, input and output schemas, workflowTemplate metadata, and golden tests; the connected preview shows the named node and safe run trail, and after host eject and deployment the action appears in the workflow palette without editing workflow engine code or letting the agent push directly.
  - id: WORKFLOW-DATA-FLOW
    given: A node emits a payload to several compatible outgoing edges.
    when: The execution advances.
    then: Each edge records the same immutable payload hash and schema identity, target mappings use literal, path, or template bindings only, and no mapping can execute code.
  - id: WORKFLOW-DETERMINISTIC-ORDER
    given: Several nodes become ready in one DAG step.
    when: Version one schedules them.
    then: It starts them sequentially in the compiled stable topological order and records that order in the run plan.
  - id: WORKFLOW-DURABLE
    given: An authorized caller invokes a published workflow.
    when: Enqueue succeeds.
    then: The run, revision, actor, origin, permissions digest, input hash, limits, mode, and idempotency key commit before the accepted response returns.
  - id: WORKFLOW-RECOVER
    given: The process stops after an action or child agent was requested but before the node settled.
    when: Another worker claims the expired workflow lease.
    then: It uses the stored child identifier and node idempotency key to observe or resume the same work without duplicating the side effect.
  - id: WORKFLOW-RETRY
    given: A node fails with a declared retryable error and has attempts remaining.
    when: The retry is scheduled and the worker restarts before its bounded backoff elapses.
    then: The failed attempt and retry-scheduled event retain the error classification, semantic attempt group, selected backoff, and next attempt time, and recovery appends a new immutable attempt with the same side-effect idempotency key only at that time while never retrying a permanent refusal.
  - id: WORKFLOW-DRY-RUN
    given: An editor has a draft graph and sample input.
    when: Dry-run is requested.
    then: The server returns a typed validation response containing a report version, graph checksum, validity, node and edge addressed issues, compiled order, reference summary, permission summary, and limits without assigning a run id, persisting invocation history, or invoking any agent, provider, action, or business mutation.
  - id: WORKFLOW-SIMULATE
    given: An editor supplies bounded fixtures and simulated durations for nondeterministic nodes.
    when: Simulation is requested.
    then: Deterministic mappings, gates, validators, and branching produce a complete persisted simulation event plan whose events store recorded time separately from virtual offset, whose usage and cost are not applicable, and whose safe evidence is produced without provider calls, action calls, business writes, or real sleep.
  - id: WORKFLOW-LIVE
    given: A published revision passes live preflight and the initiating actor holds workflow execution plus every node permission.
    when: Live execution is confirmed.
    then: The worker executes the pinned plan under the durable grant and every real agent or action appears in both workflow evidence and its owning audit boundary.
  - id: WORKFLOW-HISTORY
    given: The tenant has workflow runs in queued, intermediate, refused, cancelled, failed, and succeeded states.
    when: An authorized reader filters and pages run history.
    then: Results are tenant-scoped, ordered by queued time and run id descending unless the reader asks for the ascending order, and paged at most 100 runs at a time with an opaque cursor bound to tenant, filters and sort, while malformed, foreign, or mismatched cursors are refused and payload absence never changes row positions.
  - id: WORKFLOW-NODE-HISTORY
    given: A run contains retries, branching, skipped nodes, child agents, and actions.
    when: An authorized reader opens the run.
    then: Each node exposes its execution projection separately from immutable technically started or terminal attempts, with pass or fail represented only as a normal outcome port, plus duration, typed payload evidence state, failure or refusal, child correlation, usage, and cost without hidden reasoning or secrets.
  - id: WORKFLOW-EDGE-EVIDENCE
    given: A run traversed and closed graph branches.
    when: Its execution detail is read.
    then: Every edge shows emitted, closed, or skipped status with source attempt, target, outcome port, schema, payload hash, bounded redacted preview state, size, settled time, and stable settlement reason.
  - id: WORKFLOW-STREAM-RESUME
    given: A client observed workflow event sequence N and then reloaded or disconnected.
    when: It reconnects with a run-bound Last-Event-ID cursor or matching afterSequence N.
    then: Persisted schema-versioned events after N replay in bounded order before live events continue, non-advancing heartbeats do not change the cursor, a replay boundary tells a lagging client where to continue, a foreign or conflicting cursor is refused, and the stream closes only after flushing the terminal event without starting or cancelling the run.
  - id: WORKFLOW-CANCEL
    given: A queued or running live workflow exists.
    when: An authorized principal requests cancellation twice.
    then: One durable cancel request prevents new nodes, requests cancellation from an in-flight child agent or action, records acknowledgement, non-acknowledgement, or unsupported cancellation, observes accepted work to terminal, records and discards any late output, and settles once as cancelled.
  - id: WORKFLOW-ACTOR
    given: Runs originate from a user action, an agent tool, a schedule, and a webhook.
    when: Their history and audit events are read.
    then: User and agent origins retain their real actor, schedule and webhook origins retain a service actor plus configuring user, and origin kind and reference remain separate from actor identity.
  - id: WORKFLOW-DENY
    given: A principal is unauthenticated, lacks a workflow permission, targets another tenant, or lacks a referenced node permission.
    when: The principal reads, edits, publishes, executes, observes, or cancels a workflow.
    then: The server refuses before cross-tenant data, graph details, provider execution, or action execution is exposed.
  - id: WORKFLOW-COST
    given: A workflow run contains priced, unpriced, and retried child agent runs.
    when: The workflow settles.
    then: It stores a versioned final rollup that names included child run identifiers, uses integer token counts and integer micro-USD with pricing snapshot references, separates priced from unpriced usage, counts each settled child and action once, and never invents an action or model price.
  - id: WORKFLOW-PAYLOAD-EVIDENCE
    given: A run contains a null value, a secret value, an oversized safe value, and an evidence payload whose retention expired.
    when: An authorized reader opens its history.
    then: The response distinguishes available, redacted, truncated, expired, and absent evidence states while preserving schema, hash, and original byte size, and never returns the separately encrypted execution payload or treats an expired value as null.
  - id: WORKFLOW-EVENT-PROJECTION
    given: A run has ordered catalog events for start, child wait, retry, cancellation, edge settlement, and terminal settlement.
    when: Its run and node projections are rebuilt from sequence one.
    then: The same legal run status, node execution status, immutable attempt statuses, outcomes, and terminal state are reproduced, while an unknown event schema or illegal transition is refused instead of guessed.
  - id: WORKFLOW-AUDIT-ATOMICITY
    given: A transition requires workflow audit evidence and the audit append fails.
    when: The transition attempts to commit.
    then: Its projection change, ordered run event, and hash-chain entry all roll back together, while successful edge-only evidence remains in the ordered run stream without being misrepresented as a hash-chain action.
  - id: WORKFLOW-RETENTION
    given: A run's separately stored payload blobs exceed the configured retention period.
    when: Retention runs.
    then: It removes only those blobs after appending a retention event while keeping status, revisions, actor, mode, attempts, edge hashes, durations, costs, failures, and audit linkage queryable.
  - id: WORKFLOW-AUTOMATION
    given: An optional automation integration is installed with both automations.core and workflows.core.
    when: A schedule or signed webhook invokes a published workflow.
    then: The workflow uses the public execution capability and service actor contract while schedule, webhook, and secret ownership stays in automations.core.
  - id: WORKFLOW-LIFECYCLE
    given: A workflow is no longer used.
    when: A manager archives or deletes it.
    then: Archiving prevents new live runs, existing runs finish, and deletion is allowed only for an unpublished draft with no run history while published revisions and evidence remain immutable.
  - id: WORKFLOW-LIMITS
    given: A graph, mapping, input, output, fixture, retry policy, runtime, or lineage exceeds its declared bound.
    when: It is saved, published, simulated, or executed.
    then: The operation fails with a stable limit code before unbounded memory, storage, provider, or action work begins.
  - id: WORKFLOWS-NOTIFY-RUN
    given: A live workflow run started by a member reaches a terminal state, and the optional notifications module may or may not be composed.
    when: The worker commits the terminal status.
    then: With notifications.core composed, exactly one workflow-run-completed or workflow-run-failed notification is published after that commit, keyed by the run id, addressed to the member accountable for the run, and carrying no payload or evidence; without it, for a cancelled or simulated run, or when the publisher fails, the run settles unchanged and nothing is published.
  - id: WF-CLAIM-NARROW
    given: Two workspaces each own a queued live run.
    when: The worker polls for claimable work across tenants.
    then: The poll returns only the workspace id, run id, mode, status, lease expiry and queue time; the graph, actor, permission snapshot and payload ciphertext are unreadable on that connection, it cannot write, and each run is claimed exactly once under its own workspace.
  - id: WORKFLOWS-HUMAN-APPROVAL
    given: A published workflow revision carrying a human-approval node that requires a workspace role, and approvals.core composed.
    when: A run reaches the node, an owner approves it, in a second run an owner rejects it, and in a third run nobody answers until the request's deadline passes.
    then: The first run pauses with one pending request and resumes to completion after the approval; the second run fails with a stable code after the rejection; the third stays paused past the run duration bound and fails with a stable code at the request's deadline, withdrawing the pending request; a revision naming a role the workspace does not define, carrying a prompt or a label longer than a request title, or published while approvals.core is absent, is refused at publish time with a stable validation code; and a request resolved before the worker armed the wait still resumes its run rather than sleeping until the recheck.
  - id: WORKFLOWS-DATA-CLASSES
    given: Two workspaces hold workflow runs of several ages with node states, edge evidence and sealed payloads, one run still working, plus published workflows and a draft, and the platform has sealed the data class registry.
    when: The platform sweeps, exports and erases the declared classes for one of them.
    then: The sweep removes only that workspace's settled runs strictly older than the cutoff and at most the batch it was given, taking their node states, attempts, edges, events and sealed payloads with them while the working run stays; the export streams that workspace's runs with their nodes and edges, its audit trail in chain order, and its published workflows without their drafts, through the sink in keyset pages with the oldest and newest record time, answers no rows and no range for a workspace that holds none, and carries no payload ciphertext; the audit trail carries no sweep and no erasure; and erasing a subject removes the runs that account is the person behind in that workspace alone, including the ones a schedule or an agent started on its behalf, reporting a full batch as truncated.
entities:
  - id: workflow-definition
    name: Workflow definition
    fields:
      - id: key
        type: string
        required: true
        unique: tenant
        maxLength: 120
      - id: name
        type: string
        required: true
        maxLength: 160
      - id: description
        type: text
        required: true
        maxLength: 2000
      - id: status
        type: enum
        required: true
        values:
          - active
          - archived
      - id: currentDraftRevision
        type: integer
        required: true
      - id: publishedRevision
        type: integer
      - id: updatedAt
        type: datetime
        required: true
screens:
  - id: workflows
    kind: list
    entity: workflow-definition
    title: Workflows
    columns:
      - name
      - key
      - currentDraftRevision
      - publishedRevision
      - updatedAt
      - status
    navigationGroup: Operations
outOfScope:
  - Arbitrary new graph execution kinds, custom port counts, and custom canvas renderers are deferred; a module composes existing action, gate, and validator nodes for these flows.
  - Executing generated or pasted source code inside a workflow definition or browser session is excluded; a coding agent changes reviewed module source in a sandbox worktree and deployment makes its registered action available.
  - A dedicated coding chat control embedded in the workflow canvas is deferred; the user starts authoring in the existing in-platform Sandbox, and Module Studio may provide another entry point after its own approval.
  - Ready-made Slack, arbitrary-recipient e-mail, and other provider-specific actions are deferred; the corrected connectors.call contractVersion 2 remains usable through the generic action editor for a configured connector operation, while a dedicated provider or mail adapter needs its own module contract, consent, idempotency and tests.
  - Automatic export of live input or output into repository fixtures is excluded; synthetic fixtures are the default and a live example requires explicit redaction and operator approval before recording.
  - Runtime sandboxing of trusted module source is outside workflows.core; integration actions must use the declared connectors.calls.v1 capability and pass code review and tests instead of claiming arbitrary HTTP is a local write.
decisions:
  - id: D-CUSTOM-NODE-SHAPE
    question: How are business-specific workflow nodes executed?
    answer: Use versioned module actions with optional palette metadata and the existing workflow action runtime; custom templates keep fixed input, success, and failure ports.
    decidedBy: user
  - id: D-CUSTOM-NODE-VALIDATION
    question: Where do business-specific input rules run?
    answer: Use the declared JSON input schema for structure and the owning module service for code-level rules before mutation; dry-run and simulation do not call that service.
    decidedBy: default
  - id: D-CUSTOM-NODE-CATALOG
    question: How does a workflow discover optional action template metadata?
    answer: agents.core exposes agents.actions.v2 from its existing tool registry, retaining agents.actions.v1 for old consumers; workflows.core reads the public v2 descriptor and never resolves tools directly.
    decidedBy: default
  - id: D-CUSTOM-NODE-SECRETS
    question: How are credentials supplied to a custom action?
    answer: Graph definitions cannot bind schema-marked secret fields; an owning module resolves credentials from an opaque tenant-bound vault or connector reference, and older unsafe revisions are refused until replaced after credential rotation.
    decidedBy: default
  - id: D-CUSTOM-NODE-COMPAT
    question: What happens to published graphs when a custom action changes?
    answer: Keep the old action identifier registered beside a new identifier while old graphs need it; never rebind a pinned graph or run automatically.
    decidedBy: default
  - id: D-CUSTOM-NODE-AUTHORING
    question: How does an agent create a custom node?
    answer: The user asks the in-platform Sandbox coding agent, which follows a workflow-node authoring recipe, interviews and waits for exact spec approval, then edits module source and tests in its isolated workspace; host preview and eject deploy the action, while browser input cannot install executable code directly.
    decidedBy: default
  - id: D-CUSTOM-NODE-INTEGRATION
    question: How may a custom node reach an external service or another module's records?
    answer: Use the corrected connectors.call action at contractVersion 2 or a consumer module requiring connectors.core ^0.2.0 and connectors.calls.v1 for tenant-consented egress; an unresolved connector claim produces nonretryable CALL_OUTCOME_UNKNOWN until a provider-specific recovery contract reconciles it. Use a declared module capability and the owning service for records; keep credentials outside the graph. Direct HTTP and cross-module SQL remain unavailable.
    decidedBy: default
  - id: D-CUSTOM-NODE-TRACE
    question: Where do per-node debugging evidence and golden tests live?
    answer: Reuse persisted workflow attempts and edge events for authorized, redacted run inspection; compare synthetic simulation fixtures against semantic outcomes and require explicit redaction and approval before recording live payloads.
    decidedBy: default
