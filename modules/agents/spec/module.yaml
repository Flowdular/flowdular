schemaVersion: 1
id: agents.core
specVersion: 0.12.1
status: approved
name: Agentic Core
description: Provides tenant-created and module-owned business agent definitions, tenant-scoped provider connections, reusable procedures, durable streamed execution, run history, and the public run queue used by optional automation modules.
profile: full
capabilities:
  - api
  - database
  - client
  - translations
  - integration
  - cli
dependencies:
  - id: system.core
    range: ^0.5.1
  - id: auth.core
    range: ^0.12.0
  - id: metering.core
    range: ^0.1.0
tenancy: required
locales:
  - en
  - pl
invariants:
  - Every agent managed by agents.core is a business agent with explicit ownership. A tenant-created definition is owned by one tenant; a module-owned definition is owned by one enabled module and receives a separate tenant-scoped execution binding. Sandbox coding specialists are outside agents.core. Every binding, run, and repository query receives the trusted tenant identifier.
  - An enabled module may register immutable business agent behavior during platform composition with defineAgent. Its stable identity is derived from module id and agent key, its positive definition revision is supplied by the module, and malformed or duplicate identities fail platform boot before workers start.
  - Module-owned instructions, names, maximum tool allowlists, and execution limits are read-only module source. A tenant administrator may bind an available provider and model, pause the binding, and reduce its enabled tool set, but cannot broaden the module allowlist or edit the module behavior in the Agents UI.
  - An unconfigured module-owned agent is visible as unconfigured but cannot be activated, published in a workflow, or executed until its tenant binding names a usable provider and model.
  - A module definition revision is content-stable. Reusing one revision with different executable content or moving backwards fails platform boot. A higher definition revision creates a new immutable tenant executable revision for every existing binding without changing retained revisions.
  - Tenant-created and module-owned executable revisions share one exact-revision contract. A provider, model, module definition revision, instructions, limits, and effective maximum tools are retained before the revision can be used by a workflow.
  - Agent execution is durable and fire-and-forget. The enqueue request persists a queued run before returning and never waits for provider completion.
  - Queued and interrupted runs are recovered after runtime restart without executing one run concurrently more than once inside a process.
  - Browser lifecycle and authenticated session lifetime do not control a queued run after the enqueue transaction commits.
  - Workers claim runs with expiring leases so an interrupted claim can be recovered without allowing two live workers to own the same run.
  - Every claimed run receives a short-lived signed run grant bound to tenant, run, provider, model, worker, attempt, permission digest, tool-grant digest, and current lease. The provider broker atomically consumes the grant once and never returns the upstream credential.
  - Run grants are stored only as hashes and safe identifiers. A replay, expired grant, wrong audience, invalid signature, or grant presented after lease loss is rejected before provider resolution.
  - A single claimed execution can remain detached for up to 24 hours while the worker renews its lease. Provider calls and tools must still use narrower operation timeouts and idempotency controls where side effects are possible.
  - Agent instructions never grant authority. Model execution can reach platform behavior only through registered agent tools and never receives the platform capability registry directly.
  - Agent instructions are a variable template. The stored definition keeps the raw double-brace template; every run snapshot carries the instructions resolved against the run context (tenant name, principal, UTC date) before the harness executes. A variable is offered and resolved only when the principal holds the scope declared by its source.
  - Arbitrary source code, shell commands, raw secrets, and runtime-downloaded client code cannot be stored as agent configuration.
  - Provider, model, instruction revision, limits, input, output, usage, and execution events are captured with every run.
  - Authorization decisions use server-side RBAC scopes and persist the initiating subject plus a permission snapshot for audit without treating that snapshot as future authority.
  - Playground runs use the same authorization, tenancy, budgets, provider adapter, and audit path as platform-triggered runs.
  - The bundled local simulation provider has network access disabled and does not claim to be a production language model.
  - Agent definitions, playground, run history, providers, procedures, and usage are contributed under one collapsible Agents navigation group owned by agents.core. The product never presents these business procedures as coding-agent skills, and the `.ai/skills` and `.agents/skills` authoring catalogs remain separate concepts.
  - Provider connections are configured through authenticated agents.core APIs and stored as tenant-owned metadata plus an encrypted credential envelope; raw credentials never enter client responses, logs, audit metadata, agent definitions, run snapshots, or harness events.
  - The credential encryption key is external to the agents database. Production startup fails when no explicit key is configured, while local development may create a permission-restricted key file outside the database.
  - Provider credentials are decrypted just in time for one claimed execution or readiness probe and are not retained by the harness after that operation.
  - Provider adapters use the Vercel AI SDK language model contract. Bundled adapter kinds are Vercel AI Gateway, Azure OpenAI, OpenAI, OpenAI-compatible, Anthropic, and local simulation.
  - An OpenAI-compatible base URL must use HTTPS and match a deployment-controlled outbound hostname allowlist; provider configuration cannot create arbitrary network access or target private infrastructure.
  - A readiness probe performs a bounded server-side model request, records only safe status, latency, model, and error classification, and never returns provider response bodies or credentials.
  - An agent can be activated only when its provider connection is enabled, its selected model is enabled, and the latest readiness result is healthy within the configured freshness window.
  - Procedures are versioned instruction and capability bundles. A procedure cannot contain executable source code, credentials, or grant a tool that is not independently registered and authorized.
  - Procedures are canonical in the domain model and authenticated API through procedureIds, procedureSnapshots, a procedures response collection, and `/api/agent-procedures` mutation routes. Deprecated skill-named fields and `/api/agent-skills` routes operate on the same records and revisions during the compatibility window and never create a second resource.
  - Existing authorization grants, database rows, run evidence, and audit chains survive the product rename without rewriting history. The stable `agents.skills.read` and `agents.skills.manage` permission identifiers, legacy `agent_skills` storage names, and historical `agent-skill` audit identifiers remain compatibility details while their user-facing labels and descriptions say procedures.
  - Archiving an agent prevents new runs while keeping durable run evidence. Deletion requires an archived, unreferenced record and never cascades through run history or active agent assignments.
  - Tool calls use validated input schemas, explicit grants, target-module server authorization, timeouts, output limits, and persisted start, completion, or denial events. A run sees only the exact intersection of the definition allowlist, a module binding reduction when present, the invocation grants, and tools whose required permissions exist in the initiating actor's trusted permission snapshot. Wildcards never grant tools.
  - Web search is disabled by default and requires an explicit agent policy plus a registered web search capability. Provider-native web search cannot bypass the same permission, budget, audit, and egress controls.
  - Worker output is streamed into ordered durable run events. UI streaming observes persisted events and never owns or cancels the underlying run lifecycle.
  - Workflow, service, and optional automation modules use the same durable enqueue capability as the playground and include a stable idempotency key and initiating principal or approved system principal.
  - agents.core does not own automation schedules, webhook definitions, trigger secrets, or an automation clock. Optional modules reach it only through the public agents.run-queue capability.
  - A run's cost is computed once, from its reported usage and a published per-model price, in the same transaction that settles the run. A model without a published price is recorded in tokens and left unpriced, never priced at a guess.
  - Budget caps are tenant-scoped module settings checked when a run is enqueued. A run already executing is never stopped mid-way, so concurrent enqueues may overshoot a cap by the cost of the runs still in flight.
  - Every saved agent revision is retained as an immutable executable snapshot, including its ownership, exact instructions, procedures, tools, provider, model, and limits.
  - Workflow agent nodes request an exact retained revision through agents.run-execution.v2. The request is workflow-bound, tenant-bound, idempotent, observable through persisted events, and cancellable through the same capability.
  - A structured-output run starts only when its pinned provider can guarantee the declared JSON Schema contract. The harness validates the returned JSON again before the worker settles the run.
  - Business actions exposed to workflows are explicit versioned contracts. Only read and workspace-write risks are eligible, input and output are schema checked, and every invocation is persisted before execution.
  - Workflow action invocations receive a trusted actor, permission snapshot, idempotency key, and AbortSignal. Secrets, raw input, and raw output never enter audit metadata.
  - Every request-time read and write runs on a tenant-scoped database handle. The worker recovery polls are the only cross-tenant reads, they run on a separate read-only role, and the module agent catalog is reconciled at boot on the schema-owner lease that runs migrations.
  - Run outcome notifications are an optional integration. When a durable run reaches a terminal state the worker resolves notifications.publish.v1 from the platform capability registry at that moment, never at composition time, and publishes the outcome keyed by the run id. notifications.core is never a declared dependency. An absent capability, a run with no person behind it, and a run a workflow owns publish nothing. A publisher failure is logged once at warning level and never changes the settled run, and a repeated terminal step reports the same outcome instead of a second notification.
  - Every table that carries tenant data enables and forces row-level security with a policy bound to the transaction-local tenant, including the child tables that hang off a run, a definition or a provider connection. A read by a caller-supplied parent id therefore cannot cross a workspace even when application code forgets the predicate.
  - agents.core declares three data classes to the platform registry while it composes, and performs their operations itself on its own leases under its own tenant transaction. agents.core.runs holds the run record, its steps and the child rows that hang off it, keeps them 90 days by default, sweeps only settled runs in bounded batches so a queued or running run is never taken from its worker, exports one workspace by keyset in bounded pages, and erases the runs one account requested in bounded batches, reporting a full batch as truncated. agents.core.audit-events is exportable and is kept until a person deletes it, because the trail is hash chained and removing its oldest links by age would make the next verification report a break it cannot tell from tampering. agents.core.provider-credentials is workspace configuration, is never swept, and is excluded from the export with a stated reason because the row exists to hold a sealed provider secret. No export carries a credential or a sealed payload.
  - agents.core depends on metering.core and requires the public metering.meters.v1 capability, so the module registry composes metering.core first and refuses a composition that leaves it out or that provides no meter registry. The meters agents.core.run-tokens and agents.core.runs are declared once while agents.core composes; every later use resolves the registry through the capability at the point of use rather than holding the one composition found. A settled run is counted once, keyed by the run id, so a repeated terminal step reports the same fact instead of a second one, and a run that reported no tokens counts the run alone. Counting is advisory and runs after the terminal row commits, so a metering failure never changes a settled run.
  - Before a run is created the module asks metering.meters.v1 about both meters a run costs, on every enqueue path. agents.core.runs is asked for one run first and agents.core.run-tokens for the tokens the run may read and write, so a workspace that has spent either allowance is refused. A refused verdict fails the run start with METER_LIMIT_EXCEEDED naming that meter and creates no run. An allowed or warning verdict starts the run unchanged, and the settled fact replaces the estimate.
  - A refused meter is recorded in this module's own hash-chained trail once per workspace, meter and calendar month, with the meter, the estimate, the month's usage and the limit. The claim that a refusal was already recorded is a row of agents.core's own tenant table, and taking it removes the rows of earlier months, so the workspace holds one row per meter however long it keeps being refused. Every attempt still asks metering.core, so a workspace is refused on what its month holds now and never on a remembered verdict, and the first refusal after the month turns is recorded again.
permissions:
  - id: agents.definitions.read
    description: Read agent definitions in the active tenant.
  - id: agents.definitions.manage
    description: Create and update agent definitions in the active tenant.
  - id: agents.runs.read
    description: Read agent runs and execution traces in the active tenant.
  - id: agents.runs.execute
    description: Queue playground and platform agent runs in the active tenant.
  - id: agents.providers.read
    description: Read safe provider connection metadata and readiness in the active tenant.
  - id: agents.providers.manage
    description: Create, rotate, enable, disable, and remove provider connections in the active tenant.
  - id: agents.providers.test
    description: Execute a bounded readiness probe against a configured provider model.
  - id: agents.skills.read
    description: Read reusable agent procedures in the active tenant. The skill-named identifier is retained for authorization compatibility.
  - id: agents.skills.manage
    description: Create and version reusable agent procedures in the active tenant. The skill-named identifier is retained for authorization compatibility.
dataOwnership:
  - Business modules own the current module-supplied definition and semantic revision of each module-owned business agent they register.
  - agents.core owns tenant-created agent identity and configuration, tenant bindings for module-owned agents, provider and model selection, reduced tool grants, executable revisions, and lifecycle status.
  - agents.core owns durable run state, input and output snapshots, usage, timing, failure data, and append-only execution events.
  - agents.core owns provider connection metadata, encrypted credential envelopes, configured model allowlists, readiness history, and credential revision identifiers.
  - agents.core owns procedure identity, versioned instructions, required tool identifiers, lifecycle status, and agent-to-procedure assignments. Existing skill-named storage objects hold the same procedure records during the compatibility window.
  - agents.core owns the per-run cost projection, its per-day and per-agent rollups, and the budget caps declared as module settings.
  - agents.core owns immutable agent revision snapshots, workflow-bound run output contracts, and durable versioned action invocation state.
  - Business modules own their records and expose narrowly scoped tools to the harness; agents.core never bypasses their services or ACL rules.
  - metering.core owns meter declarations as recorded, day buckets and limits. agents.core owns the meters it declares, the standing refusal rows that keep one refused meter out of its trail per workspace and month, and the decision about what a refusal means for a run; it never reads or writes metering storage.
  - notifications.core owns inbox items, deliveries, and read state. agents.core owns the run it reports and hands over only the run id, the outcome kind, a bounded English title and outcome summary, and the accountable member; it never writes or reads notification records and never receives them back.
acceptanceScenarios:
  - id: AGENTS-LIST
    given: Tenant-created business agents and enabled modules with module-owned business agents exist.
    when: An authorized principal lists agents.
    then: The active tenant receives a deterministic catalog with an explicit tenant or module ownership discriminator and no definition from another tenant or disabled module.
  - id: AGENTS-MODULE-REGISTER
    given: An enabled module registers a valid defineAgent definition during composition.
    when: The platform finishes composing modules before starting workers.
    then: The agent registry seals a frozen definition with a stable module-derived identity, while a malformed definition, duplicate identity, wildcard tool, or conflicting same-revision content fails boot.
  - id: AGENTS-MODULE-BIND
    given: A module-owned agent is registered but has no tenant execution binding.
    when: A tenant manager selects a healthy provider and model, chooses a subset of the code allowlist, and activates the binding.
    then: agents.core creates a tenant-scoped immutable executable revision and the business agent becomes runnable without copying or editing its module-owned behavior.
  - id: AGENTS-MODULE-READONLY
    given: A principal can manage agent definitions in the active tenant.
    when: The principal opens, updates, archives, or deletes a module-owned agent.
    then: The UI and API allow only binding changes such as provider, model, paused state, and tool reduction, and refuse edits or deletion of the module-owned definition with a stable error.
  - id: AGENTS-MODULE-REVISION
    given: Existing tenant bindings point at a retained executable revision of a module-owned agent.
    when: A deployment registers a higher module definition revision.
    then: Existing bindings advance to a new immutable executable revision, old workflow references retain their exact snapshot, and a code downgrade or same-revision content drift fails boot.
  - id: AGENTS-MODULE-UNAVAILABLE
    given: A workflow or caller references a module-owned agent whose owning module is no longer registered.
    when: It lists current agents or requests a new execution.
    then: The agent is unavailable for new work and the request is refused without deleting retained revisions, completed runs, or audit evidence.
  - id: AGENTS-CREATE
    given: An authorized principal supplies valid instructions, provider, model, limits, and tool grants.
    when: The agent is created.
    then: A tenant-owned draft agent is persisted at revision one without storing credentials or executable source code.
  - id: AGENTS-UPDATE
    given: An authorized principal edits an agent owned by the active tenant.
    when: The update is accepted.
    then: The definition revision increments and future runs snapshot the new revision while historical runs remain unchanged.
  - id: AGENTS-QUEUE
    given: An active agent and a principal with execution permission.
    when: A playground or platform run is requested.
    then: A queued run is durably persisted and a 202 response is returned before provider execution completes.
  - id: AGENTS-EXECUTE
    given: A queued run with valid server-side grants and bounded execution settings.
    when: The harness worker claims the run.
    then: The run reaches succeeded or failed with output, usage, timestamps, and ordered execution events persisted.
  - id: AGENTS-RECOVER
    given: The process stops after a run was queued or claimed.
    when: The runtime starts again.
    then: Pending runs are recovered and scheduled without duplicate concurrent execution inside that runtime.
  - id: AGENTS-DETACHED
    given: A run was durably queued by an authorized principal.
    when: The initiating browser disconnects or its session later expires.
    then: The worker continues the run from persisted state using bounded execution grants captured by the server at enqueue time.
  - id: AGENTS-AUDIT
    given: An agent is created, changed, queued, claimed, completed, or failed.
    when: The state transition commits.
    then: An append-only tenant-scoped audit event records the actor, action, subject, timestamp, and safe metadata without raw credentials.
  - id: AGENTS-PLAYGROUND
    given: An authorized user enters test input for an active agent.
    when: The playground queues the run.
    then: The UI returns immediately, polls the durable run, and renders its final output or stable failure without a blocking request.
  - id: AGENTS-DENY
    given: A principal is unauthenticated, lacks the required scope, or targets another tenant.
    when: The principal reads, configures, or executes an agent.
    then: The server denies the operation before cross-tenant data or provider execution is exposed.
  - id: AGENTS-PROVIDER-CREATE
    given: An owner with provider management permission submits a supported provider kind, safe metadata, model allowlist, and credential.
    when: The provider connection is created.
    then: Tenant-owned metadata and an encrypted credential envelope are persisted while the response exposes only credential presence and revision.
  - id: AGENTS-PROVIDER-ROTATE
    given: An existing provider connection and a new credential.
    when: An authorized owner rotates the credential.
    then: The encrypted envelope and credential revision change, existing run history stays immutable, and no raw credential is logged or returned.
  - id: AGENTS-PROVIDER-READINESS
    given: An enabled provider connection, an enabled model, and a principal with provider test permission.
    when: A readiness probe is requested.
    then: A bounded Vercel AI SDK request verifies authentication and model execution and stores safe health, latency, timestamp, and error classification.
  - id: AGENTS-PROVIDER-SSRF-DENY
    given: An OpenAI-compatible connection targets a non-HTTPS, private, loopback, link-local, or non-allowlisted hostname.
    when: Configuration or a readiness probe is attempted.
    then: The operation is denied before any outbound request or credential use.
  - id: AGENTS-PROVIDER-ACTIVATION
    given: An agent references an unknown, disabled, stale, or unhealthy provider model.
    when: Activation or enqueue is requested.
    then: The server rejects the operation with a stable readiness error and no provider call starts.
  - id: AGENTS-PROCEDURE
    given: An authorized owner defines a procedure with bounded instructions and registered required tools.
    when: The procedure is attached to an agent and the agent runs.
    then: The harness receives the approved procedure revision, merges its instructions, intersects its tools with agent and run grants, and persists evidence of each capability invoked.
  - id: AGENTS-PROCEDURE-COMPATIBILITY
    given: Existing clients, permission grants, databases, retained revisions, and audit events use the former skill-named contract.
    when: agents.core is upgraded to the procedure-named contract.
    then: The canonical and deprecated API surfaces resolve the same tenant-owned procedure ids and revisions, existing data remains readable and writable without copying it, and no authorization grant, run snapshot, or audit-chain hash is rewritten.
  - id: AGENTS-PROCEDURE-NAVIGATION
    given: A principal can read reusable agent procedures.
    when: The principal opens the Agents navigation or follows the former agent-skills deep link.
    then: The product shows one Procedures screen with procedure terminology throughout, while the former deep link resolves to that same screen without adding a duplicate navigation item.
  - id: AGENTS-TOOL-BOUNDARY
    given: An agent definition has an exact tool allowlist, a module binding may reduce it, an invocation requests explicit grants, and the actor carries a trusted permission snapshot.
    when: The run is enqueued and the model requests tools.
    then: The persisted and exposed tools are only the intersection of all four constraints, an out-of-allowlist or wildcard grant never expands access, and a tool lacking its required permission is denied before execution.
  - id: AGENTS-LIFECYCLE
    given: An agent definition, procedure, or provider connection is no longer needed.
    when: An authorized manager archives or deletes it.
    then: Archiving records an audit event and prevents unsafe future use; deletion checks the trusted tenant, current revision, CSRF, and all active references without cascading run evidence or assignments.
  - id: AGENTS-WEB-SEARCH
    given: An agent has web search disabled or lacks the registered web search permission and grant.
    when: A model requests web search.
    then: The harness denies the call and persists a safe denial event without making a network request.
  - id: AGENTS-STREAM
    given: A claimed run is producing model text or tool events.
    when: An authorized client observes the run event stream.
    then: Ordered persisted deltas and lifecycle events arrive without exposing credentials, hidden provider reasoning, or cross-tenant data.
  - id: AGENTS-RUN-GRANT
    given: A worker owns a live lease for a claimed run.
    when: It requests provider execution.
    then: A signed run grant is issued, atomically consumed once by the provider broker, recorded without its token, and rejected on replay or lease mismatch without returning provider credentials.
  - id: AGENTS-LONG-RUN
    given: An active agent has a bounded execution timeout of up to 24 hours.
    when: Its run continues after the initiating browser closes or session expires.
    then: The worker renews the lease and the persisted run continues independently until completion, bounded failure, or recoverable process interruption.
  - id: AGENTS-WORKFLOW-TRIGGER
    given: A workflow node references an active agent and supplies an idempotency key, bounded input, tenant, and approved execution principal.
    when: The workflow enqueues agent work.
    then: The same durable run contract returns immediately and the workflow can resume from the terminal run event.
  - id: AGENTS-TEMPLATE
    given: An agent definition whose instructions embed run context variables such as context.tenantName and context.today.
    when: An authorized principal queues a run.
    then: The run snapshot carries the instructions resolved to the active tenant, requesting principal, and UTC date while the stored definition keeps the raw template.
  - id: AGENTS-AUDIT-READ
    given: A principal reads the agent audit trail over HTTP.
    when: The principal lacks agents.runs.read, or holds it and pages with a cursor.
    then: The request is denied before any row is read without the scope, and with it only the active tenant's events are returned newest first with a stable occurred-at and sequence cursor and the chain fields.
  - id: AGENTS-AUDIT-VERIFY
    given: A stored agent audit row is altered after it was written.
    when: A principal with agents.runs.read verifies the chain over HTTP, reusing the same walk as the audit-verify CLI.
    then: The response reports the chain as not verified and names the identifier of the first broken row.
  - id: AGENTS-COST
    given: A run completes and reports its token usage.
    when: The run is settled.
    then: Its cost is written in the same transaction from the published price of its model, or left unpriced when the model has none, and appears in the tenant's per-day and per-agent rollups.
  - id: AGENTS-BUDGET
    given: A tenant or per-agent monthly budget is configured and the month's settled cost has reached it.
    when: A further run is enqueued.
    then: The enqueue is refused with a stable budget code before any provider call, while runs already executing continue to completion.
  - id: AGENTS-EXACT-REVISION
    given: A workflow references an active retained agent revision and that agent is edited later.
    when: The workflow enqueues the pinned revision.
    then: The run uses the retained instructions, procedures, tools, provider, model, and limits exactly as saved for that revision.
  - id: AGENTS-MODULE-WORKFLOW
    given: A published workflow pins an active executable revision of a module-owned agent.
    when: The module later registers a higher definition revision or a tenant manager changes its provider binding.
    then: The published workflow continues to resolve the retained executable revision, while newly published workflows can select the new current revision.
  - id: AGENTS-STRUCTURED-OUTPUT
    given: A workflow requests JSON output with a bounded schema from a pinned provider model that supports structured output.
    when: The provider completes the run.
    then: The harness validates the structured value against the schema before the worker persists it, and a missing or invalid value fails with a stable code.
  - id: AGENTS-WORKFLOW-OBSERVE
    given: A workflow enqueued an exact agent revision with a stable idempotency key.
    when: It observes events, reads the result, retries enqueue, or requests cancellation.
    then: It sees only the same tenant and workflow run, retry returns the original run, events remain ordered, and cancellation does not cross an actor or tenant boundary.
  - id: AGENTS-VERSIONED-ACTION
    given: A registered tool opts into workflow use with schemas, a positive contract version, read or workspace-write risk, required idempotency, and a cancellation policy.
    when: A workflow starts the action with a trusted actor and sufficient permission snapshot.
    then: The invocation is persisted before execution, repeated input returns the original invocation, different input conflicts, and output is schema checked before settlement.
  - id: AGENTS-ACTION-DENY
    given: A tool is destructive, external, incomplete, targets another tenant, lacks a required permission, or receives invalid input.
    when: A workflow attempts to list, start, observe, or cancel it.
    then: The capability excludes or refuses it before execution without exposing secrets, cross-tenant state, or raw payloads in audit metadata.
  - id: AGENTS-SERVICE-ACTOR
    given: A schedule, webhook, or other service identity was configured by an authenticated user.
    when: It initiates workflow agent work or a versioned action.
    then: Durable state records the service actor and its configuring user so history never presents background work as an anonymous system mutation.
  - id: AGENTS-NOTIFY-RUN
    given: A durable agent run started by a member reaches a terminal state, and the optional notifications module may or may not be composed.
    when: The worker commits the terminal status.
    then: With notifications.core composed, exactly one agent-run-completed or agent-run-failed notification is published after that commit, keyed by the run id, addressed to the member accountable for the run, and carrying no credentials, prompt, or transcript; without it, for a run a workflow owns, or when the publisher fails, the run settles unchanged and nothing is published.
  - id: AGENT-CHILD-ISOLATION
    given: Two workspaces each own an agent run with procedure snapshots and a provider connection with model readiness.
    when: A caller supplies the other workspace's run id or provider id directly.
    then: The read returns nothing, because those child tables carry their own workspace and force row-level security rather than relying on their parent.
  - id: AGENTS-DATA-CLASSES
    given: Two workspaces hold agent runs of several ages with their steps, one run still queued, a provider connection with a sealed credential, and the platform has sealed the data class registry.
    when: The platform sweeps, exports and erases the declared classes for one of them.
    then: The sweep removes only that workspace's settled runs strictly older than the cutoff and at most the batch it was given, taking their steps with them while the queued run stays; the export streams that workspace's runs and its audit trail through the sink in keyset pages with the oldest and newest record time, answers no rows and no range for a workspace that holds none, and carries no provider credential; the audit class declares no sweep; and erasing a subject removes the runs that account requested in that workspace alone, reporting a full batch as truncated.
  - id: AGENTS-METER-COUNT
    given: A workspace runs an agent and metering.core is composed, as every deployment of agents.core must compose it.
    when: The platform composes and the run settles.
    then: agents.core.run-tokens and agents.core.runs are declared at composition, the settled run counts one run and its reported tokens against the run id, and a run that reported none counts the run alone.
  - id: AGENTS-METER-REFUSED
    given: A workspace has used its monthly token allowance for agents.core.run-tokens.
    when: A further run is requested through any enqueue path.
    then: The request is refused with METER_LIMIT_EXCEEDED before a run row exists, the refusal is recorded in the agents audit trail with the meter, the estimate, the usage and the limit, the chain still verifies, and nothing is counted for the refused request.
  - id: AGENTS-METERING-REQUIRED
    given: A composition of agents.core with the platform modules it depends on.
    when: The module registry composes it without metering.core, and again with a metering.core that provides no meter registry.
    then: The first is refused with MODULE_DEPENDENCY_MISSING and the second with MODULE_CAPABILITY_MISSING; a complete composition orders metering.core before agents.core.
  - id: AGENTS-METER-RUNS-LIMIT
    given: A workspace that has used its monthly allowance of agents.core.runs while its token allowance is untouched.
    when: A run is requested.
    then: The request is refused with METER_LIMIT_EXCEEDED before a run row exists, the refusal names the runs meter and the amount of one run, and the token allowance is never asked.
  - id: AGENTS-METER-REFUSAL-ONCE
    given: A workspace refused on one meter that retries the request several times inside one month.
    when: Every attempt is made.
    then: Each is refused and asks metering.core again, the trail carries exactly one refusal for that workspace, meter and month, the chain still verifies, and the first attempt in the next month is recorded once more.
  - id: AGENTS-ERASE-RUNNING-RUN
    given: A run a worker of this process is executing, requested by the account an erasure names.
    when: The agents.core.runs erase operation removes it mid-flight.
    then: The worker's lease renewal cannot prove ownership, the execution is aborted as a lost lease, no terminal status and no terminal audit event are written for the run that is gone, and the worker returns to idle.
