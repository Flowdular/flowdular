schemaVersion: 2
id: auth.core
specVersion: 0.14.7
status: in-review
name: Authentication Core
description: Provides tenant-aware accounts, password authentication, sessions, scopes, tenant roles, API tokens for machine clients, the module settings store, the auth audit trail, security headers, authentication screens, and server authorization middleware.
profile: full
capabilities:
  - api
  - database
  - client
  - translations
  - cli
dependencies:
  - id: system.core
    range: ^0.9.0
tenancy: required
locales:
  - en
  - pl
invariants:
  - Passwords are stored only as salted memory-hard hashes.
  - Raw session tokens are never persisted and never exposed to browser JavaScript.
  - Greenfield reset is restricted to the workspace-local development database and requires explicit typed confirmation.
  - Authentication cookies are HttpOnly, same-site, host-only, and secure outside explicitly configured local development.
  - Every authenticated principal belongs to exactly one active tenant context.
  - An account may belong to multiple tenants, while every session is bound to one selected membership.
  - Switching tenant context rotates the session and loads scopes from the target membership.
  - Authorization is evaluated server-side and missing scopes are denied.
  - Sign-up availability is controlled by the auth.allowSignUp module setting and is enforced by both the API and client.
  - An account may hold no password at all. The administration port creates such a member with an unusable credential marker rather than a placeholder secret, so nothing was drawn that could be guessed or leaked. A password sign-in for it is refused exactly as an unregistered address is, with the same code and the same derivation cost, so the refusal never reports which addresses exist and hold no password yet; the public reset flow and an administrative temporary password both set the first one, an external identity signs the account in unchanged, and a self-service credential change is refused with PASSWORD_NOT_SET, which only a caller already authenticated as the account can reach.
  - The administration port answers the members of one workspace by address and by search term in the database. A lookup names at most 500 addresses, folded the way a stored address is folded and bound as one array parameter; a search pushes its term and a limit of 1 to 500 into SQL as a display-name prefix or an address prefix, and a byte-ordered expression index covers both, so a keystroke reads the rows the prefix matched rather than the workspace. The display name was matched anywhere until then; a containment is a range no btree answers, so a term inside a name no longer matches. A caller therefore never lists a workspace of unknown size to find the members it already named, and a LIKE wildcard in a term is matched as a character.
  - The audit query takes an optional inclusive from and to in epoch milliseconds, applied in SQL beside the action, the actor and the keyset cursor and answered by the same (tenant_id, occurred_at, id) index, so a reader of a date window states the window instead of seeding the cursor at its ceiling and watching for its floor. An absent end is open; a bound that is no epoch millisecond, and a window that ends before it starts, are refused with a stable code before the read.
  - listExternalIdentities answers one bounded page of the identity bindings a workspace's own providers assert, keyset ordered by provider and subject over the unique workspace index. A binding names the account, the provider key, the subject the provider keeps stable and when it was first recorded, and never a token, a secret, a ciphertext, a fingerprint or the address the provider reported. A binding a platform provider made carries no workspace and is not answered; the read is scoped to the workspace it is given, and the permission a reader needs is the calling module's to enforce at its own endpoint.
  - listTenantMembers keeps its unbounded roll for the callers that hold a workspace of known size and gains a paged form of 1 to 500 members, keyset ordered by account id and answering the cursor of the next page, so a caller may walk a workspace of unknown size without reading it in one statement. Migration 0030 indexes (tenant_id, account_id), which is the order that walk reads.
  - listTenantMembersSorted answers one page of 1 to 500 members of one workspace in the order a screen shows them, by display name folded to lower case or by the folded address, ascending or descending, keyset on that column and the account id, narrowed in SQL by a display-name or address prefix the way the search narrows and by membership status, and answers the keyset of its last member only when the page is full; a caller carries that keyset back to continue and the paged walk by account id stays for exports. Migration 0033 indexes (lower(display_name), id) and (email_normalized, id) on auth_accounts, where both sort columns live, because the account carries no workspace column and the workspace is bound through the membership join.
  - A workspace created after a module was enabled receives that module's permissions only through the seed lists in acl/scopes.ts, because auth sync-scopes reaches the workspaces that exist when it runs and no later one. A permission an enabled module declares and OWNER_SCOPES does not carry is therefore a defect, and a guard test compares the two against every enabled module specification of flowdular.json, checks what each permissions decision says members hold, and names the declarations still open so none is added silently.
  - auth.core erases one subject inside one workspace. The sessions and the API tokens that subject holds there are removed outright, live ones included, and the same subject's rows in another workspace are untouched. A call removes at most its batch and reports truncated when it filled one, so the caller comes back rather than believing the class complete. The authentication audit events declare no erase, because the audit specification excludes them as the evidence the data lifecycle happened; retention bounds them instead.
  - Every data class export walks one workspace by keyset over (tenant_id, id), and an index covers that pair on the sessions, the API tokens and the audit events, so a page is the rows it returns rather than a sort of the workspace.
  - Bundled module scopes are assigned from explicit owner and member defaults and migrated for existing tenant memberships.
  - The built-in owner role carries the enterprise module scopes directory.tokens.read, directory.tokens.manage, directory.provisioning.read, audit.registry.read, audit.retention.manage, approvals.requests.read, approvals.requests.decide, approvals.requests.manage, documents.files.read, documents.files.manage, metering.usage.read, import.jobs.read, import.jobs.manage, search.records.read, connectors.instances.read and connectors.instances.manage, and the built-in member role carries documents.files.read, documents.files.manage, search.records.read, connectors.instances.read, approvals.requests.read and approvals.requests.decide, because a member decides the requests their role makes them eligible for.
  - The built-in owner role carries reports.workspace.read, exports.lists.read, exports.lists.manage, access.review.read and access.review.manage, and the built-in member role carries none of them, because a workspace report composes spend, usage and volume across modules (D-REPORTS-AUDIENCE), an access review names every scope, token and provider of the workspace (D-OWNERS-ONLY), and the export decision states what starting an export and opening a file require of the live principal rather than granting a role anything (D-EXPORTS-PERMISSIONS). Migration 0029 grants the five to the owner memberships and the built-in owner role row of every workspace that already exists, and to no member membership and no member role row.
  - The built-in owner role carries research.evidence.read, research.run and research.settings.manage, and the built-in member role carries research.evidence.read and research.run, because a member reads the evidence a workspace keeps and searches within the workspace adapter and budget while the research settings stay with owners. Migration 0034 grants those defaults to the owner and member memberships and the built-in role rows of every workspace that already exists, lifting forced row-level security on the source and the target for the migrator.
  - The built-in owner role carries adapters.runs.read and adapters.runs.manage and the built-in member role carries neither, because a data adapter writes records of other modules and reaches other systems. Migration 0035 grants both to the owner memberships and the built-in owner role row of every workspace that already exists, lifting forced row-level security on the source and the target for the migrator.
  - The built-in owner role carries documents.templates.read and documents.templates.manage and the built-in member role carries documents.templates.read, because a member reads the workspace's document templates while editing and reverting them stays with owners. Migration 0036 grants those defaults to the owner and member memberships and the built-in role rows of every workspace that already exists, lifting forced row-level security on the source and the target for the migrator.
  - The built-in owner role and the built-in member role both carry agents.assistant.use, because the workspace assistant acts as the member who asked and never above them, and a member without the permission sees no entry point at all rather than a locked one. Migration 0037 grants it to the owner and member memberships and the built-in role rows of every workspace that already exists, lifting forced row-level security on the source and the target for the migrator.
  - A new workspace seeds the built-in owner role row and owner membership with decisions.definitions.read, decisions.definitions.manage, decisions.invocations.manage, decisions.invocations.read, decisions.connections.manage and decisions.connections.read. Its built-in member role row and member membership receive only decisions.definitions.read and decisions.invocations.read. No other role receives decisions.invocations.manage by default; a member using a custom role may invoke only after an explicit grant of that permission. decisions.core owns the authorization of its operations and the redaction of invocation history; an auth scope grant never exposes connection credentials or unredacted input and output.
  - Migration 0040 adds the decisions.core defaults to owner and member memberships and to their built-in role rows in every existing workspace, without duplicate grants, using the migration lease to lift forced row-level security on source and target only for the migration. It leaves custom role rows and memberships assigned to custom roles unchanged, including any explicit decisions grants they already hold; the grant operation is idempotent even though the migration ledger applies it only once.
  - auth.core declares the workspace data it keeps by age as data classes, when the platform hands it the registry. auth.core.sessions is kept for 30 days, auth.core.api-tokens and auth.core.audit-events for 400 days. Each is exportable and swept in bounded batches inside its own tenant transaction; a sweep removes only a session that already expired and a credential already revoked or expired, and no export carries a session token hash, a CSRF token or an API token hash. Memberships, membership scopes, roles, identity providers and module settings are configuration rather than swept classes.
  - An API token is a tenant-scoped machine credential bound to one membership. Only its hash is stored, the raw value is returned exactly once at creation, and it is never recoverable afterwards.
  - API token authority is the intersection of its recorded scopes with the live membership scopes at every request. Revoking a scope or disabling the membership takes effect immediately without touching the token.
  - An API token passes a module mutation only when it was issued with writes allowed; a token issued without them is refused before the handler runs. The same-origin and CSRF checks a browser session must pass are defences against a browser being made to act for its user, so a bearer credential is bound instead by its scopes, by that write permission and by the origins it may be presented from. Writes default to off, so a token issued before the permission existed stays read-only.
  - An API token may declare the browser origins it can be presented from. A token that declares none is refused from every browser origin and is usable only by a server-side caller, which sends no Origin header; a token that declares some is refused from every other origin. The cross-origin preflight carries no credential, so the deployment answers it from the union of the origins its live tokens declare, read on the routing handle, and never grants credentials on a cross-origin response.
  - Issuing, listing, and revoking API tokens require a browser session with the token management scope. A machine credential cannot mint or revoke another credential, and cannot pass any auth.core mutation, so credentials, sessions, memberships, roles and identity providers stay behind a browser session whatever a token was issued with.
  - A revoked or expired API token authenticates nothing, and token lifetime is bounded to one year.
  - An API token spends at most the requests per minute it was issued with, and a token issued with none spends the deployment default from the platform setting auth.core.apiTokenRateLimit, which an owner changes in Administration and which takes effect at the next request of the process that saved it and within the settings staleness bound in every other process. A ceiling of zero removes it. The request over the ceiling is answered 429 TOKEN_RATE_LIMITED with retry-after, and every answer to a limited token carries x-ratelimit-limit, x-ratelimit-remaining and x-ratelimit-reset, so a caller tracks its own budget without a second request.
  - The window is a fixed minute per token in each process, bounded to 4096 credentials with the oldest windows dropped first, so it is a guard against one integration running away rather than an accounting record. A deployment behind several processes admits up to the ceiling in each. Every request a token made, refused ones included, and the subset a ceiling refused are counted as auth.core module metrics, which is what an operator watches.
  - Sign-in attempts are throttled per submitted address and per trusted client address, and repeated failures lock the address for a fixed period with a stable error that never reveals whether an account exists.
  - Sign-up and sign-in errors never confirm that an email address is registered.
  - Every response carries the platform security headers; the content security policy is enforced in production and report-only in development.
  - A session ends at its absolute lifetime or after the configured idle period, whichever comes first; expired rows are swept periodically.
  - Every tenant carries the built-in owner and member roles as rows; custom roles are tenant-scoped, grant only grantable scopes, and cannot be edited, deleted, or shadowed when built in or in use.
  - Assigning a role replaces the membership scopes with the role's scopes and keeps the role key on the membership in sync.
  - Module settings are declared by their owning module, stored per tenant (or once for the platform), validated against the declaration on every write, and secret values are never returned.
  - Every committed module settings change appends exactly one audit event. A setting declared as a feature flag is recorded as settings.flag.changed, carrying the module, the key, the previous and next effective values and the actor; every other setting is recorded as settings.updated, carrying the module, the key, whether the value was cleared and the actor. No declared value of a non-flag setting and no secret value ever reaches the trail. The event of a tenant-scoped setting, every flag included, is written by the settings store inside the transaction that writes the value, so the value, its change log row and its event commit or fail together, and a failed audit write refuses the save with nothing stored. The previous value a flag event carries is the one that transaction read, never a process snapshot. No post-commit listener writes a settings audit event.
  - Every settings save or clear appends, in the transaction that writes the value, one row to the change log module_settings_changes holding the revision, the storage tenant (the platform storage tenant for a platform-scoped setting), the module, the key, whether the value was cleared, the database time of the change, the account that made it and the workspace it was made from. The log never holds a value, so no secret enters it. One revision sequence serves every tenant and the platform, and an append takes one transaction-scoped lock before it draws its revision, so revisions commit in the order they are drawn and a reader that has seen revision N never later finds a committed revision below N; a refused or rolled back write leaves at most a gap. Settings writes are rare, so serialising them costs nothing a workspace notices.
  - module_settings_changes is under forced row-level security with a USING and WITH CHECK policy on the transaction tenant, so a tenant request reads and appends its own rows only. The background role reads every tenant's rows through a FOR SELECT policy of its own and is granted only revision, tenant_id, module_id, key, cleared and changed_at, the way the other background discovery reads are narrowed; the account that made a change, the workspace it was made from and the audit mark stay unreadable on that connection, and it writes nothing.
  - The settings store answers the newest revision, and the changes after a cursor in pages of 1 to 500 ordered by revision, optionally narrowed to one module and key, each page with the cursor to continue from; each is one indexed read on the background role. A cursor is opaque to its holder and carries its revision and the database time its read began. A cursor older than the retention period less one day is answered expired with no rows, and its holder resynchronises by reading from the start of the log, which always holds the newest change of every setting, before it continues.
  - The change log keeps a row for 30 days and keeps the newest row of every tenant, module and key whatever its age, so pruning never hides the latest state of a setting from any reader and a reader that only needs that state is never broken by a sweep. auth.core sweeps the older rows in batches of at most 500 per tenant transaction, finding them through the background read. The migration that creates the log records one change for every value already stored, at its stored time and by its stored author, so a reader starting from the beginning sees every stored value. The log is not a declared data class, because it holds no setting value, its retention is the contract its readers rely on rather than a workspace choice, and its platform rows belong to no workspace.
  - Every process serves settings from its snapshot for at most 5 seconds without consulting the log. A prime that finds the process last revalidated more than 5 seconds ago reads the changes after the process cursor once, shared by concurrent primes, and reloads, each under its own tenant, only the tenant and module pairs those changes name that the process holds, keeping the old values readable until the reload lands; more than one page of changes, or an expired cursor, reloads everything the process holds. A revalidation that fails fails the prime, so no read is served past the bound. The guarantee is that a read after a prime begun at time p reflects every change committed before p minus 5 seconds, in every process; the process that saved a change reflects it when the save resolves; and a prime that names a revision its caller read from the log reflects at least that revision.
  - The kernel settings change listener stays local. It fires only in the process that saved the change, after the commit, and carries the change revision; a change another process made, including one a revalidation reloads, is never announced. A reader that needs every change reads the log, and no consequence that must survive a crash, such as an audit event or another module's durable state, may rest on a listener.
  - A platform-scoped setting is stored under the platform storage tenant while its audit event belongs to the workspace the change was made from, and one transaction is bound to one tenant. Its change row is therefore marked audit pending in the transaction that writes the value; the saving process writes the event into that workspace and clears the mark before the save resolves, and auth.core's periodic sweep writes the event for any row it finds still marked. The event carries the change revision under a unique index per workspace, so a retried write lands once, and a crash at any point delays the event by at most one sweep interval but never loses it.
  - Email confirmation cannot be enabled without a composed mail transport.
  - Password reset and tenant invitation tokens are random, hashed at rest, short lived, single use, and never returned by HTTP APIs.
  - Operator provisioning creates a workspace, its owner and the owner scopes exactly as sign-up does, works against the deployment database, and never reads the sign-up setting.
  - An operator command never returns a password the operator did not supply. It emits a single-use setup or invitation link once, and a supplied password is read from the environment rather than from a command flag.
  - Every operator provisioning command appends an audit row whose actor identifies the operator shell that ran it.
  - An audit row records its actor as one of the kernel kinds user, agent or service. An operator command and an identity provider are service actors, an account id is stored for a user only, an agent row names its run, and a service row stores the user who configured it, or null when that user is not stored, as an identity provider's is not.
  - TOTP secrets are encrypted with a deployment-provided AES-256 key; a successful password check creates a short-lived, single-use MFA challenge rather than a session.
  - The label an authenticator lists an enrolled account under is the deployment's own name, the branding system.core declares, resolved by the enrolment route and never taken from the request, so a caller cannot name the workspace a member sees and a deployment that renamed itself enrols under its new name. A deployment that stored no name enrols under the product name.
  - Every stored TOTP secret records the id of the key that sealed it, and a factor sealed before that id existed stays readable. Retired keys listed in FD_AUTH_MFA_KEY_PREVIOUS open stored factors and seal nothing, and the operator rotation re-seals the stale rows in bounded batches without clobbering a factor re-enrolled while it runs.
  - A workspace whose auth.core.requireMfa setting is on answers no workspace API and no module web page to a member without a confirmed second factor; a web page resolves no identity for that member and answers 401. Only the platform health and readiness probes, the public sign-in configuration, the account routes that complete enrolment, change the password, switch workspace, or sign out, the settings read, and the settings write whose body targets auth.core.requireMfa stay open; every other settings write is held like any other workspace API. The refusal is the stable MFA_ENROLMENT_REQUIRED problem, and the setting binds the workspace it is stored for and no other.
  - An API token is exempt from the enrolment requirement, because a service account cannot enrol and its authority is already the intersection of its recorded scopes with the live membership. Browser sessions stay gated.
  - The requireMfa setting cannot be turned on without a deployment MFA encryption key. The write is refused with MFA_KEY_REQUIRED, the way email confirmation is refused without a composed mail transport, so a workspace can never close itself with no way back.
  - Clearing another account's second factor requires the member management scope on a browser session, resolves the target inside the acting workspace, removes the factor together with every recovery code, and appends an audit row naming the actor and the target. An account of another workspace answers exactly as an unknown one.
  - An external sign-in is accepted only after the provider ID token is verified against the key set discovered under the configured issuer, covering the signature, the issuer, the audience, an expiry and issue time within five minutes, and the nonce bound to the signed state cookie. A provider without a configured issuer is refused at boot.
  - An external identity is the provider subject. It is stored on the account at the first sign-in and resolves the account afterwards; the reported address only bootstraps that first link, and an account already bound to another subject of the same provider is never re-bound.
  - A password must clear the configured minimum length, must not be one of the hundred most common passwords, and must not contain the local part of the account address.
  - External email delivery is an injected deployment adapter. The local in-memory adapter is development-only and never exposes tokens over HTTP or logs.
  - Every auth.core message is worded in the default locale of the workspace it concerns, read from that workspace's auth.core.defaultLocale setting when the message is sent, and declares that locale; a locale the module ships no bundle for is rendered as English and declares en.
  - The mail transport is chosen by deployment configuration, either none, the in-memory development adapter outside production, or an SMTP relay. A misconfigured transport refuses the boot by naming the variable, and the relay URL and its credentials never reach a response, a log line, or an audit row.
  - The mail relay is read at GET /api/auth/mail behind system.settings.read and tested at POST /api/auth/mail/test behind system.settings.manage, the platform settings permissions system.core declares, the way the workspace rename route is guarded. The test route takes no input, sends to the signed-in address alone, refuses an API token and a request without a CSRF token, is rate limited per owner, and appends one audit row naming the source, the transport and the outcome and nothing else.
  - The mail relay of an installation is five platform-scoped auth.core settings. A stored mailTransport of none or smtp decides every sender of the installation; while it is environment, which is the default, the deployment's FD_MAIL_* configuration decides exactly as it did before the settings existed, deprecation warnings included. The development adapter is reachable only that way and is never settable from the UI.
  - The effective mail configuration is resolved when a message is sent, not at boot, so a relay stored a minute ago carries the next message without a restart. The built transport is cached by a sha256 digest of the effective configuration, so an unchanged relay is opened once and a changed setting replaces it at the next message.
  - A mail setting that could not send is refused before it is stored. That covers a relay URL which does not parse as smtp:// or smtps:// with a host, a sender the platform sender rule rejects, and the smtp transport with no stored URL or no stored sender, whichever way the configuration would end up incomplete. Every refusal names the setting and carries none of its value.
  - Authentication and administration events are appended to an auth audit trail that is readable per tenant and never contains credentials or raw tokens.
  - Every request-time read and write runs on a tenant-scoped database handle, under forced row-level security bound to the transaction tenant.
  - A lookup that arrives with a key and no workspace, such as a session cookie, a bearer token, an invitation link or an email address, resolves the owning tenant on a read-only cross-tenant handle that is granted only the routing columns, and the work that follows runs under the tenant that lookup named.
  - An OIDC identity provider is either platform-scoped, read from FD_AUTH_OIDC_PROVIDERS at boot and available read-only to every workspace, or tenant-owned, stored in an auth table under forced row-level security and managed only by a principal holding auth.providers.manage in that workspace.
  - A tenant-owned provider's client secret is generated or entered once, sealed with the auth module keyring under a provider-specific context, rotatable through auth secrets-rotate, returned to nobody after creation, and represented to administrators by its fingerprint alone.
  - Sign-in is routed by the workspace the person is entering, so the sign-in screen resolves a workspace from the URL and offers that workspace's enabled providers beside the password form, and a separate single sign-on screen asks only for the workspace id and then offers only that workspace's enabled providers, with no email or password; a password sign-in needs no workspace, and the platform never discovers workspaces from an e-mail address.
  - An external identity is bound per workspace, provider and subject. A tenant-owned provider can sign an account into its own workspace only; it never grants access to another workspace, and an account already bound to another subject of the same provider in the same workspace is never re-bound.
  - Just-in-time provisioning is off by default and is enabled per provider together with a required list of allowed e-mail domains and the built-in or custom role a new member receives; without JIT, an external sign-in requires an existing membership, and with JIT a verified address outside the allowed domains is refused before any account or membership is written.
  - Just-in-time provisioning reuses an existing account only when that account holds no other membership; an address that already belongs to a member of another workspace is refused with a stable error and the workspace invites the person instead, so a tenant-owned provider can never absorb an account that other workspaces rely on.
  - Membership status is per workspace, so disabling a member in one workspace revokes that membership's sessions and API tokens and refuses its sign-in, leaves the person's other memberships untouched, and the global account status remains the deployment operator's platform-level block.
permissions:
  - id: auth.profile.read
    description: Read the current account profile.
  - id: auth.session.manage
    description: Create, inspect, and revoke the current account session.
  - id: auth.account.manage
    description: Manage account security settings.
  - id: auth.tenant.switch
    description: Switch the active session to another granted tenant membership.
  - id: auth.tokens.read
    description: Read API token metadata of the active tenant.
  - id: auth.tokens.manage
    description: Issue and revoke API tokens for the active tenant.
  - id: auth.roles.read
    description: Read the tenant role catalog and the grantable scopes.
  - id: auth.roles.manage
    description: Create, change, and delete custom tenant roles.
  - id: auth.audit.read
    description: Read the authentication and administration audit trail of the active tenant.
  - id: auth.providers.read
    description: Read the identity providers of the active workspace without their secrets.
  - id: auth.providers.manage
    description: Create, change, enable, disable, rotate and delete tenant-owned identity providers of the active workspace.
dataOwnership:
  - auth.core owns tenant-owned identity providers, their sealed client secrets, the per-workspace external identity bindings and the per-membership status; users.core renders the membership status control and calls the auth administration port.
  - Accounts, tenant memberships, scope grants, and hashed sessions are owned by auth.core.
  - API token identity, hashed secret, recorded scopes, expiry, revocation state, and last use are owned by auth.core.
  - Tenant roles, sign-in failure counters, module settings values, the module settings change log, and the auth audit trail are owned by auth.core. Another module reads the change log only through the kernel settings runtime, never the table.
  - auth.core owns default decisions.core scope grants on built-in roles and memberships; decisions.core declares its own permissions and owns decision definitions, connections and invocation records.
  - Other modules may reference account and tenant identifiers but may not write authentication tables.
entities:
  - id: identity-provider
    name: Identity provider
    description: A tenant-owned OIDC provider a workspace offers on its sign-in screen; platform providers from the environment are listed alongside, read-only.
    fields:
      - id: key
        type: string
        required: true
        unique: tenant
        maxLength: 64
        description: The stable identifier used in the sign-in URL for this workspace; lower-case letters, digits and hyphens.
      - id: label
        type: string
        required: true
        maxLength: 120
      - id: issuer
        type: string
        required: true
        maxLength: 2048
        description: The https issuer whose discovery document names it back; verified as today.
      - id: clientId
        type: string
        required: true
        maxLength: 256
      - id: secretFingerprint
        type: string
        required: true
        maxLength: 32
        description: Truncated SHA-256 of the sealed client secret; the secret itself is never readable.
      - id: scopes
        type: json
        required: true
        description: Array of OIDC scopes requested at authorization; openid and email are always included.
      - id: jitEnabled
        type: boolean
        required: true
      - id: allowedDomains
        type: json
        required: true
        description: Array of lower-case e-mail domains; required non-empty when jitEnabled is true.
      - id: jitRole
        type: string
        required: true
        maxLength: 64
        description: The role key a provisioned member receives; must be a role of the workspace.
      - id: status
        type: enum
        required: true
        values:
          - active
          - disabled
    states:
      field: status
      values:
        - active
        - disabled
      transitions:
        - from: active
          to: disabled
          permission: auth.providers.manage
        - from: disabled
          to: active
          permission: auth.providers.manage
  - id: external-identity
    name: External identity binding
    description: The provider subject bound to an account inside one workspace; platform providers bind without a workspace, as today.
    fields:
      - id: provider
        type: string
        required: true
        maxLength: 64
      - id: subject
        type: string
        required: true
        maxLength: 256
      - id: accountId
        type: string
        required: true
        maxLength: 128
  - id: membership
    name: Membership
    description: The existing account membership of a workspace, extended with its own status.
    fields:
      - id: accountId
        type: string
        required: true
        maxLength: 128
      - id: role
        type: string
        required: true
        maxLength: 64
      - id: status
        type: enum
        required: true
        values:
          - active
          - disabled
    states:
      field: status
      values:
        - active
        - disabled
      transitions:
        - from: active
          to: disabled
          permission: users.members.manage
        - from: disabled
          to: active
          permission: users.members.manage
screens:
  - id: identity-providers
    kind: list
    entity: identity-provider
    title: Identity providers
    columns:
      - key
      - label
      - issuer
      - status
      - jitEnabled
      - secretFingerprint
    filters:
      - status
    navigationGroup: Administration
  - id: identity-provider
    kind: record
    entity: identity-provider
    title: Identity provider
    columns:
      - key
      - label
      - issuer
      - clientId
      - scopes
      - jitEnabled
      - allowedDomains
      - jitRole
      - status
      - secretFingerprint
    navigationGroup: Administration
actions:
  - id: create-provider
    entity: identity-provider
    permission: auth.providers.manage
    kind: create
    risk: workspace-write
    idempotent: false
    description: Create an active tenant-owned provider; the client secret is accepted once in the request, sealed, and only its fingerprint is returned.
  - id: update-provider
    entity: identity-provider
    permission: auth.providers.manage
    kind: update
    risk: workspace-write
    idempotent: true
    description: Change label, issuer, client id, scopes, JIT settings or role; a changed issuer is re-verified through discovery.
  - id: rotate-provider-secret
    entity: identity-provider
    permission: auth.providers.manage
    kind: custom
    risk: workspace-write
    idempotent: false
    description: Accept a new client secret once, seal it and update the fingerprint.
  - id: disable-provider
    entity: identity-provider
    permission: auth.providers.manage
    kind: custom
    risk: workspace-write
    idempotent: true
    description: Stop offering the provider on the sign-in screen; existing sessions stay valid.
  - id: enable-provider
    entity: identity-provider
    permission: auth.providers.manage
    kind: custom
    risk: workspace-write
    idempotent: true
    description: Offer the provider again.
  - id: delete-provider
    entity: identity-provider
    permission: auth.providers.manage
    kind: delete
    risk: destructive
    idempotent: true
    description: Delete a disabled provider and its bindings in this workspace; members keep their accounts and can sign in by password or another provider.
widgets: []
settings:
  - key: mailTransport
    type: enum
    scope: platform
    default: environment
    values:
      - environment
      - none
      - smtp
    description: The relay this installation sends through. environment keeps the deployment FD_MAIL_* configuration and is the only way to reach the in-memory development adapter.
  - key: mailSmtpUrl
    type: string
    scope: platform
    default: ''
    description: smtp:// or smtps:// relay URL with percent-encoded credentials, at most 512 characters. Secret; written only and never read back, logged or audited with its value.
  - key: mailFrom
    type: string
    scope: platform
    default: ''
    description: Sender every message carries, as an address or Name <address>, at most 448 characters and checked by the platform sender rule.
  - key: mailRequireTls
    type: boolean
    scope: platform
    default: true
    description: Refuse a cleartext smtp:// session the relay does not upgrade with STARTTLS; ignored by smtps://.
  - key: mailRejectUnauthorized
    type: boolean
    scope: platform
    default: true
    description: Refuse a relay certificate that does not verify.
  - key: apiTokenRateLimit
    type: integer
    scope: platform
    default: 600
    description: Requests per minute an API token may spend when it names no rate of its own. 0 removes the ceiling.
agentTools: []
outOfScope:
  - SCIM 2.0 users and groups provisioning is a separate module, directory.core, specified after this delivery lands, because per-membership status has to exist first.
  - SAML and LDAP are not offered; a provider is OIDC with discovery.
  - Discovering a workspace from an e-mail address is not offered; the person names the workspace first.
  - E-mailing a provisioned member is deferred to the notifications delivery path once auth mail kinds are extended.
  - Wording a message in a workspace's own custom phrasing is deferred; every auth.core message is rendered from the shipped locale bundles, so a workspace picks a language and never its own text.
decisions:
  - id: D-G2-SCOPE
    question: What does this G2 delivery contain?
    answer: Tenant-owned providers, just-in-time provisioning and per-membership status in auth.core; SCIM as a later directory.core specification.
    decidedBy: user
  - id: D-G2-ROUTING
    question: How is a sign-in routed to a workspace when providers are tenant-owned?
    answer: Workspace first, then the providers of that workspace plus the password form; no discovery by e-mail address.
    decidedBy: user
  - id: D-G2-ACCOUNTS
    question: One global account or identities per workspace?
    answer: One global account with external identities bound per workspace, provider and subject; a tenant provider signs into its own workspace only.
    decidedBy: user
  - id: D-G2-JIT
    question: What are the JIT defaults?
    answer: Off by default; enabled per provider with a required allowed-domain list and the role for new members, member by default.
    decidedBy: user
  - id: D-G2-MEMBERSHIP-STATUS
    question: Is member status global or per workspace?
    answer: Per membership; the global account status stays as the deployment operator's block.
    decidedBy: user
  - id: D-G2-ENV-PROVIDERS
    question: What happens to FD_AUTH_OIDC_PROVIDERS?
    answer: Kept as platform-scoped providers available read-only to every workspace; tenants add their own.
    decidedBy: user
  - id: D-G2-JIT-REUSE
    question: May JIT attach an existing account that already belongs to other workspaces?
    answer: No. JIT reuses only an account with no other membership; otherwise the sign-in is refused and the workspace invites the person, because a tenant provider must not absorb an account other workspaces rely on.
    decidedBy: default
  - id: D-G2-SECRET-KEY
    question: Which key seals tenant provider client secrets?
    answer: The auth module keyring already used for TOTP secrets, under a provider-specific context, so auth secrets-rotate covers both and no new deployment key is introduced.
    decidedBy: default
  - id: D-G2-PERMISSIONS
    question: Who manages tenant providers and membership status?
    answer: Owners hold auth.providers.read and auth.providers.manage; members hold neither. Membership status changes are users.core actions behind users.members.manage, served by the auth administration port.
    decidedBy: default
  - id: D-G2-SCREENS
    question: Which screens exist?
    answer: An identity providers list and record drawer under Administration in auth.core; the membership status toggle lives in the users.core member drawer.
    decidedBy: default
  - id: D-G2-PROVIDER-KEY
    question: What identifies a provider in the sign-in URL?
    answer: A tenant-unique key; the callback path carries the workspace and the key, and the signed state cookie binds both.
    decidedBy: default
  - id: D-DECISIONS-ACTORS
    question: Which decisions.core permissions do owners and members receive by default?
    answer: Owners receive all six decisions.core permissions. Members receive decisions.definitions.read and decisions.invocations.read for definitions and redacted invocation history; they receive no management, connection or invocation permission by default. Any other role may invoke only through an explicit decisions.invocations.manage grant.
    decidedBy: user
  - id: D-DECISIONS-MIGRATION
    question: How are decisions.core defaults applied to workspaces that already exist?
    answer: Auth migration 0040 adds the same defaults to existing owner and member memberships and their built-in role rows with an idempotent grant operation, preserves existing explicit grants without duplicates, and does not change custom roles or memberships assigned to them.
    decidedBy: default
  - id: D-SETTINGS-AUDIT-ATOMIC
    question: When is a settings audit event written, and what happens when that write fails?
    answer: Inside the transaction that writes the value, for every tenant-scoped setting and every flag; a failed audit write refuses the save with nothing stored. This replaces the post-commit listener and the earlier rule that a failed audit write left the setting committed. Proposed from the 2026-10-05 direction; the owner confirms it at approval.
    decidedBy: default
  - id: D-SETTINGS-PLATFORM-AUDIT
    question: How is a platform-scoped setting audited, when its value lives under the platform storage tenant and its event in the workspace the change came from?
    answer: The change row is marked audit pending in the value's transaction, the saving process writes the workspace event and clears the mark, and the periodic sweep completes any row still marked; a unique index on the revision per workspace makes the event land once.
    decidedBy: default
  - id: D-SETTINGS-LOG-RETENTION
    question: How long is the settings change log kept, and how is it pruned?
    answer: 30 days, except the newest row of every tenant, module and key, which is kept whatever its age; swept in batches of at most 500 per tenant transaction.
    decidedBy: default
  - id: D-SETTINGS-LOG-CURSOR
    question: How does a reader learn that its cursor predates the retained log?
    answer: The cursor is opaque and carries its revision and the database time its read began; one older than the retention period less one day is answered expired, and the reader resynchronises from the start of the log. Pages hold 1 to 500 changes.
    decidedBy: default
  - id: D-SETTINGS-COMMIT-ORDER
    question: How is a cursor reader kept from skipping a revision that commits after a higher one?
    answer: Every append takes one transaction-scoped lock before drawing its revision, so revisions commit in the order they are drawn.
    decidedBy: default
  - id: D-SETTINGS-REVALIDATE
    question: How stale may a process snapshot be, and what happens when revalidation fails?
    answer: At most 5 seconds; a prime past that reads the changes after the process cursor once and reloads only the pairs they name, and a failed revalidation fails the prime instead of serving past the bound.
    decidedBy: default
  - id: D-SETTINGS-LISTENER
    question: Does the kernel settings change listener also announce changes another process made?
    answer: No. It stays local to the saving process, fires after the commit and carries the revision; remote changes are read from the log, so no listener can record a change twice.
    decidedBy: default
  - id: D-SETTINGS-LOG-NOT-DATA-CLASS
    question: Is the settings change log a declared data class?
    answer: No. It holds no setting value, its retention is the readers' contract rather than a workspace choice, and its platform rows belong to no workspace; module settings stay configuration as before.
    decidedBy: default
  - id: D-SETTINGS-LOG-BACKFILL
    question: Does the log start empty?
    answer: No. Its migration records one change per value already stored, at its stored time and by its stored author, so a reader starting from the beginning sees every stored value.
    decidedBy: default
acceptanceScenarios:
  - id: AUTH-MAIL-TEST-MESSAGE
    given: An installation whose effective mail transport is an SMTP relay, and an owner signed in with the settings management permission.
    when: The owner presses the test message button on the auth settings screen, and presses it repeatedly past the rate limit; a member without the permission, a request without a CSRF token and an API token call the same route.
    then: One message goes to the owner's own address through the effective transport and the screen states sent or the transport's own refusal, a further press is refused with RATE_LIMITED, the member is refused 403, the missing CSRF token 403 and the API token 403, and the audit row names the source, the transport and the outcome without the relay address, its credentials or the recipient.
  - id: AUTH-MAIL-SETTINGS-PRECEDENCE
    given: A deployment whose FD_MAIL_* variables name an SMTP relay.
    when: An owner stores mailTransport none, then smtp with a relay URL and a sender, then changes the relay URL, then clears the stored transport back to environment.
    then: The stored transport decides each time and none turns mail off for every sender, the changed URL is used by the next message without a restart while an unchanged one reuses the transport already opened, and clearing the transport puts the deployment's environment configuration back in effect.
  - id: AUTH-MAIL-SETTINGS-REFUSED
    given: An installation with no stored mail configuration.
    when: An owner stores mailTransport smtp before a relay URL or a sender, stores a relay URL that is neither smtp:// nor smtps://, stores a sender that is not an address, and clears the relay URL of a live smtp transport.
    then: Every write is refused with a message naming the setting and carrying none of its value, nothing is stored, and the next invitation still goes through whatever was in effect before.
  - id: AUTH-MEMBER-NO-PASSWORD
    given: An owner of a workspace creating a member through the administration port without a credential.
    when: Someone tries to sign that member in with a password, the member completes the public reset flow, and the member tries to change their own password before it is set.
    then: The sign-in is refused with the same code and the same work an unregistered address is refused with, the reset link sets the first password and signs the member in, the self-service change answers PASSWORD_NOT_SET, and the audit trail names the acting owner, the address, the role and that no credential was stored.
  - id: AUTH-MEMBER-LOOKUP
    given: Two workspaces each holding members, and a caller that names addresses rather than listing a workspace.
    when: The caller looks members up by address, by a search term, with an address in another workspace, past the bound of 500 addresses, and with a LIKE wildcard or a quoting character in the input.
    then: Only members of the named workspace are answered, the folded address matches whatever the caller typed, the search answers at most the limit it was given, over the bound is refused with INVALID_INPUT, and a wildcard or a quote is matched as a character rather than changing the statement.
  - id: AUTH-SCOPE-COVERAGE
    given: The enabled modules of flowdular.json and their specifications.
    when: The declared permissions are compared with the owner and member seed lists of acl/scopes.ts.
    then: Every declared permission an enabled module carries is in OWNER_SCOPES or is named in the open list the guard keeps, every permissions decision that says members hold a permission is held by MEMBER_SCOPES, and every one that says they hold none is absent from it.
  - id: AUTH-AUDIT-HOLDS-SCOPE
    given: A workspace created before audit.core declared audit.holds.manage, with an owner, a member and a role the workspace wrote itself.
    when: The migration ledger is applied.
    then: The owner membership and the built-in owner role row carry the permission without a duplicate of the ones they held, the member and the workspace's own role are untouched, and a membership of the same account in another workspace receives nothing.
  - id: AUTH-WORKFLOW-AUTOMATION-PROFILE-SCOPES
    given: A workspace created before the eleven permissions of workflows.core, automations.core and profile.core became owner defaults, with an owner, a member and a role the workspace wrote itself.
    when: The migration ledger is applied.
    then: The owner membership and the built-in owner role row carry all eleven without a duplicate of the ones they held, the member membership and the built-in member role row carry profile.self.manage and none of the other ten, the workspace's own role is untouched, and a member membership of the same account in another workspace receives profile.self.manage alone.
  - id: AUTH-RESEARCH-SCOPES
    given: A workspace created before research.core declared its three permissions, with an owner holding one of them, a member and a role the workspace wrote itself.
    when: The migration ledger is applied.
    then: The owner membership and the built-in owner role row carry research.evidence.read, research.run and research.settings.manage without a duplicate of the one held, the member membership and the built-in member role row carry research.evidence.read and research.run and not the settings permission, and the workspace's own role is untouched.
  - id: AUTH-ADAPTERS-SCOPES
    given: A workspace created before adapters.core declared its two permissions, with an owner holding one of them, a member and a role the workspace wrote itself.
    when: The migration ledger is applied.
    then: The owner membership and the built-in owner role row carry adapters.runs.read and adapters.runs.manage without a duplicate of the one held, the member membership and the built-in member role row carry neither, and the workspace's own role is untouched.
  - id: AUTH-DOCUMENTS-TEMPLATES-SCOPES
    given: A workspace created before documents.core declared its two template permissions, with an owner holding one of them, a member and a role the workspace wrote itself.
    when: The migration ledger is applied.
    then: The owner membership and the built-in owner role row carry documents.templates.read and documents.templates.manage without a duplicate of the one held, the member membership and the built-in member role row carry documents.templates.read and not the manage permission, and the workspace's own role is untouched.
  - id: AUTH-ASSISTANT-SCOPES
    given: A workspace created before agents.core declared agents.assistant.use, with an owner, a member and a role the workspace wrote itself.
    when: The migration ledger is applied.
    then: The owner membership, the member membership and both built-in role rows carry agents.assistant.use without a duplicate of one already held, and the workspace's own role is untouched.
  - id: AUTH-DECISIONS-NEW-WORKSPACE-SCOPES
    given: A new workspace is created through sign-up or operator provisioning with decisions.core composed, and it gains a built-in owner and a built-in member.
    when: Their role rows and membership scopes are seeded.
    then: The owner role and membership carry decisions.definitions.read, decisions.definitions.manage, decisions.invocations.manage, decisions.invocations.read, decisions.connections.manage and decisions.connections.read; the member role and membership carry only decisions.definitions.read and decisions.invocations.read from decisions.core, and no custom role gains a decisions scope by default.
  - id: AUTH-DECISIONS-EXISTING-WORKSPACE-SCOPES
    given: Two existing workspaces each have an owner and a member, one owner already holds decisions.definitions.read, one member already holds decisions.invocations.read, and a custom role and its membership hold an explicit scope set.
    when: Migration 0040 applies through the ledger, and its grant operation is exercised a second time in an isolated idempotency test.
    then: Each workspace's built-in owner role and owner membership carry all six decisions.core permissions once, each built-in member role and member membership carry only decisions.definitions.read and decisions.invocations.read from decisions.core once, and the custom role and its membership retain their exact prior scope set without a cross-workspace grant.
  - id: AUTH-DECISIONS-EXPLICIT-INVOCATION-GRANT
    given: A built-in member has the decisions.core read defaults, and a custom role has been granted decisions.invocations.manage explicitly.
    when: Their live memberships and API token scope intersections are resolved for a decisions.core invocation.
    then: The built-in member and any token issued without the invocation permission lack it, while the membership assigned to the custom role holds it only if the role's explicit grant is present; neither default read scope grants connection access or an unredacted invocation payload.
  - id: AUTH-ERASE-SUBJECT
    given: Two workspaces holding sessions and API tokens of the same subject, and a second subject in the first workspace.
    when: The erasure of the first subject runs in the first workspace, once with a batch smaller than the rows it holds and again until it is done.
    then: Only that subject's sessions and tokens in that workspace are removed, live ones included, the other subject and the other workspace keep theirs, a filled batch is reported truncated and the next call finishes, and the authentication audit events report no erase operation at all.
  - id: AUTH-DATA-CLASSES
    given: A workspace holding a session that expired long ago, a revoked API token, audit rows older than the retention period, a live session, a usable token and recent audit rows, beside a second workspace holding the same.
    when: The platform sweeps and exports the auth.core data classes for the first workspace.
    then: Only the expired session, the retired token and the audit rows older than the cutoff are removed, never more than the batch limit and never a row of the second workspace, and the export carries the remaining rows of the first workspace with no session token hash, CSRF token or API token hash.
  - id: AUTH-TOKEN-ISSUE
    given: An owner with auth.tokens.manage and an active browser session.
    when: The owner issues an API token with a label, a scope subset, and an optional expiry.
    then: The raw token is returned once, only its hash and safe metadata are persisted, and the recorded scopes are the intersection with the membership scopes.
  - id: AUTH-TOKEN-AUTHENTICATE
    given: A live API token and a read endpoint that requires one of its scopes.
    when: A client sends the token as a bearer credential without a session cookie.
    then: The request is authorized as that membership with the token scopes, and the token's last use is recorded.
  - id: AUTH-TOKEN-MUTATION-DENY
    given: A live API token and an endpoint protected by the session mutation guard.
    when: The client attempts the mutation with the token.
    then: The server denies the request with a stable token error before the handler runs.
  - id: AUTH-TOKEN-REVOKE
    given: An issued API token.
    when: An owner revokes it, or its expiry passes, or its membership loses the scope.
    then: The next request carrying that token is unauthenticated, and no further lookup grants authority.
  - id: AUTH-SIGNUP
    given: A visitor provides a valid unique email, organization, display name, and password.
    when: The visitor submits the sign-up form from the same origin.
    then: An account, tenant membership, scoped session, and protected cookie are created atomically.
  - id: AUTH-SIGNIN
    given: An active account exists with a stored password hash.
    when: Correct credentials are submitted from the same origin.
    then: A new rotated session is returned without exposing its token to JavaScript.
  - id: AUTH-DENY
    given: A request has no valid session or lacks a required scope.
    when: It reaches a protected middleware boundary.
    then: The server returns 401 or 403 and does not invoke the protected handler.
  - id: AUTH-SIGNOUT
    given: An authenticated session and matching CSRF token exist.
    when: The user signs out from the same origin.
    then: The server revokes the session and expires the browser cookie.
  - id: AUTH-GREENFIELD
    given: A developer requests a fresh local authentication database while the application is stopped.
    when: The developer supplies both apply authorization and the exact reset-local-auth confirmation token.
    then: Only the workspace-local auth database is reset; documented admin and user accounts plus two isolated tenants are seeded.
  - id: AUTH-TENANT-SWITCH
    given: An authenticated account has memberships in more than one tenant.
    when: The account selects another granted tenant with its current CSRF token.
    then: The old session is revoked and a rotated session is bound to the selected tenant and its scopes.
  - id: AUTH-SIGNUP-DISABLED
    given: The auth.allowSignUp module setting is false.
    when: A visitor opens or submits sign-up.
    then: The client routes to sign-in and the server rejects account creation without writing authentication data.
  - id: AUTH-AGENT-SCOPES
    given: The bundled agents.core module is enabled.
    when: Default owner and member scope grants are created or migrated.
    then: Owners can manage and execute agents while members receive only the explicitly declared read and execute scopes.
  - id: AUTH-LOCKOUT
    given: Five failed sign-in attempts for one address within the window.
    when: The next sign-in for that address arrives, correct or not.
    then: The server returns the stable ACCOUNT_LOCKED error until the lock period passes, and the audit trail records the lock for a known account.
  - id: AUTH-SECURITY-HEADERS
    given: Any request served by the platform.
    when: The response is produced.
    then: It carries nosniff, frame denial, referrer, and permissions policies, HSTS when secure cookies are on, and a content security policy.
  - id: AUTH-ROLE-CUSTOM
    given: An owner with auth.roles.manage.
    when: The owner creates a role with a subset of grantable scopes and assigns it to a member.
    then: The role is listed for the tenant only, the member's scopes equal the role's scopes, and deleting the role is refused while a member holds it.
  - id: AUTH-ROLE-BUILTIN
    given: The built-in owner or member role.
    when: Anyone tries to rename, rescope, delete, or recreate it.
    then: The server refuses with a stable error and the role is unchanged.
  - id: AUTH-SETTINGS-STORE
    given: A module setting is written through the shared settings runtime by an identified actor.
    when: The value passes the declared validation and the write commits.
    then: The value is persisted in auth.db per tenant (or once for the platform), the next read returns it, and in the same transaction one change log row records the revision, the module, the key, whether the value was cleared, the time and the actor without the value, and a settings.updated audit event records the actor, the setting, and whether the value was cleared.
  - id: AUTH-SETTINGS-FLAG-AUDIT
    given: A setting declared with kind flag is turned on or reset through the shared settings runtime by an identified actor.
    when: The write commits, and in a second attempt the audit write fails.
    then: One settings.flag.changed audit event is appended for the actor's workspace in the transaction of the write, with the module, the key, the previous effective value that transaction read, the next effective value and the actor, and no settings.updated event is written for that change; when the audit write fails the save is refused and neither the value nor a change log row is stored.
  - id: AUTH-SETTINGS-CRASH-AFTER-COMMIT
    given: A process saves a tenant-scoped setting and a flag through the shared settings runtime.
    when: The process is killed right after each commit, before the save resolves and before any listener runs.
    then: Each value, its change log row and its audit event are all present, exactly one of each, and a second process reading the log after the revision it held sees both changes.
  - id: AUTH-SETTINGS-PLATFORM-AUDIT
    given: An owner of workspace A saves a platform-scoped setting.
    when: The saving process dies after the commit and before the workspace event is written, and the periodic sweep then runs twice.
    then: Workspace A's trail holds exactly one settings.updated event carrying that revision, the change row is no longer marked audit pending, and no other workspace receives an event.
  - id: AUTH-SETTINGS-REVALIDATE
    given: Two processes share one settings store and have both primed a workspace and the platform.
    when: Process A saves a tenant-scoped value and a platform-scoped value, and process B keeps priming and reading.
    then: A reads both at once; B serves the old values no later than 5 seconds after the commit and the new ones at its first prime after that, reloading only the changed tenant and module pairs; a prime in B naming the revision A's change received reflects it at once; and when B's revalidation read fails, B's prime fails rather than serving the old value past the bound.
  - id: AUTH-SETTINGS-LOG-BACKGROUND
    given: Changes of a secret setting and of an ordinary setting in two workspaces and on the platform.
    when: The background connection reads the change log.
    then: It sees the revision, workspace id, module, key, cleared flag and change time of every row; reading the account that made a change, the workspace it was made from or the audit mark is refused; no value of either setting exists in the log; and an insert, update or delete is refused.
  - id: AUTH-SETTINGS-LOG-TENANT
    given: Two workspaces each holding settings changes.
    when: A request of workspace A reads the change log, and appends a row naming workspace B.
    then: A sees only its own rows, the append naming B is refused by the WITH CHECK policy, and B's rows are unchanged.
  - id: AUTH-SETTINGS-LOG-RETENTION
    given: Change rows older than 30 days, including the only row of one key and superseded rows of another, beside recent rows, in two workspaces and on the platform.
    when: The sweep runs with a batch smaller than the old rows and again until it is done, then a reader presents a cursor older than 29 days and then reads from the start.
    then: Only superseded rows older than 30 days are removed, at most one batch per tenant transaction; the newest row of every key stays whatever its age; recent rows stay; the old cursor is answered expired with no rows; and the read from the start returns the newest change of every key.
  - id: AUTH-SETTINGS-COMMIT-ORDER
    given: Two saves of different workspaces whose transactions overlap.
    when: A reader pages the change log while they commit.
    then: The reader never sees the later revision before the earlier one has committed, and a cursor taken between the two commits returns the second change on its next read.
  - id: AUTH-SETTINGS-LISTENER-LOCAL
    given: A settings change listener registered in two processes that share one store.
    when: Process A saves a value and process B later revalidates.
    then: Only A's listener fires, once, carrying the revision; B reloads the value without calling its listener; and the audit trail holds exactly one event for the change.
  - id: AUTH-WORKSPACE-SETTINGS
    given: An owner with system.settings.manage on Administration > Settings.
    when: The owner renames the workspace or picks a default locale.
    then: The tenant name is updated and reflected in the session, the defaultLocale tenant setting is stored through the platform settings API, and the session payload serves it as tenantSettings.defaultLocale.
  - id: AUTH-AUDIT-READ
    given: A principal with auth.audit.read.
    when: The principal pages through the audit trail with action and actor filters.
    then: Only the active tenant's events are returned, newest first, with a cursor for the next page.
  - id: AUTH-AUDIT-SOURCES
    given: A principal who opens the unified audit screen holding a subset of auth.audit.read, agents.runs.read, and sandbox.sessions.read.
    when: The screen offers audit sources.
    then: Only the sources whose scope the principal holds are selectable, and the agent and sandbox sources show a chain-integrity indicator driven by their verify endpoint.
  - id: AUTH-SESSIONS-OWN
    given: An account with several live sessions.
    when: The account lists its sessions and revokes one that is not current.
    then: The revoked session no longer resolves and the current one is unchanged.
  - id: AUTH-PASSWORD-RECOVERY
    given: A visitor has access to the email address of an active account.
    when: The visitor requests a reset and submits the delivered, unexpired, single-use token with a policy-compliant password.
    then: The password changes, earlier sessions are revoked, the token cannot be reused, and the request response never reveals whether the address exists.
  - id: AUTH-INVITATION-ACCEPT
    given: A workspace administrator delivered a tenant invitation through the configured mail adapter.
    when: The invited person submits the unexpired, single-use token with account details.
    then: The account gains only the invited workspace role, the token cannot be reused, and no token appears in logs or audit metadata.
  - id: AUTH-MAIL-SMTP
    given: A deployment selects the smtp mail transport with a relay URL and a sender address.
    when: The server boots and an invitation or a password reset is requested.
    then: The message is relayed over that transport with a subject and the single-use link, a missing or malformed variable refuses the boot by naming it, and a delivery failure reports a stable error carrying neither the SMTP exchange nor the relay credentials.
  - id: AUTH-MFA-ENROLL
    given: An authenticated account and a configured MFA encryption key.
    when: The account enrolls a TOTP authenticator and confirms a valid rotating code.
    then: The secret stays encrypted at rest, the authenticator lists the account under the deployment's own name rather than one the request named, recovery codes are returned only during enrollment, and future sign-in requires a TOTP or unused recovery code.
  - id: AUTH-MFA-REQUIRED
    given: A workspace whose auth.core.requireMfa setting is on and a member of it without a confirmed second factor.
    when: The member calls a workspace API, then the routes that complete enrolment, and finally the same workspace API after confirming a factor.
    then: The workspace API answers 403 MFA_ENROLMENT_REQUIRED, the enrolment routes answer normally and report that enrolment is required, the same member in a workspace that does not require it is unaffected, and the workspace API answers again once the factor is confirmed.
  - id: AUTH-MFA-ADMIN-RESET
    given: An administrator with the member management scope and a member of the same workspace with an enrolled factor and recovery codes.
    when: The administrator confirms the reset from the member drawer.
    then: The factor and every recovery code are removed, an auth.mfa.reset audit row names the actor and the target, the member can enrol again, and the same call from a member without the scope, without a session, without a CSRF proof, for the acting account itself, or for an account of another workspace is refused without revealing that the account exists.
  - id: AUTH-MFA-KEY-ROTATE
    given: Enrolled TOTP factors sealed with the current MFA encryption key, including rows written before the sealing key id was recorded.
    when: The deployment boots with a new key in FD_AUTH_MFA_KEY and the old one in FD_AUTH_MFA_KEY_PREVIOUS, and an operator runs auth secrets-rotate without apply and then with it.
    then: Sign-in challenges keep verifying throughout, the dry run counts the rows per key id and writes nothing, apply re-seals every stale row under the current key, a second run changes nothing, a key in neither slot is refused on the stable MFA_CONFIGURATION_INVALID error, and no output carries key material or an enrolled secret.
  - id: AUTH-OIDC-VERIFY
    given: An enabled OIDC provider with a configured issuer.
    when: The provider returns an authorization code and the callback exchanges it.
    then: The ID token is verified against the discovered key set for signature, issuer, audience, freshness and the nonce of this transaction, a failure of any of them ends the flow on the stable external sign-in error, and a provider configured without an issuer is refused at boot.
  - id: AUTH-OIDC-SUBJECT
    given: An account that has signed in once through an OIDC provider.
    when: The provider reports another address for the same subject, or another subject for the same address.
    then: The stored subject resolves the account in the first case, and the second case is refused on the external sign-in error without binding a second identity.
  - id: AUTH-PASSWORD-DENYLIST
    given: Any credential path that sets a password.
    when: The submitted password is one of the hundred most common passwords, or contains the local part of the account address.
    then: The password is refused with PASSWORD_TOO_COMMON or PASSWORD_CONTAINS_EMAIL, the minimum length keeps its own code, and an unrelated password of sufficient length is accepted.
  - id: AUTH-MFA-OIDC
    given: An account with confirmed TOTP signs in through an enabled, configured OIDC provider.
    when: The provider returns a verified email for that account.
    then: Flowdular redirects to the MFA challenge using a short-lived HttpOnly proof cookie and creates no session before the second factor succeeds.
  - id: AUTH-SECURITY-SURFACES
    given: A browser opens account recovery, invitation acceptance, or personal security from a supported route.
    when: The corresponding operation is unavailable, loading, denied, invalid, successful, or pending confirmation.
    then: The screen renders a translated explicit state and never exposes a stored credential or reusable token.
  - id: AUTH-OPERATOR-WORKSPACE
    given: A deployment with public sign-up disabled and no workspace yet.
    when: An operator runs the workspace creation command with a workspace name, an owner address and a display name, and authorizes it with apply.
    then: The workspace, the owner account, the owner membership and the owner scopes are created exactly as a sign-up creates them, an audit row names the operator, and the owner's first credential is returned once as a single-use setup link unless the operator supplied a password through the environment.
  - id: AUTH-OPERATOR-MEMBER
    given: An existing workspace in a deployment with public sign-up disabled.
    when: An operator adds an email address to that workspace with a role.
    then: A known account joins immediately with that role's scopes, an unknown address receives a single-use invitation link that is shown once, and either outcome is appended to the workspace audit trail with the operator as the actor.
  - id: AUTH-PROVIDER-TENANT-CRUD
    given: A principal holding auth.providers.manage supplies a unique key, a label, an https issuer that discovers itself, a client id and a client secret.
    when: The provider is created, updated, disabled, enabled, rotated and deleted after disabling.
    then: Each accepted transition is persisted under the workspace's forced policy, the secret is never readable after creation and only its fingerprint changes on rotation, deleting an active provider is refused, and a member without the permission is refused before repository access.
  - id: AUTH-PLATFORM-PROVIDERS
    given: A deployment configures FD_AUTH_OIDC_PROVIDERS.
    when: Any workspace's providers are listed or its sign-in screen is rendered.
    then: The platform providers appear read-only next to the workspace's own, cannot be changed through the workspace API, and keep binding identities without a workspace as before.
  - id: AUTH-SIGNIN-WORKSPACE-ROUTING
    given: Two workspaces with different tenant-owned providers.
    when: A person opens the sign-in screen for one workspace by URL, or opens the single sign-on screen and types its id.
    then: Only that workspace's enabled providers and the platform providers are offered, the single sign-on screen asks for no email or password and says so when the id is unknown or the workspace has no provider, the password form never asks for a workspace, the authorization state names the workspace and the provider, and a callback whose state names another workspace is refused.
  - id: AUTH-OIDC-TENANT-BINDING
    given: A tenant-owned provider of workspace A has bound a subject to an account.
    when: The same subject signs in through workspace A's provider again, and then a provider of workspace B asserts the same address.
    then: The first sign-in resolves the account and opens a session in A only; the second is refused unless the account is already a member of B or B's provider provisions it, and it never opens a session in A.
  - id: AUTH-JIT-PROVISION
    given: A provider with JIT enabled, allowed domain example.com and role member.
    when: A verified address at example.com without a membership signs in, and then an address at another domain does.
    then: The first creates or reuses the account, creates an active member membership with the role's scopes and an audit row, and opens a session; the second is refused with a stable error before any write.
  - id: AUTH-JIT-DISABLED
    given: A provider with JIT disabled.
    when: A verified address without a membership signs in.
    then: The sign-in is refused with a stable error and no account or membership is written.
  - id: AUTH-MEMBERSHIP-DISABLE
    given: An account with active memberships in workspaces A and B and a session and an API token in each.
    when: An administrator of A disables the membership in A and later re-enables it.
    then: The sessions and tokens of A are revoked and sign-in into A is refused while B keeps working; after re-enabling, sign-in into A works and previous tokens stay revoked.
  - id: AUTH-PROVIDER-SECRET-ROTATE
    given: Tenant-owned providers sealed under the current auth key.
    when: The deployment rotates the auth key with a previous key configured and runs auth secrets-rotate.
    then: Every provider secret is re-sealed under the current key in bounded batches, sign-in through those providers keeps working throughout, and the report names no secret.
  - id: AUTH-JIT-NO-ABSORPTION
    given: A provider with JIT enabled and an address whose account is already a member of another workspace.
    when: That address signs in through the provider without a membership here.
    then: The sign-in is refused with a stable error, no membership or binding is written, and an audit row records the refusal without the address.
