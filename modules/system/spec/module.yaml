schemaVersion: 2
id: system.core
specVersion: 0.9.0
status: approved
name: System Core
description: Provides the application shell, platform health, module discovery, the deployment's own branding, and the administration surface for module settings.
profile: full
capabilities:
  - api
  - database
  - client
  - translations
dependencies: []
tenancy: required
locales:
  - en
  - pl
invariants:
  - The application shell composes navigation and views from enabled module contributions without importing module implementation details.
  - A module may contribute multiple navigation entries and views using globally unique stable identifiers.
  - Navigation visibility is filtered by the authenticated principal scopes while server authorization remains authoritative.
  - Development navigation and routes are available only to tenant owners, even if a non-owner session contains a stale development scope.
  - Navigation group expansion is application-shell state and does not alter module registrations or route access.
  - The application shell owns compact navigation density and exposes module entries without allowing modules to alter shell layout.
  - Document metadata is rendered during SSR, adopted during hydration, and updated from the active authorized navigation entry.
  - The module catalog exposed to administrators is read from workspace manifests and specifications; it never loads module code and never changes the enabled set.
  - Module settings are declared by their owning module, stored per tenant by auth.core, and changed only through the settings administration API served by system.core, with an audit record.
  - system.core declares the workspace time zone as a shared tenant setting, system.core.timeZone, defaulting to UTC. Only a name the runtime zone database resolves is stored, in its canonical IANA spelling, and any module that declares a dependency on system.core reads it live through the settings runtime; a value this deployment cannot resolve reads back as UTC instead of failing the reader.
  - A feature flag is a module setting declared with kind flag, which is a non-secret boolean with a declared default, a label, a description, and tenant scope, the only scope a flag may take. It is stored, read, validated and overridden exactly like any other setting, so a module reads it on the request path through the settings runtime at no cost beyond the settings read itself; system.core adds no flag store, no flag endpoint and no second write path.
  - The composed module set is CLI-owned and baked at build; a module cannot be added to a running application from the UI. system.core owns per-workspace activation of the modules the application already composes, stored in the tenant table system_module_activations under forced row-level security. A composed module without a row is active.
  - system.core, auth.core, users.core and profile.core are required and always active. A module that another active module declares as a dependency, through a declared module dependency or a required public capability, cannot be deactivated; the refusal names the active dependents. A module cannot be activated while one of its dependencies is inactive.
  - Every activation change appends one audit event, system.module.activated or system.module.deactivated, to the auth.core trail with the module id and the actor. Repeating the current state changes nothing and writes no event.
  - Activation is enforced in three places from one per-workspace snapshot published as the public capability system.modules.v1 and memoised for at most thirty seconds per tenant, refreshed at once by a change made through this instance. defineEndpoint answers 403 MODULE_INACTIVE for an endpoint of an inactive module in the principal's workspace, required modules exempt; the application shell hides the navigation, views, widgets and command palette entries of inactive modules; the endpoint gate never reads a tenant id from the request.
  - The API screen reads the platform's own OpenAPI document and lists the operations it describes. The document is built per caller from the endpoints the running composition defined, so a module a sandbox session wrote is described as soon as it is enabled, and an operation the caller has no permission for, or of a module inactive in its workspace, is not listed. The screen reads, registers no endpoint of its own and is behind system.modules.read.
  - system.core declares the branding of the deployment as the platform-scoped settings system.core.appName, documentTitle, description, ogImageUrl, faviconUrl, themeColor and logoUrl, each with the product's own value as its default. They carry one identity for the whole installation, so the sign-in screen, the shell and a shared link read the same value and a workspace cannot change them; only a principal with system.settings.manage can, through the settings administration API, with an audit record.
  - The application document carries its branding from the server, where the route resolves the stored values once per request, hands them to the server render and emits them as one JSON data block the browser adopts on hydration, so the head, the sidebar wordmark and the boot splash never disagree and the client makes no second request to learn them. A deployment that stored nothing renders the product defaults, and an empty appName, documentTitle, description or logoUrl means the default, never an empty document title or a broken image.
  - A branding value that reaches the document head or an image source is stored only as a same-origin absolute path or an https URL, and themeColor only as a six-digit hex colour. A value that fails its declared pattern is refused when it is written, and every value is escaped where it is rendered, so a stored setting can never introduce markup or a script into the document.
permissions:
  - id: system.workspace.access
    description: Open the authenticated ERP workspace.
  - id: system.modules.read
    description: Read installed module and platform development information.
  - id: system.specs.read
    description: Read approved platform specifications.
  - id: system.runs.read
    description: Read framework implementation runs.
  - id: system.settings.read
    description: Read the declared module settings and their current values.
  - id: system.settings.manage
    description: Change module settings for the workspace.
dataOwnership:
  - system.core owns application-shell layout, navigation behavior, route selection, and contribution composition.
  - Feature modules own their navigation metadata and screen implementations.
  - Module settings values are stored by auth.core on behalf of the declaring module; system.core owns the settings API, the per-module settings section of the Modules drawer, the Flags screen, and the settings permissions.
  - A feature flag is owned by the module that declares it; system.core only lists and edits it, and auth.core records the change.
  - system.core owns the per-workspace module activation rows and the system.modules.v1 capability; the composed module set stays owned by the CLI and flowdular.json.
entities:
  - id: module-activation
    name: Module activation
    description: The last activation decision an owner made for one composed module in one workspace.
    fields:
      - id: moduleId
        type: string
        required: true
        unique: tenant
        maxLength: 128
      - id: active
        type: boolean
        required: true
      - id: changedBy
        type: string
        required: true
        maxLength: 64
        description: Account id of the owner who made the change.
      - id: changedAt
        type: datetime
        required: true
acceptanceScenarios:
  - id: SYSTEM-MULTI-VIEW-MODULE
    given: An enabled module contributes multiple valid navigation entries and matching views.
    when: The application shell builds the client contribution registry.
    then: Every authorized entry is rendered in deterministic order and opens its matching module view.
  - id: SYSTEM-NAV-COLLAPSE
    given: A navigation group contains one or more authorized entries.
    when: The principal activates the group heading.
    then: The application shell toggles that group's items without changing the active route or permissions.
  - id: SYSTEM-NAV-DENSITY
    given: The desktop application shell renders all authorized navigation groups.
    when: Multiple modules contribute several screens.
    then: The sidebar keeps compact item sizing and scrolls without stretching entries to fill available height.
  - id: SYSTEM-DEVELOPMENT-OWNER-ONLY
    given: A non-owner principal opens a Development URL or has a stale Development scope.
    when: The application shell resolves authorized navigation and content.
    then: No Development entry or view is rendered and the principal is returned to the business dashboard.
  - id: SYSTEM-SEO-SSR
    given: A public or authenticated platform route is rendered by the server.
    when: The HTML document is produced.
    then: The head contains one merged title, description, robots policy, and social metadata declaration without a competing static title.
  - id: SYSTEM-SEO-NAVIGATION
    given: An authenticated principal navigates between authorized shell views.
    when: The active view changes without a full document load.
    then: The document title and description update to match the active navigation contribution.
  - id: SYSTEM-OVERVIEW-READ
    given: A principal with system.workspace.access opens the business dashboard.
    when: The workspace overview is requested.
    then: The server returns the enabled and total module counts, the last 14 days of audit events per day for the tenant, and the permissions declared per module, scoped to the principal's tenant.
  - id: SYSTEM-OVERVIEW-DENY
    given: A principal without system.workspace.access.
    when: The principal requests the workspace overview.
    then: The server returns 401 or 403 and no overview data is disclosed.
  - id: SYSTEM-MODULES-LIST
    given: An owner with system.modules.read opens Administration > Modules.
    when: The module catalog is requested.
    then: Every module in the workspace is listed with its id, name, version, permissions, platform surfaces, and enabled state, together with the CLI commands that change the enabled set.
  - id: SYSTEM-MODULES-DENY
    given: A principal without system.modules.read.
    when: The principal requests the module catalog.
    then: The server returns 401 or 403 and no manifest data is disclosed.
  - id: SYSTEM-MODULES-DRAWER
    given: A principal with system.modules.read opens a module row in Administration > Modules.
    when: The drawer renders.
    then: It shows the module overview, its declared permissions, and its declared settings; a module without settings shows a short empty state in the Settings section, and setting controls are disabled without system.settings.manage.
  - id: SYSTEM-SETTINGS-READ
    given: A principal with system.settings.read.
    when: The principal requests the declared settings, from a module drawer or from GET /api/settings.
    then: Every declared setting is listed with its current tenant value, platform-scoped rows are marked as applying to all workspaces, and secret values are never returned.
  - id: SYSTEM-SETTINGS-MANAGE
    given: A principal with system.settings.manage changes a declared setting.
    when: The value passes the declared type, bounds, and enum validation.
    then: The value is stored for the tenant, takes effect on the next read, and an audit event records the change.
  - id: SYSTEM-SETTINGS-VALIDATE
    given: A principal with system.settings.manage submits a value outside the declared type, bounds, or enum, or names an undeclared setting.
    when: The update is processed.
    then: The server rejects it with 400 or 404 and the stored value is unchanged.
  - id: SYSTEM-TIME-ZONE
    given: A principal with system.settings.manage sets the workspace time zone to an IANA zone name.
    when: The value is stored and another module reads system.core.timeZone for that workspace.
    then: The canonical zone name is stored for that workspace alone, the reader sees it on its next read, and a workspace that set nothing reads UTC.
  - id: SYSTEM-TIME-ZONE-INVALID
    given: A principal with system.settings.manage submits a zone name this deployment cannot resolve.
    when: The update is processed.
    then: The server rejects it with 400 INVALID_TIME_ZONE, the stored value is unchanged, and no module ever reads an unresolvable zone.
  - id: SYSTEM-SETTINGS-DENY
    given: A principal without the required settings scope, or a mutation carrying an API token instead of a browser session.
    when: The principal reads or changes a setting.
    then: The server returns 401 or 403 and the stored value is unchanged.
  - id: SYSTEM-FLAGS
    given: Enabled modules declare feature flags and a principal with system.settings.read opens the Flags screen in Administration > Modules.
    when: The principal reads the flags and a principal with system.settings.manage turns one on for this workspace, then resets it.
    then: Every declared flag is listed grouped by its owning module with its current value and a link to the audit trail; the override applies to that workspace alone and takes effect on the next settings read; a reset restores the declared default; each change appends one settings.flag.changed audit event carrying the module, the key, the previous and next values and the actor; and a principal without system.settings.manage is refused with 401 or 403 and changes nothing.
  - id: SYSTEM-MODULE-ACTIVATE
    given: An owner with system.settings.manage opens Administration > Modules, where every composed module is listed with its version, activation state and dependents and is active by default.
    when: The owner deactivates an optional module, confirms the dialog, and later activates it again.
    then: The module is inactive for that workspace alone and active again after the second change; each change is stored with the actor and appends one system.module.deactivated or system.module.activated audit event; a member without system.settings.manage sees the row action refused with a reason, and a request without a browser session, without the scope or without a CSRF token is refused with 401 or 403 and changes nothing.
  - id: SYSTEM-MODULE-DEACTIVATE-REFUSED-DEPENDENCY
    given: An active module that another active module depends on, or a required module.
    when: An owner attempts to deactivate it.
    then: The server refuses with 409 MODULE_HAS_ACTIVE_DEPENDENTS naming the active dependents, or 409 MODULE_REQUIRED, the screen shows the reason, nothing is stored and no audit event is written; once the dependents are inactive the deactivation is accepted, and activating a module whose dependency is inactive is refused with 409 MODULE_DEPENDENCY_INACTIVE.
  - id: SYSTEM-MODULE-INACTIVE-ENDPOINT
    given: A module an owner deactivated for the workspace.
    when: A principal of that workspace calls any endpoint the module defines, or a principal of another workspace calls the same endpoint.
    then: The first request is refused with 403 MODULE_INACTIVE after the permission check, the second is served, and an endpoint of system.core, auth.core, users.core or profile.core is never gated.
  - id: SYSTEM-MODULE-INACTIVE-NAVIGATION
    given: A module an owner deactivated for the workspace.
    when: A member of that workspace opens the application shell.
    then: The shell reads the active module ids through GET /api/system/modules/active, hides the module's navigation entries, views, workspace widgets and command palette search, returns a bookmark of one of its views to the dashboard, and shows every module when the read fails.
  - id: SYSTEM-BRANDING-READ
    given: A principal with system.settings.read opens Administration > Branding.
    when: The screen loads.
    then: Every branding setting is listed with its current value, a value nobody changed shows the product default, the screen states that it applies to every workspace, and every control is disabled without system.settings.manage.
  - id: SYSTEM-BRANDING-MANAGE
    given: A principal with system.settings.manage changes the name, the document title, the description, the preview image, the icon, the theme colour or the logo.
    when: The change is submitted and the application document is requested again.
    then: The value is stored for the deployment, one settings audit event records the module, the key, the previous and the next value and the actor, and the next document carries it in its title, its description, its social metadata, its icon, its theme colour, its sidebar wordmark and its boot splash, for every workspace and for the sign-in screen alike.
  - id: SYSTEM-BRANDING-CLEAR
    given: A branding setting an owner changed earlier.
    when: The owner clears it.
    then: The stored value is removed and the product default is rendered again, with one audit event for the change.
  - id: SYSTEM-BRANDING-VALIDATE
    given: A principal with system.settings.manage submits a name longer than its bound, a URL that is neither a same-origin absolute path nor an https URL, such as a javascript or data address or a protocol-relative one, or a theme colour that is not six hex digits.
    when: The update is processed.
    then: The server refuses it with 400, the stored value is unchanged, and no document ever renders the refused value.
  - id: SYSTEM-BRANDING-ANONYMOUS
    given: A deployment whose branding was changed.
    when: An anonymous visitor loads the sign-in document, or a crawler reads it for a link preview.
    then: The server-rendered head already carries the changed title, description, preview image, icon and theme colour, without a session, without a tenant and without a second request.
  - id: SYSTEM-BRANDING-DENY
    given: A principal without system.settings.manage, or a mutation carrying an API token instead of a browser session.
    when: The principal changes a branding setting.
    then: The server returns 401 or 403, nothing is stored and no audit event is written.
screens:
  - id: branding
    kind: form
    title: Branding
    navigationGroup: Administration
  - id: api
    kind: list
    title: API
    navigationGroup: Administration
  - id: flags
    kind: list
    title: Flags
    navigationGroup: Administration
  - id: modules
    kind: list
    entity: module-activation
    title: Modules
    navigationGroup: Administration
    columns:
      - moduleId
      - active
actions:
  - id: activate-module
    entity: module-activation
    permission: system.settings.manage
    kind: update
    risk: workspace-write
    idempotent: true
    description: Activate a composed optional module for this workspace after its dependencies are active.
  - id: deactivate-module
    entity: module-activation
    permission: system.settings.manage
    kind: update
    risk: workspace-write
    idempotent: true
    description: Deactivate a composed optional module for this workspace unless a required module or an active dependent needs it.
  - id: set-branding
    permission: system.settings.manage
    kind: update
    risk: workspace-write
    idempotent: true
    description: Change one branding setting of the deployment, or clear it so the product default applies again.
  - id: set-flag
    permission: system.settings.manage
    kind: update
    risk: workspace-write
    idempotent: true
    description: Turn a declared feature flag on or off for this workspace, or clear the override so the module default applies again.
settings:
  - key: appName
    type: string
    scope: platform
    default: Flowdular
    description: Name of the backoffice. Shown in the sidebar, the mobile header and the boot splash, used as the site name of a shared link, and as the suffix of the browser tab title unless documentTitle overrides it. 1 to 64 characters.
  - key: documentTitle
    type: string
    scope: platform
    default: ''
    description: Overrides appName in the browser tab title only, for a deployment whose tab should read differently from its navigation. Empty means appName. At most 120 characters.
  - key: description
    type: string
    scope: platform
    default: ''
    description: Meta description and social description of the application document. Empty means the shell's own translated description. At most 200 characters.
  - key: ogImageUrl
    type: string
    scope: platform
    default: /og.png
    description: Preview image of a shared link. A same-origin absolute path or an https URL.
  - key: faviconUrl
    type: string
    scope: platform
    default: /favicon.svg
    description: Icon of the browser tab. A same-origin absolute path or an https URL.
  - key: themeColor
    type: string
    scope: platform
    default: '#141B2E'
    description: Colour a mobile browser paints its chrome with, as a six-digit hex value.
  - key: logoUrl
    type: string
    scope: platform
    default: ''
    description: Image shown instead of the built-in mark in the sidebar and the mobile header. Empty means the built-in mark. A same-origin absolute path or an https URL.
decisions:
  - id: D-BRANDING-SCOPE
    question: Is the branding one identity for the deployment or one per workspace?
    answer: One for the deployment, stored as platform-scoped settings, because the sign-in screen and a shared link are rendered before any workspace is known.
    decidedBy: user
  - id: D-BRANDING-FIELDS
    question: What is configurable?
    answer: The name and the document title, the description and the preview image, the icon and the theme colour, and a logo image.
    decidedBy: user
  - id: D-BRANDING-SURFACE
    question: Where is the branding edited?
    answer: Its own Branding screen in Administration, which writes through the existing settings administration API rather than a second write path.
    decidedBy: user
  - id: D-BRANDING-LOGO-UPLOAD
    question: Can an owner upload a logo file?
    answer: No. A logo is the address of an image the deployment already serves; an upload would need a storage bucket, a public read path and a content-type gate of its own.
    decidedBy: default
  - id: D-BRANDING-DELIVERY
    question: How does the branding reach the document?
    answer: The application route resolves it once per request and emits it as page state for the server render and as one JSON data block for hydration, the way the application path already travels; the client never fetches it.
    decidedBy: default
  - id: D-BRANDING-URL-SAFETY
    question: Which addresses may be stored?
    answer: A same-origin absolute path or an https URL, refusing javascript, data and protocol-relative addresses in the declared pattern, so the refusal happens at the write and not at the render.
    decidedBy: default
  - id: D-MODULE-ACTIVATION-SCOPE
    question: What can the administration UI change about modules?
    answer: Per-workspace activation of the modules the application already composes; adding or removing a module stays a CLI operation because the composition is baked at build.
    decidedBy: user
  - id: D-MODULE-ACTIVATION-REQUIRED
    question: Which modules can never be deactivated?
    answer: system.core, auth.core, users.core and profile.core, and any module another active module depends on through a declared module dependency or a required public capability; the refusal names the active dependents.
    decidedBy: user
  - id: D-MODULE-ACTIVATION-DEFAULT
    question: What is the state of a module nobody has touched?
    answer: Active; the table holds only decisions an owner made, and a row is written for the module being changed, never for the whole set.
    decidedBy: default
  - id: D-MODULE-ACTIVATION-SNAPSHOT
    question: How often is the activation read?
    answer: Once per tenant into a memoised snapshot held for thirty seconds and at most 1024 tenants per process, invalidated at once by a change through the same instance; another instance sees the change within the snapshot lifetime.
    decidedBy: default
  - id: D-MODULE-ACTIVATION-AUDIT
    question: Where is a change recorded?
    answer: One system.module.activated or system.module.deactivated event in the auth.core audit trail, carrying the module id, the resulting state and the actor; a no-op repeat writes nothing.
    decidedBy: default
  - id: D-MODULE-ACTIVATION-SHELL
    question: How does the shell learn which modules are active?
    answer: From GET /api/system/modules/active, served to every member holding system.workspace.access, read once per workspace before the shell renders; a failed read shows every module because the server gate still refuses an inactive module's API.
    decidedBy: default
  - id: D-MODULE-ACTIVATION-AGENT-TOOLS
    question: Are the agent tools of an inactive module withheld?
    answer: Not yet. The harness tool registry has no per-tenant module hook and a tool carries no module id, so this is a documented follow-up; a tool of an inactive module that calls the module's service still runs.
    decidedBy: default
outOfScope:
  - Uploading a logo or a preview image through the screen; the settings hold the address of an image the deployment already serves.
  - Branding a single workspace differently from the deployment, which would leave the sign-in screen and a shared link without an answer.
  - Restyling the product beyond these values, so colour themes, fonts, custom CSS and the branding of the e-mails auth.core sends stay out.
  - Adding or removing a module from a running application through the UI; the composition is CLI-owned and baked at build.
  - Withholding the agent tools of an inactive module from a workspace, which needs a per-tenant hook in the harness tool registry.
